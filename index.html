              {GOALS.map(g => (
                <button key={g.id} onClick={() => setGoal(g.id)}
                  className={`btn-press p-3 rounded-2xl border text-[11.5px] font-bold text-left ${goal === g.id ? 'bg-cream-100 text-night-900 border-cream-100' : 'bg-night-600 text-night-100 border-night-400/40'}`}>
                  {g.label}
                </button>
              ))}
            </div>
            <button onClick={() => setDemo(d => !d)} className={`btn-press flex items-center gap-2.5 p-3.5 rounded-2xl border text-left ${demo ? 'border-moon-400/60 bg-moon-400/10' : 'border-night-400/40 bg-night-600'}`}>
              <span className={`text-[17px] ${demo ? '' : 'opacity-30'}`}>✅</span>
              <span>
                <span className="block text-[12px] font-black text-cream-50">デモデータ入りではじめる（おすすめ）</span>
                <span className="block text-[10px] text-night-200 mt-0.5">2週間分の記録・回数券・姿勢分析のサンプルで、全機能をすぐ体験できます。設定からいつでもリセットOK。</span>
              </span>
            </button>
            <div className="mt-6"><Btn kind="moon" full onClick={() => onStart(name.trim() || 'ゲスト', goal, demo)}>スーピーくんと はじめる 🌙</Btn></div>
          </div>
        )}
      </div>
    </NightSky>
  );
}

function SettingsScreen() {
  const { state, update, back, replaceAll } = useApp();
  const [name, setName] = useState(state.profile.name);
  const [confirm, setConfirm] = useState(null); // 'demo' | 'reset'
  return (
    <div className="min-h-screen">
      <BackHeader title="⚙️ せってい" onBack={back} />
      <div className="p-4 pb-8">
        <SectionTitle icon="👤" title="プロフィール" />
        <div className="card p-4">
          <label className="block">
            <span className="text-[11px] font-bold text-night-200">おなまえ</span>
            <input value={name} onChange={e => setName(e.target.value)}
              className="mt-1 w-full bg-night-600 border border-night-400/50 rounded-xl px-3.5 py-2.5 text-[14px] font-bold text-cream-50 outline-none focus:border-moon-400" />
          </label>
          <span className="block text-[11px] font-bold text-night-200 mt-3 mb-1.5">お悩み（提案のパーソナライズに使います）</span>
          <div className="flex flex-wrap gap-1.5">
            {GOALS.map(g => (
              <Chip key={g.id} active={state.profile.goal === g.id} onClick={() => update(st => { st.profile.goal = g.id; })}>{g.label}</Chip>
            ))}
          </div>
          <div className="mt-3"><Btn small onClick={() => { update(st => { st.profile.name = name.trim() || 'ゲスト'; }); toast('保存しました'); }}>保存する</Btn></div>
        </div>

        <SectionTitle icon="🗄️" title="データ" sub="データはこの端末のブラウザにのみ保存されます" />
        <div className="card p-4 flex flex-col gap-2">
          <Btn kind="ghost" full onClick={() => setConfirm('demo')}>🧪 デモデータを入れなおす</Btn>
          <Btn kind="danger" full onClick={() => setConfirm('reset')}>🗑️ すべてのデータを削除する</Btn>
        </div>

        <SectionTitle icon="🏥" title="このアプリについて" />
        <div className="card p-4 text-center">
          <img src="assets/logo.jpg" alt="睡眠整体サロン SLEEPY" className="w-28 mx-auto rounded-2xl border border-night-400/40"
            onError={e => { e.currentTarget.style.display = 'none'; }} />
          <p className="text-[13px] font-black text-cream-50 mt-3">睡眠整体サロン SLEEPY</p>
          <p className="text-[10.5px] text-night-200 mt-0.5">Produced by KADOMORI</p>
          <p className="text-[10px] text-night-300 mt-2 leading-relaxed">公式快眠パートナーアプリ v1.0<br />マスコット：スーピーくん 🐑</p>
        </div>
      </div>

      <Modal open={!!confirm} onClose={() => setConfirm(null)}>
        <div className="text-center py-2">
          <span className="text-[40px]">{confirm === 'reset' ? '🗑️' : '🧪'}</span>
          <h3 className="text-[15px] font-black text-cream-50 mt-2">{confirm === 'reset' ? 'すべてのデータを削除しますか？' : 'デモデータで上書きしますか？'}</h3>
          <p className="text-[11.5px] text-night-200 mt-1.5">いまの記録・スーピーくんの成長は元に戻せません。</p>
          <div className="mt-4 flex gap-2">
            <Btn kind="ghost" full onClick={() => setConfirm(null)}>やめる</Btn>
            <Btn kind="danger" full onClick={() => {
              if (confirm === 'reset') { replaceAll(defaultState()); }
              else { replaceAll(seedDemoState(state.profile.name, state.profile.goal)); toast('デモデータを入れました'); }
              setConfirm(null); back();
            }}>実行する</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}

/* ============================================================
   SECTION 18: アプリシェル（ルーター・タブバー・レベルアップ）
   ============================================================ */
const TAB_SCREENS = ['home', 'sleep', 'soupy', 'care', 'shop'];

function TabBar({ current, onTab }) {
  const tabs = [
    { id: 'home', icon: '🏠', label: 'ホーム' },
    { id: 'sleep', icon: '🌙', label: 'すいみん' },
    { id: 'soupy', icon: null, label: 'そだてる' },
    { id: 'care', icon: '🤸', label: 'ケア' },
    { id: 'shop', icon: '🛍️', label: 'ショップ' },
  ];
  return (
    <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-50 px-3 pb-3">
      <div className="bg-night-800/95 border border-night-500/60 rounded-3xl shadow-2xl shadow-black/50 flex items-end justify-around px-1 pt-1.5 pb-2" style={{ backdropFilter: 'blur(12px)' }}>
        {tabs.map(t => {
          const active = current === t.id;
          if (t.id === 'soupy') return (
            <button key={t.id} onClick={() => onTab(t.id)} className="btn-press relative -mt-7 flex flex-col items-center" aria-label="そだてる">
              <span className={`w-14 h-14 rounded-full flex items-center justify-center border-4 ${active ? 'border-moon-400' : 'border-night-500'} bg-night-700 shadow-lg shadow-black/40 overflow-hidden`}>
                <div className="mt-2"><Soupy size={44} animate={false} showZzz={false} /></div>
              </span>
              <span className={`text-[9px] font-black mt-1 ${active ? 'text-moon-300' : 'text-night-200'}`}>{t.label}</span>
            </button>
          );
          return (
            <button key={t.id} onClick={() => onTab(t.id)} className="btn-press flex flex-col items-center gap-0.5 px-2.5 py-1" aria-label={t.label}>
              <span className={`text-[19px] ${active ? '' : 'grayscale opacity-60'}`}>{t.icon}</span>
              <span className={`text-[9px] font-black ${active ? 'text-moon-300' : 'text-night-300'}`}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function LevelUpModal({ info, onClose }) {
  if (!info) return null;
  return (
    <Modal open onClose={onClose}>
      <div className="text-center py-2">
        <div className="relative inline-block">
          <Soupy size={160} mood="excited" showZzz={false} />
          {Array.from({ length: 12 }).map((_, i) => (
            <span key={i} className="absolute left-1/2 top-1/2 text-[17px]" style={{
              '--tx': `${Math.cos(i / 12 * Math.PI * 2) * 95}px`, '--ty': `${Math.sin(i / 12 * Math.PI * 2) * 95}px`,
              animation: `star-burst 1s ease-out ${i * 0.05}s both`,
            }}>{i % 3 === 0 ? '🌟' : i % 3 === 1 ? '⭐' : '✨'}</span>
          ))}
        </div>
        <p className="text-[12px] font-black text-moon-300 tracking-widest">LEVEL UP!</p>
        <h3 className="text-[20px] font-black text-cream-50 mt-1">スーピーくんが Lv.{info.lv} になった！</h3>
        <p className="text-[12px] text-night-100 font-bold mt-1">「{stageTitle(info.lv)}」</p>
        {info.unlocked.length > 0 && (
          <div className="card-deep p-3.5 mt-3">
            <p className="text-[10.5px] font-black text-moon-300 mb-1.5">🎁 あたらしい きせかえ！</p>
            {info.unlocked.map(a => <p key={a.id} className="text-[13px] font-black text-cream-50">{a.emoji} {a.name}</p>)}
            <p className="text-[10px] text-night-200 mt-1.5">「そだてる」タブでそうびできます</p>
          </div>
        )}
        <div className="mt-4"><Btn kind="moon" full onClick={onClose}>やったー！</Btn></div>
      </div>
    </Modal>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) return (
      <div className="mx-auto max-w-[430px] min-h-screen flex flex-col items-center justify-center p-8 text-center">
        <span className="text-[46px]">😴💦</span>
        <p className="text-[14px] font-black text-cream-50 mt-3">ごめんなさい、エラーがおきました</p>
        <p className="text-[10px] text-night-300 mt-2 break-all">{String(this.state.err)}</p>
        <button className="mt-4 px-5 py-3 rounded-2xl bg-cream-100 text-night-900 font-black text-[13px]" onClick={() => location.reload()}>再読み込み</button>
      </div>
    );
    return this.props.children;
  }
}

function App() {
  const [state, setState] = useState(loadState);
  const [stack, setStack] = useState([{ name: 'home' }]);
  const [levelUp, setLevelUp] = useState(null);
  const prevLvRef = useRef(levelFromXp(state.soupy.xp).lv);

  useEffect(() => {
    const lv = levelFromXp(state.soupy.xp).lv;
    if (lv > prevLvRef.current) {
      setLevelUp({ lv, unlocked: ACCESSORIES.filter(a => a.lv > prevLvRef.current && a.lv <= lv) });
    }
    prevLvRef.current = lv;
  }, [state.soupy.xp]);

  const update = useCallback((fn) => setState(prev => { const n = structuredClone(prev); fn(n); saveState(n); return n; }), []);
  const replaceAll = useCallback((st) => { saveState(st); prevLvRef.current = levelFromXp(st.soupy.xp).lv; setState(st); setStack([{ name: 'home' }]); }, []);
  const nav = useCallback((name, params) => {
    setStack(s => TAB_SCREENS.includes(name) ? [{ name, params }] : [...s, { name, params }]);
  }, []);
  const back = useCallback(() => setStack(s => s.length > 1 ? s.slice(0, -1) : [{ name: 'home' }]), []);

  useEffect(() => { window.scrollTo(0, 0); }, [stack.length, stack[stack.length - 1].name]);

  const route = stack[stack.length - 1];
  const isTab = stack.length === 1 && TAB_SCREENS.includes(route.name);

  if (!state.onboarded) {
    return <Onboarding onStart={(name, goal, demo) => {
      const st = demo ? seedDemoState(name, goal) : (() => { const d = defaultState(); d.onboarded = true; d.profile.name = name; d.profile.goal = goal; return d; })();
      replaceAll(st);
      toast(`ようこそ、${name}さん！🐑`);
    }} />;
  }

  let screen = null;
  switch (route.name) {
    case 'home': screen = <HomeScreen />; break;
    case 'sleep': screen = <SleepScreen route={route} />; break;
    case 'soupy': screen = <SoupyScreen />; break;
    case 'care': screen = <CareScreen route={route} />; break;
    case 'shop': screen = <ShopScreen />; break;
    case 'stretchPlay': screen = <StretchPlayScreen route={route} />; break;
    case 'article': screen = <ArticleScreen route={route} />; break;
    case 'product': screen = <ProductScreen route={route} />; break;
    case 'cart': screen = <CartScreen />; break;
    case 'member': screen = <MemberScreen />; break;
    case 'posture': screen = <PostureScreen route={route} />; break;
    case 'postureCompare': screen = <PostureCompareScreen />; break;
    case 'visit': screen = <VisitFlowScreen />; break;
    case 'settings': screen = <SettingsScreen />; break;
    default: screen = <HomeScreen />;
  }

  return (
    <Ctx.Provider value={{ state, update, replaceAll, nav, back, route }}>
      <div className="mx-auto max-w-[430px] min-h-screen relative shadow-2xl shadow-black/60"
        style={{ background: 'linear-gradient(180deg,#0d1424 0%,#121a2e 40%,#0d1424 100%)', paddingBottom: isTab ? 96 : 24 }}>
        <div key={stack.length + ':' + route.name}>{screen}</div>
        {isTab && <TabBar current={route.name} onTab={t => nav(t)} />}
        <LevelUpModal info={levelUp} onClose={() => setLevelUp(null)} />
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
