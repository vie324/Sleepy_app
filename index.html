          <ProgressBar pct={doneCount / SEC_TOTAL * 100} color={C.moon} h={7} />

        <Sec en="Profile" title="基本情報" n={1} {...secProps}>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="お名前（ニックネームOK）"
            className="w-full bg-night-600 border border-night-400/50 rounded-[9px] px-3.5 py-2.5 text-[13px] font-bold text-cream-50 outline-none focus:border-moon-400" />
          <p className="text-[10.5px] font-bold text-night-200 mt-3 mb-1.5">年代</p>
          <div className="flex flex-wrap gap-1.5">{COUNSEL_AGES.map(a => <Chip key={a} active={age === a} onClick={() => setAge(a)}>{a}</Chip>)}</div>
          <p className="text-[10.5px] font-bold text-night-200 mt-3 mb-1.5">お仕事・生活スタイル</p>

function HealthSyncScreen() {
  const { state, update, back } = useApp();
  const [busy, setBusy] = useState(null);
  const [preview, setPreview] = useState(null); // {logs, source}
  const [overwrite, setOverwrite] = useState(false);
  const xmlRef = useRef(null), csvRef = useRef(null);

  const openPreview = (logs, source) => {
    const dates = Object.keys(logs).sort();
    if (!dates.length) { toast('睡眠データが見つかりませんでした', 'err'); return; }
    setPreview({ logs, source, dates });
  };
  const onXml = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    setBusy('ファイルを解析中…（大きい場合は1〜2分かかります）');
    try { openPreview(await parseAppleHealthXml(f, mb => setBusy(`解析中… ${(mb / 1048576).toFixed(0)}MB 読み込み`)), 'Apple ヘルスケア'); }
    catch (err) { console.warn(err); toast('解析に失敗しました。export.xml を選択してください', 'err'); }
    setBusy(null);
  };
  const onCsv = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try { openPreview(parseSleepCsv(await f.text()), 'CSV'); }
    catch (err) { toast('CSVを読み込めませんでした', 'err'); }
  };
  const applyImport = () => {
    let added = 0, skipped = 0;
    update(st => {
      Object.entries(preview.logs).forEach(([date, log]) => {
        const exists = st.sleepLogs[date];
        if (exists && !overwrite && exists.source !== log.source) { skipped++; return; }
        st.sleepLogs[date] = log; added++;
      });
    });
    toast(`${added}日分を取り込みました${skipped ? `（手入力ずみ${skipped}日はスキップ）` : ''}`);
    setPreview(null); back();
  };
  const csvTemplate = () => {
    const blob = new Blob(['date,bed,wake,quality,awakenings\n2026-08-01,23:30,06:30,4,1\n'], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'sleepy_import_template.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  return (
    <div className="min-h-screen">
      <BackHeader title="ヘルスケア連携" onBack={back} />
      <div className="p-4 pb-8">
        <div className="card-deep p-3.5 flex gap-2.5 items-center">
          <Soupy size={46} animate={false} showZzz={false} />
          <p className="font-maru text-[11.5px] text-night-100 leading-relaxed font-bold">スマホの睡眠データをまとめて取り込めるよ。むずかしければ、いつもどおり手入力でOK！</p>
        </div>

        <div className="card p-4 mt-4">
          <p className="kicker mb-1">iPhone</p>
          <p className="text-[13px] font-bold text-cream-50">Apple ヘルスケアから取り込む</p>
          <ol className="text-[11px] text-night-100 leading-relaxed mt-2 space-y-1 list-decimal list-inside">
            <li>ヘルスケアApp右上のアイコン →「すべてのヘルスケアデータを書き出す」</li>
            <li>共有先で「"ファイル"に保存」→ 保存したzipをタップして展開</li>
            <li>展開フォルダ内の <span className="text-moon-300 font-bold">export.xml</span> を下から選択</li>
          </ol>
          <div className="mt-3"><Btn kind="moon" full onClick={() => xmlRef.current && xmlRef.current.click()}><Icon name="watch" size={15} className="mr-1" />export.xml を選ぶ</Btn></div>
          <input ref={xmlRef} type="file" accept=".xml,text/xml" className="hidden" onChange={onXml} />
        </div>

        <div className="card p-4 mt-3">
          <p className="kicker mb-1">Android / その他</p>
          <p className="text-[13px] font-bold text-cream-50">CSVファイルから取り込む</p>
          <p className="text-[11px] text-night-100 leading-relaxed mt-1.5">睡眠アプリの書き出しCSVを、テンプレートの形式（date, bed, wake, quality, awakenings）に合わせて取り込めます。</p>
          <div className="mt-3 flex gap-2">
            <Btn kind="ghost" onClick={csvTemplate}><Icon name="download" size={14} className="mr-1" />テンプレート</Btn>
            <Btn kind="moon" full onClick={() => csvRef.current && csvRef.current.click()}><Icon name="upload" size={14} className="mr-1" />CSVを選ぶ</Btn>
          </div>
          <input ref={csvRef} type="file" accept=".csv,text/csv" className="hidden" onChange={onCsv} />
        </div>

        <p className="text-[10px] text-night-300 mt-3 leading-relaxed">自動同期（HealthKit / ヘルスコネクト直結）はスマホアプリ化で対応予定です。取り込んだ日はグラフや提案にそのまま反映され、手入力の記録は上書きされません（下の設定でON時を除く）。</p>
      </div>

      {busy && (
        <div className="fixed inset-0 z-[95] bg-black/70 flex flex-col items-center justify-center p-8 text-center">
          <Soupy size={110} className="mx-auto" />
          <p className="text-[12.5px] font-bold text-cream-50 mt-3">{busy}</p>
        </div>
      )}

      <Modal open={!!preview} onClose={() => setPreview(null)}>
        {preview && (
          <div>
            <p className="kicker mb-1">{preview.source}</p>
            <h3 className="text-[16px] font-bold text-cream-50">{preview.dates.length}日分の睡眠データが見つかりました</h3>
            <p className="text-[11px] text-night-200 mt-1">{fmtMD(preview.dates[0])} 〜 {fmtMD(preview.dates[preview.dates.length - 1])} ・ 平均スコア {Math.round(avg(Object.values(preview.logs).map(l => l.score)))}点</p>
            <div className="card-deep p-2 mt-3 max-h-44 overflow-y-auto">
              {preview.dates.slice(-10).reverse().map(d => {
                const l = preview.logs[d];
                return (
                  <div key={d} className="flex items-center gap-2.5 px-2 py-1.5 text-[11px] border-b border-night-500/40 last:border-0">
                    <span className="w-14 text-night-200 font-bold">{fmtMD(d)}</span>
                    <span className="text-night-100">{l.bed}→{l.wake}</span>
                    <span className="ml-auto font-bold" style={{ color: scoreLabel(l.score).color }}>{l.score}点</span>
                    {state.sleepLogs[d] && <span className="text-[9px] text-night-300">記録あり</span>}
                  </div>
                );
              })}
            </div>
            <button onClick={() => setOverwrite(o => !o)} className="mt-3 flex items-center gap-2 text-[11.5px] font-bold text-night-100">
              <span className={`inline-flex items-center justify-center w-5 h-5 rounded-[6px] border ${overwrite ? 'bg-moon-400 border-moon-400 text-night-900' : 'border-night-300/50 text-transparent'}`}><Icon name="check" size={13} strokeWidth={2.4} /></span>
              手入力ずみの日も上書きする
            </button>
            <div className="mt-4 flex gap-2">
              <Btn kind="ghost" full onClick={() => setPreview(null)}>やめる</Btn>
              <Btn kind="moon" full onClick={applyImport}>取り込む</Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

function SoundsScreen() {
  const { state, back } = useApp();
  const [playing, setPlaying] = useState(Sound.playing);
  const [volume, setVolume] = useState(0.5);
  const [timer, setTimer] = useState(30);
  const lastAssess = (state.assessments || [])[state.assessments.length - 1];
  const recSoundId = lastAssess ? assessProposal(lastAssess).soundId : null;

  const toggle = (id) => {
    if (playing === id) { Sound.stop(); setPlaying(null); return; }
    try {
      Sound.start(id, volume);
      Sound.setTimer(timer, () => setPlaying(null));
      setPlaying(id);
    } catch (e) { console.warn(e); toast('この環境では音声を再生できませんでした', 'err'); }
  };

  return (
    <div className="min-h-screen">
      <BackHeader title="おやすみサウンド" onBack={back} />
      <div className="p-4 pb-8">
        <div className="card-deep p-3.5 flex gap-2.5 items-center">
          <Soupy size={46} animate={false} showZzz={false} />
          <p className="text-[11.5px] text-night-100 leading-relaxed font-bold">周波数の音は、その場でこの端末が奏でているよ。画面を閉じても流れつづけるから、そのまま目を閉じてね。</p>
        </div>

        <div className="mt-4 flex flex-col gap-2.5">
          {SOUND_PRESETS.map(s => (
            <button key={s.id} onClick={() => toggle(s.id)}
              className={`btn-press card p-4 text-left flex items-center gap-3 ${playing === s.id ? 'ring-2 ring-moon-400' : ''}`}>
              <span className={`w-12 h-12 rounded-[10px] flex items-center justify-center ${playing === s.id ? 'bg-moon-400/20 text-moon-300' : 'bg-night-500 text-cream-100'}`}><Icon name={s.icon} size={22} /></span>
              <span className="flex-1 min-w-0">
                <span className="text-[9.5px] font-bold text-moon-300">{s.tag}{s.id === recSoundId && <span className="ml-1.5 text-[8.5px] text-night-900 bg-moon-400 rounded-full px-1.5 py-0.5">診断結果からのおすすめ</span>}</span>
                <span className="block text-[13.5px] font-bold text-cream-50">{s.name}</span>
                <span className="block text-[10.5px] text-night-200 mt-0.5 leading-relaxed">{s.desc}</span>
              </span>
              <Icon name={playing === s.id ? 'pause' : 'play'} size={20} className="text-moon-300" />
            </button>
          ))}
        </div>

        <div className="card p-4 mt-4">
          <p className="text-[11px] font-bold text-night-100 mb-1.5">おんりょう</p>
          <input type="range" min="0" max="1" step="0.05" value={volume} className="w-full accent-[#f6d97e]"
            onChange={e => { const v = Number(e.target.value); setVolume(v); Sound.setVolume(v); }} />
          <p className="text-[11px] font-bold text-night-100 mb-1.5 mt-3">タイマー（自動でとまる）</p>
          <div className="flex gap-1.5">
            {[15, 30, 60, 0].map(m => (
              <Chip key={m} active={timer === m} onClick={() => { setTimer(m); if (playing) Sound.setTimer(m, () => setPlaying(null)); }}>
                {m === 0 ? 'なし' : `${m}分`}
              </Chip>
            ))}
          </div>
        </div>
        <p className="text-[10px] text-night-300 mt-3 leading-relaxed">シータ波はイヤホン・ヘッドホンで左右の音を分けて聴くと効果的です。運転中の使用はお控えください。</p>
      </div>
    </div>
  );
}

/* ============================================================

function QuickCheckScreen({ route }) {
  const { state, update, back } = useApp();
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [result, setResult] = useState(null);

  const pick = (v) => {
    const next = [...answers]; next[idx] = v;
    setAnswers(next);
    if (idx + 1 < QUICK_QS.length) { setIdx(idx + 1); return; }
    const res = quickResult(next);
    const rec = { id: uid(), date: todayStr(), answers: next, ...res };
    update(st => {
      st.quickChecks.push(rec);
      if (!xpDoneToday(st, 'かんたん診断')) gainXp(st, 15, 'かんたん診断');
    });
    setResult(rec);
  };

  return (
    <div className="min-h-screen">
      <BackHeader title="かんたん睡眠診断" onBack={back} />
      {!result ? (
        <div className="p-4">
          <ProgressBar pct={(idx) / QUICK_QS.length * 100} color={C.moon} />
          <div className="flex items-center justify-between mt-1.5">
            <p className="text-[11.5px] text-night-100 font-bold">全{QUICK_QS.length}問中 <span className="text-moon-300 text-[13px]">{idx + 1}問目</span></p>
            <p className="text-[11px] text-night-200 font-bold">のこり{QUICK_QS.length - idx}問・約{Math.max(1, Math.ceil((QUICK_QS.length - idx) * 20 / 60))}分</p>
          </div>
          <div className="card p-5 mt-3 anim-pop" key={idx}>
            <p className="text-[16px] font-bold text-cream-50 leading-relaxed">{QUICK_QS[idx].q}</p>
            <div className="flex flex-col gap-2 mt-4">
              {QUICK_QS[idx].opts.map((o, i) => (
                <button key={i} onClick={() => pick(i)}
                  className="btn-press text-left px-4 py-3.5 rounded-[10px] border border-night-400/40 bg-night-600 text-[13px] font-bold text-cream-50 hover:border-moon-400/60">
                  {o}
                </button>
              ))}
            </div>
            {idx > 0 && <button onClick={() => setIdx(idx - 1)} className="mt-3 text-[11px] font-bold text-night-300">← ひとつ前へ</button>}
          </div>
          <div className="card-deep p-3.5 mt-3 flex gap-2.5 items-center">
            <Soupy size={40} animate={false} showZzz={false} />
            <p className="text-[11px] text-night-100 font-bold">直感でOK！ぜんぶで{QUICK_QS.length}問だよ</p>
          </div>
        </div>
      ) : (
        <div className="p-4 pb-8 anim-slide-up">
          <div className="card p-5 text-center">

function AssessScreen({ route }) {

  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [result, setResult] = useState(null);
  const q = ASSESS_QS[idx];
  const cat = q && ASSESS_CATS.find(c => c.id === q.cat);

  const resume = () => {
    setAnswers(draft.answers || []);
    setIdx(Math.min(draft.idx || 0, ASSESS_QS.length - 1));
    setPhase('quiz');

  const pick = (v) => {
    const next = [...answers]; next[idx] = v;
    setAnswers(next);
    if (idx + 1 < ASSESS_QS.length) {
      setIdx(idx + 1);
      update(st => { st.assessDraft = { answers: next, idx: idx + 1, date: todayStr() }; }); // 途中保存
      return;
    }
    const res = assessResult(next);
    const rec = { id: uid(), date: todayStr(), answers: next, ...res };
    update(st => {
      st.assessments.push(rec); // 結果はこの時点で自動保存（どのボタンで戻っても消えません）

      if (!xpDoneToday(st, 'ほんかく診断')) gainXp(st, 25, 'ほんかく診断');

function SlidePlayerScreen({ route }) {

    <div className="min-h-screen flex flex-col">

      </div>

  );

const FEEL_AXES = [
  { id:'light', icon:'sparkle', label:'からだの軽さ' },
  { id:'neck',  icon:'stretch', label:'首・肩の動かしやすさ' },
  { id:'mood',  icon:'sun', label:'気分のスッキリ感' },
];

function buildVisitReport(state, vf) {
  const posture = state.posture || [];
  const todayRecs = posture.filter(p => p.date === todayStr());
  const before = posture.find(p => p.id === vf.beforeId) || [...todayRecs].reverse().find(p => p.phase === 'before') || null;
  const after = posture.find(p => p.id === vf.afterId) || [...todayRecs].reverse().find(p => p.phase === 'after') || null;
  const logs7 = recentLogs(state, 7);
  const assess = (state.assessments || [])[state.assessments.length - 1] || null;
  const comments = [];
  if (before && after) {
    const d = after.score - before.score;
    comments.push(d > 0
      ? `姿勢スコアが ${before.score}点 → ${after.score}点（+${d}）に改善。${after.mode === 'side' ? '首のラインが整い、呼吸の通り道がひろがった状態です。' : '左右のバランスが整い、からだが休まりやすい状態です。'}`
      : `姿勢スコアは ${before.score}点 → ${after.score}点。数値の変化は小さくても、筋肉のゆるみは呼吸の深さに表れます。`);
  }
  if (vf.feelBefore && vf.feelAfter) {
    const gains = FEEL_AXES.map(a => vf.feelAfter[a.id] - vf.feelBefore[a.id]);
    const up = FEEL_AXES.filter((a, i) => gains[i] > 0);
    if (up.length) comments.push(`ご自身の体感でも「${up.map(a => a.label).join('」「')}」がアップ。この感覚が、副交感神経が働き始めたサインです。`);
  }
  if (logs7.length) comments.push(`この7日間の平均睡眠スコアは${Math.round(avg(logs7.map(l => l.score)))}点。今夜の記録で施術後の変化を確認しましょう。`);
  comments.push('整えた状態は2〜3週間かけて少しずつ戻ります。処方ホームケアで「戻りにくいからだ」へ。');
  return {
    date: todayStr(),
    before: before ? { score: before.score, img: before.img, mode: before.mode } : null,
    after: after ? { score: after.score, img: after.img, mode: after.mode } : null,
    feelBefore: vf.feelBefore || null, feelAfter: vf.feelAfter || null,
    assessTotal: assess ? assess.total : null,
    prescribed: (vf.prescribed || []).slice(),
    comments,
  };
}

          })}

      <p className="brand-serif text-center text-[10.5px] tracking-[.2em] text-moon-300 mt-3.5">─ 睡眠から、人生を変える。─</p>

            return (
              <div key={i} className={`card overflow-hidden transition ${current ? 'ring-2 ring-moon-400/70' : ''} ${!done && !current ? 'opacity-55' : ''}`}>
                <div className="flex items-center gap-3 px-4 py-3">
                  <span className={`w-9 h-9 rounded-full flex items-center justify-center text-[16px] shrink-0 ${done ? 'bg-cpara/25' : current ? 'bg-moon-400/20' : 'bg-night-500'}`}>
                    {done ? <Icon name="check" size={15} className="text-[#4cc2ae]" strokeWidth={2.2} /> : <Icon name={s.icon} size={16} className="text-cream-100" />}
                  </span>
                  <div className="flex-1">
                    <p className={`text-[13px] font-bold ${done ? 'text-night-200' : 'text-cream-50'}`}>{i + 1}. {s.title}</p>
                    <p className="text-[10px] text-night-300">{s.desc}</p>
                  </div>
                  {current && <span className="text-[9px] font-bold text-moon-300 bg-moon-400/10 border border-moon-400/40 rounded-full px-2 py-0.5">いまここ</span>}
                </div>
                {current && <div className="px-4 pb-4 anim-slide-up">{s.content}</div>}
              </div>
            );
          })}
        </div>
      </div>

      <CheckinModal open={checkin} onClose={() => setCheckin(false)} />

      <Modal open={!!celebrate} onClose={() => { setCelebrate(null); back(); }}>
        {celebrate && (
          <div>
            <div className="text-center">
              <div className="relative inline-block">
                <Soupy size={130} mood="excited" showZzz={false} />
                {Array.from({ length: 10 }).map((_, i) => (
                  <span key={i} className="absolute left-1/2 top-1/2 text-[16px]" style={{
                    '--tx': `${Math.cos(i / 10 * Math.PI * 2) * 85}px`, '--ty': `${Math.sin(i / 10 * Math.PI * 2) * 85}px`,
                    animation: `star-burst .9s ease-out ${i * 0.06}s both`,
                  }}><Icon name="star" size={15} className="text-moon-400" /></span>
                ))}
              </div>
              <h3 className="text-[16px] font-bold text-cream-50">本日もありがとうございました！</h3>
            </div>
            <div className="card p-4 mt-3"><ReportView report={celebrate} /></div>
            <p className="text-[11px] text-night-200 mt-3 text-center">今夜の睡眠記録で、施術後のねむりの変化を見てみてね</p>

      </Modal>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) return (
      <div className="mx-auto max-w-[430px] min-h-screen flex flex-col items-center justify-center p-8 text-center">

    return this.props.children;
  }
}

function App() {
  const [state, setState] = useState(loadState);
  const [stack, setStack] = useState([{ name: 'home' }]);
  const [levelUp, setLevelUp] = useState(null);
  const prevLvRef = useRef(levelFromXp(state.soupy.xp).lv);

  useEffect(() => {
    const lv = levelFromXp(state.soupy.xp).lv;
    if (lv > prevLvRef.current) {
      setLevelUp({ lv, unlocked: ACCESSORIES.filter(a => a.lv > prevLvRef.current && a.lv <= lv) });
    }
    prevLvRef.current = lv;
  }, [state.soupy.xp]);

  const update = useCallback((fn) => setState(prev => { const n = structuredClone(prev); fn(n); saveState(n); return n; }), []);
  const replaceAll = useCallback((st) => { saveState(st); prevLvRef.current = levelFromXp(st.soupy.xp).lv; setState(st); setStack([{ name: 'home' }]); }, []);
  const nav = useCallback((name, params) => {
    setStack(s => TAB_SCREENS.includes(name) ? [{ name, params }] : [...s, { name, params }]);
  }, []);
  const back = useCallback(() => setStack(s => s.length > 1 ? s.slice(0, -1) : [{ name: 'home' }]), []);

  useEffect(() => { window.scrollTo(0, 0); }, [stack.length, stack[stack.length - 1].name]);

  const route = stack[stack.length - 1];
  const isTab = stack.length === 1 && TAB_SCREENS.includes(route.name);

  if (!state.onboarded) {
    return <Onboarding onStart={(name, goal, demo) => {
      const st = demo ? seedDemoState(name, goal) : (() => { const d = defaultState(); d.onboarded = true; d.profile.name = name; d.profile.goal = goal; d.accountStatus = 'guest'; return d; })();
      replaceAll(st);
      toast(`ようこそ、${name}さん！`);
    }} />;
  }

  let screen = null;
  switch (route.name) {
    case 'home': screen = <HomeScreen />; break;
    case 'sleep': screen = <SleepScreen route={route} />; break;
    case 'soupy': screen = <SoupyScreen />; break;
    case 'care': screen = <CareScreen route={route} />; break;
    case 'shop': screen = <ShopScreen route={route} />; break;
    case 'stretchPlay': screen = <StretchPlayScreen route={route} />; break;
    case 'article': screen = <ArticleScreen route={route} />; break;
    case 'product': screen = <ProductScreen route={route} />; break;
    case 'cart': screen = <CartScreen />; break;
    case 'member': screen = <MemberScreen />; break;
    case 'posture': screen = <PostureScreen route={route} />; break;
    case 'postureCompare': screen = <PostureCompareScreen />; break;
    case 'visit': screen = <VisitFlowScreen />; break;
    case 'settings': screen = <SettingsScreen />; break;
    case 'quick': screen = <QuickCheckScreen route={route} />; break;
    case 'assess': screen = <AssessScreen route={route} />; break;
    case 'slides': screen = <SlidePlayerScreen route={route} />; break;
    case 'sounds': screen = <SoundsScreen />; break;
    case 'health': screen = <HealthSyncScreen />; break;
    case 'counseling': screen = <CounselingScreen />; break;
    case 'calendar': screen = <CalendarScreen />; break;
    default: screen = <HomeScreen />;
  }

  return (
    <Ctx.Provider value={{ state, update, replaceAll, nav, back, route }}>
      <div className="mx-auto max-w-[430px] min-h-screen relative shadow-2xl shadow-black/60"
        style={{ background: 'linear-gradient(180deg,#0d1424 0%,#121a2e 40%,#0d1424 100%)', paddingBottom: isTab ? 96 : 24, zoom: state.largeText ? 1.1 : 1 }}>
        <div key={stack.length + ':' + route.name}>{screen}</div>
        {isTab && <TabBar current={route.name} onTab={t => nav(t)} />}
        <LevelUpModal info={levelUp} onClose={() => setLevelUp(null)} />
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
