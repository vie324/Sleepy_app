// 就寝・起床時刻から睡眠時間(h)を計算（日またぎ対応）
function sleepHours(bed, wake) {
  if (!bed || !wake) return 0;
  const [bh, bm] = bed.split(':').map(Number);
  const [wh, wm] = wake.split(':').map(Number);
  let mins = (wh*60+wm) - (bh*60+bm);
  if (mins <= 0) mins += 24*60;
  return Math.round(mins/6)/10;
}

function loadScriptOnce(src) {
  window.__loadedScripts = window.__loadedScripts || {};
  if (window.__loadedScripts[src]) return window.__loadedScripts[src];
  window.__loadedScripts[src] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.crossOrigin = 'anonymous';
    s.onload = resolve; s.onerror = () => reject(new Error('script load failed: ' + src));
    document.head.appendChild(s);
  });
  return window.__loadedScripts[src];
}

function calcSleepScore(log) {
  const h = sleepHours(log.bed, log.wake);
  let dur;
  if (h >= 7 && h <= 8.5) dur = 40;
  else if ((h >= 6.5 && h < 7) || (h > 8.5 && h <= 9)) dur = 33;
  else if ((h >= 6 && h < 6.5) || (h > 9 && h <= 9.5)) dur = 25;
  else if (h >= 5 && h < 6) dur = 15;
  else dur = 6;
  const quality = Math.round((log.quality - 1) / 4 * 25);
  const awake = Math.max(0, 12 - 4 * (log.awakenings || 0));
  const feel = { 1: 2, 2: 7, 3: 13 }[log.feel] || 7;
  let habit = 0;
  (log.habits || []).forEach(id => { const hh = HABIT[id]; if (hh) habit += hh.score; });
  habit = clamp(habit, -10, 10);
  return clamp(dur + quality + awake + feel + habit, 0, 100);
}

// 自律神経バランス推定: -100(交感優位) 〜 +100(副交感優位・リラックス)
function calcAutonomic(log) {
  let symp = 0, para = 0;
  (log.habits || []).forEach(id => { const h = HABIT[id]; if (h) { symp += h.symp; para += h.para; } });
  const hours = sleepHours(log.bed, log.wake);
  if (hours < 6) symp += 15; else if (hours >= 7) para += 8;
  if (log.quality <= 2) symp += 12; else if (log.quality >= 4) para += 10;
  if ((log.awakenings || 0) >= 2) symp += 10;
  if (log.feel === 3) para += 8; else if (log.feel === 1) symp += 8;
  return clamp(Math.round(para - symp), -100, 100);
}

function autonomicLabel(v) {
  if (v <= -40) return { label:'交感神経がかなり優位', short:'おつかれモード', advice:'アクセル踏みっぱなしのサイン。今夜は湯船と4-7-8呼吸でブレーキを。施術でのリセットもおすすめです。' };
  if (v <= -15) return { label:'交感神経がやや優位', short:'がんばりモード', advice:'少し緊張ぎみ。夜のスマホを控えて、リラックス習慣を1つ足してみましょう。' };
  if (v < 15)  return { label:'バランスはほぼ中間', short:'ふつうモード', advice:'いい調子。良い習慣を続けて、リラックス側に育てていきましょう。' };
  if (v < 40)  return { label:'副交感神経がやや優位', short:'リラックスモード', advice:'切り替え上手です！この調子で朝の光と日中の活動もキープ。' };
  return { label:'副交感神経がしっかり優位', short:'ぐっすりモード', advice:'すばらしい切り替え力。スーピーくんも安心してぐっすりです。' };
}

function scoreLabel(s) {
  if (s >= 85) return { label:'ぐっすり', color:C.para, emoji:'🌟' };
  if (s >= 70) return { label:'よいねむり', color:C.para, emoji:'😊' };
  if (s >= 50) return { label:'まずまず', color:C.warning, emoji:'😌' };
  return { label:'おつかれぎみ', color:C.serious, emoji:'🥱' };
}

// レベル: 次のレベルに必要なXP = 60 + (lv-1)*30
function levelFromXp(xp) {
  let lv = 1, rest = xp;
  while (lv < 30) {
    const need = 60 + (lv - 1) * 30;
    if (rest < need) return { lv, cur: rest, need };
    rest -= need; lv++;
  }
  return { lv: 30, cur: 0, need: 1 };
}

function recentLogs(state, n) {
  const dates = Object.keys(state.sleepLogs || {}).sort().slice(-n);
  return dates.map(d => ({ date: d, ...state.sleepLogs[d] }));
}

function analyzeIssues(state) {
  const logs = recentLogs(state, 7);
  const issues = [];
  const push = (id, label, evidence, weight) => issues.push({ id, label, evidence, weight });

  if (logs.length) {
    const scores = logs.map(l => l.score);
    const quals = logs.map(l => l.quality);
    const hrs = logs.map(l => sleepHours(l.bed, l.wake));
    const awakes = logs.map(l => l.awakenings || 0);
    const habitCount = (id) => logs.filter(l => (l.habits || []).includes(id)).length;

    if (avg(scores) < 65) push('lowScore', '睡眠スコアが低め', `直近7日の平均 ${Math.round(avg(scores))}点`, 5);
    if (avg(quals) < 3) push('fallAsleep', 'ねむりの質が低め', `質の平均 ${avg(quals).toFixed(1)}/5`, 4);
    if (avg(hrs) < 6.5 && avg(hrs) > 0) push('shortSleep', '睡眠時間が不足ぎみ', `平均 ${avg(hrs).toFixed(1)}時間`, 4);
    if (avg(awakes) >= 1.3) push('wakeMid', '夜中に目が覚めやすい', `中途覚醒 平均${avg(awakes).toFixed(1)}回`, 4);
    if (habitCount('caffeine') >= 2) push('caffeine', '午後のカフェインが多め', `7日間で${habitCount('caffeine')}回`, 3);
    if (habitCount('phone') >= 3) push('phone', '寝る前スマホの習慣', `7日間で${habitCount('phone')}回`, 3);
    if (habitCount('alcohol') >= 2) push('alcohol', '寝る前の飲酒が多め', `7日間で${habitCount('alcohol')}回`, 3);
    if (logs.length >= 3 && habitCount('bath') <= Math.floor(logs.length / 3)) push('bath', '湯船の習慣が少なめ', `7日間で${habitCount('bath')}回`, 2);
    const lastBal = calcAutonomic(logs[logs.length - 1]);
    if (lastBal <= -25) push('stress', '交感神経が優位（緊張ぎみ）', autonomicLabel(lastBal).label, 4);
  } else {
    push('noLog', 'まだ睡眠記録がありません', '記録するとスーピーくんが分析します', 5);
  }

  const posture = (state.posture || []).slice(-6);
  const lastSide = [...posture].reverse().find(p => p.mode === 'side');
  const lastFront = [...posture].reverse().find(p => p.mode === 'front');
  if (lastSide && lastSide.metrics.fha > 12) push('neckForward', '頭が前に出ている（スマホ首傾向）', `頭部前方角 ${Math.round(lastSide.metrics.fha)}°`, 5);
  if (lastFront && Math.abs(lastFront.metrics.shoulderTilt) > 2.5) push('shoulderDiff', '肩の高さに左右差', `傾き ${Math.abs(lastFront.metrics.shoulderTilt).toFixed(1)}°`, 3);
  if (lastFront && Math.abs(lastFront.metrics.pelvisTilt) > 2.5) push('pelvis', '骨盤の高さに左右差', `傾き ${Math.abs(lastFront.metrics.pelvisTilt).toFixed(1)}°`, 3);
  if ((lastSide && lastSide.score < 70) || (lastFront && lastFront.score < 70)) push('posture', '姿勢スコアが低め', '姿勢の崩れは呼吸と自律神経に影響します', 4);

  const visits = state.visits || [];
  if (visits.length) {
    const last = visits[visits.length - 1].date;
    const days = Math.round((new Date(todayStr()) - new Date(last)) / 86400000);
    if (days >= 21) push('visitStale', `前回のご来店から${days}日`, 'からだのメンテナンス時期です', 3);
  }
  return issues.sort((a, b) => b.weight - a.weight);
}

function buildRecommendations(state) {
  const issues = analyzeIssues(state);
  const recs = [];
  const usedS = new Set(), usedP = new Set(), usedA = new Set();
  issues.forEach(issue => {
    const r = RECIPES[issue.id];
    if (!r) return;
    const stretch = (r.stretch || []).filter(id => !usedS.has(id)).slice(0, 2);
    const product = (r.product || []).filter(id => !usedP.has(id)).slice(0, 2);
    const article = (r.article || []).filter(id => !usedA.has(id)).slice(0, 1);
    stretch.forEach(id => usedS.add(id)); product.forEach(id => usedP.add(id)); article.forEach(id => usedA.add(id));
    recs.push({ issue, msg: r.msg, stretch, product, article });
  });
  return recs;
}

    posture: [],            // [{id, date, mode, phase, score, metrics, img, pairId}]

    quizDone: {},
    orders: [],
    cart: [],
    visitFlow: null,        // {step, startedAt, beforeId, afterId, prescribed[], recommended[]}

function gainXp(st, amount, reason) {
  st.soupy.xp += amount;
  st.xpLog.push({ date: todayStr(), amount, reason });
  if (st.xpLog.length > 200) st.xpLog = st.xpLog.slice(-200);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const st = JSON.parse(raw); if (st && st.version === 1) return st; }
  } catch (e) { console.warn('loadState failed', e); }
  return defaultState();
}
function saveState(st) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(st)); }
  catch (e) {
    // 画像で容量超過した場合は古い姿勢画像から順に落として再保存
    try {
      const slim = structuredClone(st);
      slim.posture.slice(0, -4).forEach(p => { p.img = null; });
      localStorage.setItem(STORE_KEY, JSON.stringify(slim));
    } catch (e2) { console.warn('saveState failed', e2); }
  }
}

function useTip() {
  const [tip, setTip] = useState(null); // {xPct, yPct, main, sub}
  const show = (xPct, yPct, main, sub) => setTip(t => (t && t.main === main && t.sub === sub) ? null : { xPct, yPct, main, sub });
  return { tip, show, clear: () => setTip(null) };
}
function TipView({ tip }) {
  if (!tip) return null;
  return (
    <div className="viz-tip" style={{ left: tip.xPct + '%', top: tip.yPct + '%' }}>
      {tip.main}<br /><span className="tip-sub">{tip.sub}</span>
    </div>
  );
}

// 睡眠スコアの推移（単系列・エリア+ライン）
function TrendChart({ data, height = 170 }) {
  const { tip, show } = useTip();
  if (!data.length) return <EmptyState text="まだ記録がありません" sub="睡眠を記録するとグラフが育ちます" />;
  const W = 340, H = 170, padL = 30, padR = 16, padT = 18, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = data.length;
  const x = i => padL + (n === 1 ? iw / 2 : i * (iw / (n - 1)));
  const y = v => padT + ih - (v / 100) * ih;
  const line = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d.score).toFixed(1)}`).join(' ');
  const area = `${line} L${x(n - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block', height: 'auto' }} role="img" aria-label="睡眠スコアの推移">
        {[0, 50, 100].map(v => (
          <g key={v}>
            <line x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke={v === 0 ? C.axis : C.grid} strokeWidth={1} />
            <text x={padL - 6} y={y(v) + 3.5} fontSize={9} fill={C.muted} textAnchor="end">{v}</text>
          </g>
        ))}
        <path d={area} fill={C.gold} opacity={0.16} />
        <path d={line} fill="none" stroke={C.gold} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round" />
        {data.map((d, i) => (
          <g key={d.date}>
            <circle cx={x(i)} cy={y(d.score)} r={3.2} fill={C.gold} stroke="#222e4c" strokeWidth={1.5} />
            <circle cx={x(i)} cy={y(d.score)} r={13} fill="transparent"
              onClick={() => show(x(i) / W * 100, y(d.score) / H * 100, `${d.score}点 ${scoreLabel(d.score).label}`, fmtMDW(d.date))} />
            <text x={x(i)} y={H - 8} fontSize={9} fill={C.muted} textAnchor="middle">{fmtMD(d.date)}</text>
          </g>
        ))}
        <text x={x(n - 1)} y={y(data[n - 1].score) - 9} fontSize={12} fontWeight="700" fill="#eef1f8" textAnchor="middle">{data[n - 1].score}</text>
      </svg>
      <TipView tip={tip} />
    </div>
  );
}

// 睡眠時間（単系列バー + 理想ゾーン 7〜8.5h）
function HoursBars({ data }) {
  const { tip, show } = useTip();
  if (!data.length) return <EmptyState text="まだ記録がありません" />;
  const W = 340, H = 150, padL = 30, padR = 16, padT = 14, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const maxV = Math.max(9.5, ...data.map(d => d.hours));
  const n = data.length;
  const bw = Math.min(26, iw / n * 0.55);
  const x = i => padL + (i + 0.5) * (iw / n) - bw / 2;
  const y = v => padT + ih - (v / maxV) * ih;
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block', height: 'auto' }} role="img" aria-label="睡眠時間の推移">
        <rect x={padL} y={y(8.5)} width={iw} height={y(7) - y(8.5)} fill={C.para} opacity={0.10} />
        {[7, 8.5].map(v => <line key={v} x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke={C.para} strokeWidth={1} strokeDasharray="3 4" opacity={0.5} />)}
        <text x={W - padR} y={y(8.5) - 4} fontSize={8.5} fill={C.para} textAnchor="end" opacity={0.9}>理想 7〜8.5h</text>
        {[0, 3, 6, 9].map(v => (
          <g key={v}>
            <line x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke={v === 0 ? C.axis : C.grid} strokeWidth={1} />
            <text x={padL - 6} y={y(v) + 3.5} fontSize={9} fill={C.muted} textAnchor="end">{v}</text>
          </g>
        ))}
        {data.map((d, i) => (
          <g key={d.date} onClick={() => show((x(i) + bw / 2) / W * 100, y(d.hours) / H * 100, `${d.hours}時間`, fmtMDW(d.date))}>
            <rect x={x(i)} y={y(d.hours)} width={bw} height={Math.max(2, y(0) - y(d.hours))} rx={4} fill={C.peri} />
            <rect x={x(i) - 4} y={padT} width={bw + 8} height={ih} fill="transparent" />
            <text x={x(i) + bw / 2} y={H - 8} fontSize={9} fill={C.muted} textAnchor="middle">{fmtMD(d.date)}</text>
          </g>
        ))}
        <text x={x(n - 1) + bw / 2} y={y(data[n - 1].hours) - 5} fontSize={11} fontWeight="700" fill="#eef1f8" textAnchor="middle">{data[n - 1].hours}</text>
      </svg>
      <TipView tip={tip} />
    </div>
  );
}

const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

function xpDoneToday(state, reason) {
  const t = todayStr();
  return (state.xpLog || []).some(x => x.date === t && x.reason === reason);
}
function xpCountToday(state, reason) {
  const t = todayStr();
  return (state.xpLog || []).filter(x => x.date === t && x.reason === reason).length;
}
function ticketRemaining(state) {
  const t = todayStr();
  return (state.tickets || []).filter(tk => tk.expiresAt >= t).reduce((a, tk) => a + (tk.total - tk.used), 0);
}
function calcStreak(state) {
  let d = todayStr(), n = 0;
  if (!state.sleepLogs[d]) d = addDays(d, -1);
  while (state.sleepLogs[d]) { n++; d = addDays(d, -1); }
  return n;
}
function soupyMoodOf(state) {
  const logs = recentLogs(state, 3);
  if (!logs.length) return 'sleep';
  const a = avg(logs.map(l => l.score));
  if (a >= 78) return 'happy';
  if (a < 55) return 'tired';
  return 'sleep';
}

    </div>
  );
}

function MoonRating({ value, onChange, size = 30 }) {
  return (
    <div className="flex gap-1.5">
      {[1, 2, 3, 4, 5].map(v => (
        <button key={v} onClick={() => onChange && onChange(v)} className="btn-press" style={{ fontSize: size * 0.8, lineHeight: 1, filter: v <= value ? 'none' : 'grayscale(1) opacity(.35)' }}>
          🌙
        </button>
      ))}
    </div>
  );
}

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div>
          <h3 className="text-[16px] font-black text-cream-50">🌙 {fmtMDW(date)} のねむり</h3>
          <p className="text-[11px] text-night-200 mt-0.5">きのうの夜〜けさの記録</p>
        </div>
        <div className="text-right">
          <span className="text-[22px] font-black text-moon-400">{preview}</span>
          <span className="text-[10px] text-night-200 font-bold">点</span>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-4">
        <label className="card-deep p-3 block">
          <span className="text-[10.5px] font-bold text-night-200">🛏️ ねた時間</span>
          <input type="time" value={bed} onChange={e => setBed(e.target.value)}
            className="mt-1 w-full bg-transparent text-[20px] font-black text-cream-50 outline-none" />
        </label>
        <label className="card-deep p-3 block">
          <span className="text-[10.5px] font-bold text-night-200">⏰ おきた時間</span>
          <input type="time" value={wake} onChange={e => setWake(e.target.value)}
            className="mt-1 w-full bg-transparent text-[20px] font-black text-cream-50 outline-none" />
        </label>
      </div>
      <p className="text-[11.5px] text-night-100 font-bold -mt-2 mb-4 text-center">睡眠時間 <span className="text-moon-300">{hours}時間</span>{hours >= 7 && hours <= 8.5 ? '（理想ゾーン🎉）' : ''}</p>

      <div className="mb-4">
        <p className="text-[12px] font-bold text-night-100 mb-1.5">ねむりの質（ぐっすり度）</p>
        <MoonRating value={quality} onChange={setQuality} />
      </div>

      <div className="mb-4 flex items-center justify-between">
        <p className="text-[12px] font-bold text-night-100">夜中に目がさめた回数</p>
        <div className="flex items-center gap-3">
          <button onClick={() => setAwakenings(a => Math.max(0, a - 1))} className="btn-press w-8 h-8 rounded-full bg-night-500 font-black">−</button>
          <span className="w-8 text-center text-[18px] font-black text-cream-50">{awakenings}</span>
          <button onClick={() => setAwakenings(a => Math.min(9, a + 1))} className="btn-press w-8 h-8 rounded-full bg-night-500 font-black">＋</button>
        </div>
      </div>

      <div className="mb-4">
        <p className="text-[12px] font-bold text-night-100 mb-1.5">朝おきたときの気分</p>
        <div className="grid grid-cols-3 gap-2">
          {FEELS.map(f => (
            <button key={f.v} onClick={() => setFeel(f.v)}
              className={`btn-press p-2.5 rounded-xl border text-center ${feel === f.v ? 'bg-cream-100 text-night-900 border-cream-100' : 'bg-night-600 text-night-100 border-night-400/40'}`}>
              <span className="block text-[18px]">{f.icon}</span>
              <span className="block text-[10.5px] font-bold mt-0.5">{f.label}</span>
            </button>
          ))}
        </div>
      </div>

      <div className="mb-5">
        <p className="text-[12px] font-bold text-night-100 mb-0.5">きのうの行動チェック</p>
        <p className="text-[10.5px] text-night-200 mb-2">行動はぜんぶ自律神経とつながっています。ⓘで理由がわかるよ</p>
        <div className="flex flex-col gap-1.5">
          {HABITS.map(h => (
            <div key={h.id} className={`rounded-xl border transition ${habits.includes(h.id) ? (h.good ? 'border-cpara/50 bg-cpara/10' : 'border-csymp/50 bg-csymp/10') : 'border-night-400/40 bg-night-600'}`}>
              <div className="flex items-center gap-2 px-3 py-2">
                <button onClick={() => toggleHabit(h.id)} className="btn-press flex items-center gap-2 flex-1 text-left">
                  <span className="text-[15px]">{h.icon}</span>
                  <span className="text-[12px] font-bold text-cream-50">{h.label}</span>
                </button>
                <span className={`text-[9.5px] font-black px-1.5 py-0.5 rounded ${h.good ? 'text-[#4cc2ae] bg-cpara/15' : 'text-[#f0968c] bg-csymp/15'}`}>{h.good ? '副交感+' : '交感+'}</span>
                <button onClick={() => setTipFor(tipFor === h.id ? null : h.id)} className="btn-press text-night-200 text-[13px] w-6 h-6 rounded-full bg-night-500/60">ⓘ</button>

    </div>
  );
}

  const { nav } = useApp();
  const balance = log.balance ?? calcAutonomic(log);
  const info = autonomicLabel(balance);
  const hours = sleepHours(log.bed, log.wake);
  return (
    <div>
      <div className="flex items-center gap-4">
        <ScoreRing score={log.score} size={110} sub={fmtMD(date)} />
        <div className="flex-1 text-[11.5px] text-night-100 space-y-1">
          <p>🛏️ {log.bed} → ⏰ {log.wake}<span className="text-night-200">（{hours}h）</span></p>

          <p>👀 中途覚醒 {log.awakenings}回 ／ {FEELS.find(f => f.v === log.feel)?.icon} {FEELS.find(f => f.v === log.feel)?.label}</p>

      <div className="mt-4"><BalanceGauge value={balance} /></div>

        <p className="text-[11.5px] text-night-100 leading-relaxed">{info.advice}</p>
      </div>
      {(log.habits || []).filter(id => !HABIT[id]?.good).slice(0, 1).map(id => (
        <button key={id} onClick={() => nav('article', { id: { caffeine: 'a_caffeine', phone: 'a_phone', alcohol: 'a_alcohol', lateMeal: 'a_bath', longNap: 'a_weekend' }[id] || 'a_ans' })}
          className="btn-press mt-2 w-full text-left card p-3 flex items-center gap-2">
          <span>{HABIT[id].icon}</span>
          <span className="flex-1 text-[11.5px] font-bold text-cream-50">「{HABIT[id].label}」が眠りに与える影響を知る</span>

        </button>
      ))}
    </div>
  );
}

function SleepScreen({ route }) {
  const { state, update, nav } = useApp();
  const [formDate, setFormDate] = useState(route?.params?.open ? todayStr() : null);
  const [detail, setDetail] = useState(null);
  const t = todayStr();
  const todayLog = state.sleepLogs[t];
  const logs7 = recentLogs(state, 7);
  const trend = logs7.map(l => ({ date: l.date, score: l.score }));
  const hoursData = logs7.map(l => ({ date: l.date, hours: sleepHours(l.bed, l.wake) }));
  const allDates = Object.keys(state.sleepLogs).sort().reverse().slice(0, 14);

  const save = (date, data) => {
    const log = { ...data };
    log.score = calcSleepScore(log);
    log.balance = calcAutonomic(log);
    update(st => {
      st.sleepLogs[date] = log;
      if (date === t && !xpDoneToday(st, '睡眠記録')) { gainXp(st, 12, '睡眠記録'); }
    });
    setFormDate(null);
    toast(`きろくしました！睡眠スコア ${log.score}点`, 'xp');
  };

  return (
    <div className="pb-4">
      <div className="px-4 pt-5 pb-1 flex items-center justify-between">
        <div>
          <h1 className="text-[19px] font-black text-cream-50">すいみん</h1>
          <p className="text-[11px] text-night-200 mt-0.5">ねむりを見える化して、自律神経を整えよう</p>
        </div>
        <Soupy size={54} mood="sleep" animate={false} />
      </div>

      {/* 今日の記録 */}
      <div className="px-4 mt-3">
        {todayLog ? (
          <div className="card p-4">
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-[13.5px] font-black text-cream-50">けさの記録</h2>
              <button onClick={() => setFormDate(t)} className="text-[11px] font-bold text-moon-300">編集する</button>
            </div>
            <LogResult date={t} log={todayLog} />
          </div>
        ) : (
          <NightSky className="rounded-3xl border border-night-500/60">
            <div className="p-4 flex items-center gap-3">
              <Soupy size={84} mood="sleep" />
              <div className="flex-1">
                <p className="text-[13.5px] font-black text-cream-50 leading-snug">ゆうべのねむりを<br />おしえてね</p>
                <p className="text-[10.5px] text-night-100 mt-1 mb-2.5">1分でOK！ +12 XP</p>
                <Btn kind="moon" small onClick={() => setFormDate(t)}>📝 きろくする</Btn>
              </div>
            </div>
          </NightSky>
        )}
      </div>

      {/* チャート */}
      <div className="px-4 mt-4">
        <SectionTitle icon="📈" title="睡眠スコアの推移" sub="この7日間" />
        <div className="card p-3.5 pt-4">
          <TrendChart data={trend} />
        </div>
      </div>
      <div className="px-4 mt-3">
        <SectionTitle icon="⏱️" title="睡眠時間" sub="理想ゾーンは7〜8.5時間" />
        <div className="card p-3.5 pt-4">
          <HoursBars data={hoursData} />
        </div>
      </div>

      {/* 履歴 */}
      <div className="px-4 mt-4">
        <SectionTitle icon="🗓️" title="これまでの記録"
          right={<button onClick={() => setFormDate(addDays(t, -1))} className="text-[11px] font-bold text-moon-300">過去の日をつける＋</button>} />
        {allDates.length === 0 && <div className="card"><EmptyState text="まだ記録がありません" sub="今夜から始めてみましょう" /></div>}
        <div className="flex flex-col gap-1.5">
          {allDates.map(d => {
            const l = state.sleepLogs[d];
            const sl = scoreLabel(l.score);
            return (
              <button key={d} onClick={() => setDetail(d)} className="btn-press card px-3.5 py-2.5 flex items-center gap-3">
                <span className="text-[11px] font-bold text-night-200 w-16 text-left">{fmtMDW(d)}</span>
                <span className="text-[15px] font-black" style={{ color: sl.color }}>{l.score}<span className="text-[9px]">点</span></span>
                <div className="flex-1"><ProgressBar pct={l.score} color={sl.color} h={5} /></div>
                <span className="text-[10.5px] text-night-200 font-bold">{sleepHours(l.bed, l.wake)}h</span>
              </button>
            );
          })}
        </div>
      </div>

      {/* 記録フォーム */}
      <Modal open={!!formDate} onClose={() => setFormDate(null)}>
        {formDate && (
          <div>
            <div className="flex gap-1.5 mb-3 overflow-x-auto no-scrollbar">
              {[0, -1, -2, -3].map(off => {
                const d = addDays(t, off);
                return <Chip key={d} active={formDate === d} onClick={() => setFormDate(d)}>{off === 0 ? 'きょう' : fmtMDW(d)}</Chip>;
              })}
            </div>
            <SleepLogForm key={formDate} date={formDate} initial={state.sleepLogs[formDate]} onSave={data => save(formDate, data)} onClose={() => setFormDate(null)} />
          </div>
        )}
      </Modal>

      {/* 履歴詳細 */}
      <Modal open={!!detail} onClose={() => setDetail(null)} title={detail ? `🌙 ${fmtJP(detail)}` : ''}>
        {detail && state.sleepLogs[detail] && (
          <div>
            <LogResult date={detail} log={state.sleepLogs[detail]} />
            <div className="mt-4 flex gap-2">
              <Btn kind="ghost" full onClick={() => { setFormDate(detail); setDetail(null); }}>編集する</Btn>
              <Btn kind="primary" full onClick={() => setDetail(null)}>OK</Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

function SoupyScreen() {
  const { state, update, nav } = useApp();
  const { lv, cur, need } = levelFromXp(state.soupy.xp);
  const mood = soupyMoodOf(state);
  const petsToday = xpCountToday(state, 'なでなで');
  const totalPets = (state.xpLog || []).filter(x => x.reason === 'なでなで').length;
  const friendship = Math.min(5, 1 + Math.floor(totalPets / 15));

  const pet = () => {
    if (petsToday >= 5) { toast('きょうはもうおなかいっぱい…また明日なでてね💤'); return; }
    update(st => gainXp(st, 2, 'なでなで'));
    toast('+2 XP スーピーくんがよろこんでいる！', 'xp');
  };

  const toggleWear = (id) => {
    update(st => {
      const w = st.soupy.wearing;
      st.soupy.wearing = w.includes(id) ? w.filter(x => x !== id) : [...w, id];
    });
  };

  return (
    <div className="pb-4">
      <div className="px-4 pt-5 pb-1">
        <h1 className="text-[19px] font-black text-cream-50">そだてる</h1>
        <p className="text-[11px] text-night-200 mt-0.5">よいねむりと来店で、スーピーくんが育ちます</p>
      </div>

      <div className="px-4 mt-3">
        <NightSky className="rounded-3xl border border-night-500/60" dense>
          <div className="pt-5 flex justify-center">
            <Soupy size={215} mood={mood} wearing={state.soupy.wearing} onTap={pet} />
          </div>
          <div className="text-center pb-4 px-4">
            <p className="text-[15px] font-black text-cream-50 mt-1">スーピーくん <span className="text-moon-300">Lv.{lv}</span></p>
            <p className="text-[11px] text-moon-300 font-bold">「{stageTitle(lv)}」</p>
            <div className="mt-2.5 max-w-[260px] mx-auto">
              <ProgressBar pct={cur / need * 100} color={C.moon} />
              <p className="text-[10px] text-night-100 mt-1 font-bold">つぎのレベルまで あと {need - cur} XP</p>
            </div>
            <p className="text-[10px] text-night-200 mt-2">なでなで きょう {petsToday}/5回</p>
          </div>
        </NightSky>
      </div>

      {/* なかよし度 */}
      <div className="px-4 mt-3 grid grid-cols-2 gap-2.5">
        <div className="card p-3.5 text-center">
          <p className="text-[10.5px] font-bold text-night-200">なかよし度</p>
          <p className="text-[18px] mt-1">{'💛'.repeat(friendship)}<span className="opacity-25">{'💛'.repeat(5 - friendship)}</span></p>
          <p className="text-[9.5px] text-night-300 mt-1">なでた回数 {totalPets}回</p>
        </div>
        <div className="card p-3.5 text-center">
          <p className="text-[10.5px] font-bold text-night-200">ごきげん</p>
          <p className="text-[18px] mt-1">{mood === 'happy' ? '😊 ごきげん' : mood === 'tired' ? '🥱 おつかれ' : '😴 すやすや'}</p>
          <p className="text-[9.5px] text-night-300 mt-1">最近の睡眠スコアで変化</p>
        </div>
      </div>

      {/* ミッション */}
      <div className="px-4 mt-4">
        <SectionTitle icon="⭐" title="きょうのミッション" sub="XPをあつめてレベルアップ！" />
        <MissionList />
      </div>

      {/* きせかえ */}
      <div className="px-4 mt-4">
        <SectionTitle icon="🎀" title="きせかえ" sub="レベルが上がるとアイテムがふえるよ" />
        <div className="grid grid-cols-3 gap-2">
          {ACCESSORIES.map(a => {
            const unlocked = lv >= a.lv;
            const on = state.soupy.wearing.includes(a.id);
            return (
              <button key={a.id} disabled={!unlocked} onClick={() => toggleWear(a.id)}
                className={`btn-press card p-3 text-center relative ${on ? 'ring-2 ring-moon-400' : ''} ${unlocked ? '' : 'opacity-45'}`}>
                <span className="text-[24px]">{unlocked ? a.emoji : '🔒'}</span>
                <span className="block text-[10px] font-bold text-night-100 mt-1">{a.name}</span>
                <span className="block text-[9px] text-night-300 mt-0.5">{unlocked ? (on ? 'そうび中' : 'タップでそうび') : `Lv.${a.lv}でかいほう`}</span>
              </button>
            );
          })}
        </div>
      </div>

      {/* XPのしくみ */}
      <div className="px-4 mt-4">
        <SectionTitle icon="🌱" title="そだてかた" />

/* ストレッチ実行（ガイド付きタイマー） */
function StretchPlayScreen({ route }) {
  const { state, update, back } = useApp();
  const s = STRETCH[route.params.id];
  const [phase, setPhase] = useState('intro'); // intro | run | done
  const [stepIdx, setStepIdx] = useState(0);
  const [left, setLeft] = useState(0);
  const [paused, setPaused] = useState(false);

  useEffect(() => {
    if (phase !== 'run' || paused) return;
    const iv = setInterval(() => {
      setLeft(l => {
        if (l > 1) return l - 1;
        setStepIdx(i => {
          if (i + 1 < s.steps.length) { setLeft(s.steps[i + 1].sec); return i + 1; }
          setPhase('done'); return i;
        });
        return 0;
      });
    }, 1000);
    return () => clearInterval(iv);
  }, [phase, paused, s]);

  useEffect(() => {
    if (phase === 'done') {
      update(st => { st.stretchLog.push({ date: todayStr(), stretchId: s.id }); gainXp(st, 15, 'ストレッチ'); });
      toast('+15 XP おつかれさま！', 'xp');
    }
  }, [phase]);

  if (!s) return <div className="p-6"><EmptyState text="ストレッチが見つかりません" /></div>;
  const step = s.steps[stepIdx];
  const totalSec = s.steps.reduce((a, x) => a + x.sec, 0);
  const doneSec = s.steps.slice(0, stepIdx).reduce((a, x) => a + x.sec, 0) + (phase === 'run' ? (step.sec - left) : 0);

  return (
    <div className="min-h-screen flex flex-col">
      <BackHeader title={`${s.emoji} ${s.name}`} onBack={back} />
      {phase === 'intro' && (
        <div className="p-4 flex-1">
          <NightSky className="rounded-3xl border border-night-500/60">
            <div className="p-5 text-center">
              <span className="text-[52px]">{s.emoji}</span>
              <h2 className="text-[17px] font-black text-cream-50 mt-2">{s.name}</h2>
              <p className="text-[11px] text-night-200 mt-1">{s.area} ・ 約{s.mins}分 ・ {s.when}におすすめ</p>
            </div>
          </NightSky>
          <div className="card p-4 mt-3">
            <p className="text-[11px] font-black text-moon-300 mb-1">✨ からだへの効果</p>
            <p className="text-[12px] text-night-100 leading-relaxed">{s.effect}</p>
            <p className="text-[11px] font-black text-moon-300 mb-1 mt-3">⚖️ 自律神経へのはたらき</p>
            <p className="text-[12px] text-night-100 leading-relaxed">{s.autonomic}</p>
          </div>
          <div className="card p-4 mt-3">
            <p className="text-[11px] font-black text-night-200 mb-2">ながれ（全{s.steps.length}ステップ）</p>
            {s.steps.map((st2, i) => (
              <p key={i} className="text-[12px] text-night-100 py-1 border-b border-night-500/40 last:border-0">
                <span className="text-moon-300 font-black mr-1.5">{i + 1}</span>{st2.text}
                <span className="text-night-300 text-[10px] ml-1">（{st2.sec}秒）</span>
              </p>
            ))}
          </div>
          <div className="mt-4 pb-6">
            <Btn kind="moon" full onClick={() => { setStepIdx(0); setLeft(s.steps[0].sec); setPhase('run'); }}>▶ スタート</Btn>
          </div>
        </div>
      )}

      {phase === 'run' && (
        <div className="p-4 flex-1 flex flex-col">
          <ProgressBar pct={doneSec / totalSec * 100} color={C.moon} />
          <p className="text-[10.5px] text-night-200 font-bold mt-1.5 text-center">ステップ {stepIdx + 1} / {s.steps.length}</p>
          <div className="flex-1 flex flex-col items-center justify-center text-center">
            <div className="relative">
              <svg width="200" height="200" className="-rotate-90">
                <circle cx="100" cy="100" r="88" fill="none" stroke={C.night500} strokeWidth="10" />
                <circle cx="100" cy="100" r="88" fill="none" stroke={C.moon} strokeWidth="10" strokeLinecap="round"
                  strokeDasharray={`${2 * Math.PI * 88 * (left / step.sec)} ${2 * Math.PI * 88}`} style={{ transition: 'stroke-dasharray 1s linear' }} />
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <span className="text-[54px] font-black text-cream-50 leading-none">{left}</span>
                <span className="text-[11px] text-night-200 font-bold mt-1">びょう</span>
              </div>
            </div>
            <p className="text-[15px] font-black text-cream-50 leading-relaxed mt-6 px-4">{step.text}</p>
            <div className="mt-5 flex items-center gap-2.5">
              <Soupy size={64} mood="happy" animate showZzz={false} />
              <div className="bg-cream-100 text-night-800 rounded-2xl px-3 py-2 text-[11px] font-bold">
                {left <= 5 ? 'あとちょっと！' : paused ? 'ひとやすみ中…' : 'いいちょうし！ゆっくり呼吸してね'}
              </div>
            </div>
          </div>
          <div className="flex gap-2 pb-6">
            <Btn kind="ghost" onClick={() => setPaused(p => !p)}>{paused ? '▶ さいかい' : '⏸ いったんとめる'}</Btn>
            <Btn kind="outline" full onClick={() => {
              if (stepIdx + 1 < s.steps.length) { setStepIdx(stepIdx + 1); setLeft(s.steps[stepIdx + 1].sec); }
              else setPhase('done');
            }}>つぎへ ▷</Btn>
          </div>
        </div>
      )}

      {phase === 'done' && (
        <div className="p-4 flex-1 flex flex-col items-center justify-center text-center">
          <div className="relative">
            <Soupy size={180} mood="excited" showZzz={false} />
            {Array.from({ length: 10 }).map((_, i) => (
              <span key={i} className="absolute left-1/2 top-1/2 text-[18px]" style={{
                '--tx': `${Math.cos(i / 10 * Math.PI * 2) * 90}px`, '--ty': `${Math.sin(i / 10 * Math.PI * 2) * 90}px`,
                animation: `star-burst .9s ease-out ${i * 0.05}s both`,
              }}>{i % 2 ? '⭐' : '✨'}</span>
            ))}
          </div>
          <h2 className="text-[19px] font-black text-cream-50 mt-3">おつかれさまでした！</h2>
          <p className="text-[12px] text-night-100 mt-2 leading-relaxed">{s.autonomic}</p>
          <p className="text-[13px] font-black text-moon-300 mt-3">+15 XP ゲット🌟</p>
          <div className="mt-6 w-full flex gap-2">
            <Btn kind="ghost" full onClick={() => { setPhase('intro'); }}>もう一回</Btn>
            <Btn kind="moon" full onClick={back}>おわる</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

function CartScreen() {
  const { state, update, back, nav } = useApp();
  const [done, setDone] = useState(null);
  const items = (state.cart || []).map(c => ({ ...c, p: PRODUCT[c.productId] })).filter(x => x.p);
  const total = items.reduce((a, x) => a + x.p.price * x.qty, 0);

  const setQty = (id, d) => update(st => {
    const item = st.cart.find(c => c.productId === id);
    if (!item) return;
    item.qty += d;
    if (item.qty <= 0) st.cart = st.cart.filter(c => c.productId !== id);
  });

  const checkout = () => {
    const order = { id: uid(), date: todayStr(), items: items.map(x => ({ id: x.productId, qty: x.qty })), total };
    update(st => {
      st.orders.push(order);
      // 回数券商品は残高に追加
      items.forEach(x => {
        if (x.p.ticket) {
          for (let i = 0; i < x.qty; i++) {
            st.tickets.push({
              id: uid(), name: x.p.name, total: x.p.ticket.count, used: 0,
              purchasedAt: todayStr(), expiresAt: addDays(todayStr(), Math.round(x.p.ticket.months * 30.4)), history: [],
            });
          }
        }
      });
      st.cart = [];
      gainXp(st, 20, 'おかいもの');
    });
    setDone(order);

  return (

      <BackHeader title="🧺 カート" onBack={back} />
      <div className="p-4 pb-8">
        {items.length === 0 && !done && <EmptyState emoji="🧺" text="カートはからっぽです" sub="ショップでスーピーくんのおすすめを見てみよう" />}

              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setQty(x.productId, -1)} className="btn-press w-7 h-7 rounded-full bg-night-500 font-black">−</button>
                <span className="w-5 text-center font-black text-[14px]">{x.qty}</span>

function CheckinModal({ open, onClose }) {
  const { state, update, nav } = useApp();
  const [step, setStep] = useState('confirm'); // confirm | ticket | done
  const tickets = (state.tickets || []).filter(tk => tk.total - tk.used > 0 && tk.expiresAt >= todayStr());
  const [tkId, setTkId] = useState(null);

  useEffect(() => { if (open) { setStep('confirm'); setTkId(tickets[0]?.id || 'cash'); } }, [open]);

  const doCheckin = () => {
    update(st => {
      const useTk = st.tickets.find(x => x.id === tkId);
      if (useTk) { useTk.used++; useTk.history.push({ date: todayStr(), note: '睡眠整体' }); }
      st.visits.push({ id: uid(), date: todayStr(), menu: '睡眠整体', note: useTk ? `回数券使用（のこり${useTk.total - useTk.used}回）` : '都度払い' });
      gainXp(st, 50, 'ご来店');
      if (!st.visitFlow) st.visitFlow = { step: 1, startedAt: todayStr(), beforeId: null, afterId: null, prescribed: [], recommended: [] };
      else st.visitFlow.step = Math.max(st.visitFlow.step, 1);
    });
    setStep('done');

  return (
    <Modal open={open} onClose={onClose}>
      {step === 'confirm' && (
        <div>
          <h3 className="text-[16px] font-black text-cream-50 mb-1">🏥 ご来店チェックイン</h3>

                  <span className="block text-[9.5px] text-night-300 mt-0.5">有効期限 {fmtJP(tk.expiresAt)}</span>

/* ============================================================
   SECTION 15: 姿勢分析（MediaPipe Pose）
   カメラ / 写真 / デモ の3入力 → 骨格検出 → スコア化 → 保存
   施術前(before)/施術後(after)を保存してBefore/After比較。
   ============================================================ */
const MP_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/';
const LM = { nose:0, lEye:2, rEye:5, lEar:7, rEar:8, lSh:11, rSh:12, lHip:23, rHip:24, lKnee:25, rKnee:26, lAnkle:27, rAnkle:28 };

async function ensurePose() {
  if (window.Pose) return;
  await loadScriptOnce(MP_CDN + 'pose.js');
}

let __pose = null, __poseBusy = Promise.resolve();
function detectPose(canvas) {
  // 直列化して1枚ずつ解析
  const run = async () => {
    await ensurePose();
    if (!__pose) {
      __pose = new window.Pose({ locateFile: f => MP_CDN + f });
      __pose.setOptions({ modelComplexity: 1, smoothLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    }
    return new Promise((resolve, reject) => {
      __pose.onResults(r => resolve(r));
      __pose.send({ image: canvas }).catch(reject);
    });
  };
  __poseBusy = __poseBusy.then(run, run);
  return __poseBusy;
}

const deg = (rad) => rad * 180 / Math.PI;

// 正面: 頭の傾き / 肩の高さ差 / 骨盤の傾き / 重心の左右
function frontMetrics(px) {
  const tilt = (a, b) => deg(Math.atan2(px[b].y - px[a].y, Math.abs(px[b].x - px[a].x) || 1));
  const headTilt = tilt(LM.lEar, LM.rEar);
  const shoulderTilt = tilt(LM.lSh, LM.rSh);
  const pelvisTilt = tilt(LM.lHip, LM.rHip);
  const shW = Math.abs(px[LM.rSh].x - px[LM.lSh].x) || 1;
  const midSh = (px[LM.lSh].x + px[LM.rSh].x) / 2;
  const midAn = (px[LM.lAnkle].x + px[LM.rAnkle].x) / 2;
  const centerShift = (midSh - midAn) / shW * 100;
  return { headTilt, shoulderTilt, pelvisTilt, centerShift };
}
function frontScore(m) {
  const s1 = Math.max(0, 25 - Math.abs(m.headTilt) * 3.2);
  const s2 = Math.max(0, 25 - Math.abs(m.shoulderTilt) * 4.5);
  const s3 = Math.max(0, 25 - Math.abs(m.pelvisTilt) * 4.5);
  const s4 = Math.max(0, 25 - Math.abs(m.centerShift) * 1.1);
  return Math.round(s1 + s2 + s3 + s4);
}

// 側面: 頭部前方角(FHA) / 体幹の前後傾 / 下肢ライン
function sideMetrics(px, side) {
  const ear = side === 'l' ? px[LM.lEar] : px[LM.rEar];
  const sh = side === 'l' ? px[LM.lSh] : px[LM.rSh];
  const hip = side === 'l' ? px[LM.lHip] : px[LM.rHip];
  const ankle = side === 'l' ? px[LM.lAnkle] : px[LM.rAnkle];
  const fha = deg(Math.atan2(Math.abs(ear.x - sh.x), Math.abs(sh.y - ear.y) || 1));
  const trunkLean = deg(Math.atan2(Math.abs(sh.x - hip.x), Math.abs(hip.y - sh.y) || 1));
  const kneeLean = deg(Math.atan2(Math.abs(hip.x - ankle.x), Math.abs(ankle.y - hip.y) || 1));
  return { fha, trunkLean, kneeLean };
}
function sideScore(m) {
  const s1 = Math.max(0, 40 - Math.max(0, m.fha - 5) * 2.4);
  const s2 = Math.max(0, 30 - Math.max(0, m.trunkLean - 2) * 3.2);
  const s3 = Math.max(0, 30 - Math.max(0, m.kneeLean - 2) * 3.2);
  return Math.round(s1 + s2 + s3);
}

function metricRows(mode, m) {
  if (mode === 'front') return [
    { label: '頭のかたむき', value: `${Math.abs(m.headTilt).toFixed(1)}°`, ok: Math.abs(m.headTilt) < 2.5, warn: Math.abs(m.headTilt) < 5,
      note: '首の左右バランス。かたむきは首すじの緊張のサイン。' },
    { label: '肩の高さの差', value: `${Math.abs(m.shoulderTilt).toFixed(1)}°`, ok: Math.abs(m.shoulderTilt) < 2.5, warn: Math.abs(m.shoulderTilt) < 5,
      note: '肩の左右差は肩甲骨まわりのこわばりと関係します。' },
    { label: '骨盤のかたむき', value: `${Math.abs(m.pelvisTilt).toFixed(1)}°`, ok: Math.abs(m.pelvisTilt) < 2.5, warn: Math.abs(m.pelvisTilt) < 5,
      note: '骨盤の傾きは腰の負担・寝返りのしやすさに影響。' },
    { label: '重心の左右ズレ', value: `${Math.abs(m.centerShift).toFixed(0)}%`, ok: Math.abs(m.centerShift) < 8, warn: Math.abs(m.centerShift) < 16,
      note: '立ち姿勢の安定感。ズレが大きいと片側に負担が集中。' },
  ];
  return [
    { label: '頭部前方角（スマホ首）', value: `${m.fha.toFixed(1)}°`, ok: m.fha < 8, warn: m.fha < 15,
      note: '頭が前に出るほど首の負担が増え、呼吸が浅くなります。' },
    { label: '体幹の前後傾', value: `${m.trunkLean.toFixed(1)}°`, ok: m.trunkLean < 4, warn: m.trunkLean < 8,
      note: '猫背・反り腰の目安。胸がひらくと呼吸がラクに。' },
    { label: 'からだの軸ライン', value: `${m.kneeLean.toFixed(1)}°`, ok: m.kneeLean < 4, warn: m.kneeLean < 8,
      note: '耳〜肩〜骨盤〜くるぶしが一直線に近いほど理想的。' },
  ];
}

function sleepConnection(mode, m, score) {
  const msgs = [];
  if (mode === 'side') {
    if (m.fha >= 15) msgs.push('頭がかなり前に出ています。首の緊張が交感神経を刺激し、気道もせまくなりがち。寝つき・いびき・眠りの浅さにつながる姿勢です。');
    else if (m.fha >= 8) msgs.push('やや頭が前に出ています。首まわりの緊張は「切り替えベタな自律神経」の原因に。首ケアとまくらの見直しがおすすめ。');
    else msgs.push('首のラインがきれいです。気道と自律神経の通り道にやさしい姿勢で、深い呼吸→ぐっすりの好循環がつくれます。');
    if (m.trunkLean >= 8) msgs.push('体幹の傾きが大きめ。胸郭が圧迫され呼吸が浅くなりやすい状態です。');
  } else {
    if (Math.abs(m.shoulderTilt) >= 5) msgs.push('肩の高さに差があります。片側の筋緊張は睡眠中の寝返りをじゃまして、眠りを浅くすることがあります。');
    else if (Math.abs(m.shoulderTilt) >= 2.5) msgs.push('肩にわずかな左右差。肩甲骨ストレッチでゆるめておきましょう。');
    if (Math.abs(m.pelvisTilt) >= 2.5) msgs.push('骨盤にかたむきがあります。腰の緊張は中途覚醒の一因になります。');
    if (!msgs.length) msgs.push('左右バランスがとても良い状態。からだが休まりやすい姿勢です。');
  }
  if (score < 70) msgs.push('施術で整えると、呼吸と自律神経のスイッチが入りやすいからだになります。');
  return msgs;
}

// デモ用ランドマーク（33点のうち必要点のみ配置）
function demoLandmarks(mode, phase) {
  const l = Array.from({ length: 33 }, () => ({ x: 0.5, y: 0.5, visibility: 0 }));
  const set = (i, x, y) => { l[i] = { x, y, visibility: 1 }; };
  if (mode === 'front') {
    const t = phase === 'after' ? 0.006 : 0.024; // 傾き量
    set(LM.nose, 0.50, 0.13);
    set(LM.lEar, 0.445, 0.15 + t); set(LM.rEar, 0.555, 0.15 - t);
    set(LM.lSh, 0.36, 0.30 + t * 2.2); set(LM.rSh, 0.64, 0.30 - t * 2.2);
    set(LM.lHip, 0.425, 0.55 + t * 1.4); set(LM.rHip, 0.575, 0.55 - t * 1.4);
    set(LM.lKnee, 0.435, 0.72); set(LM.rKnee, 0.565, 0.72);
    set(LM.lAnkle, 0.445 + (phase === 'after' ? 0 : 0.02), 0.885); set(LM.rAnkle, 0.565 + (phase === 'after' ? 0 : 0.02), 0.885);
  } else {
    const fw = phase === 'after' ? 0.022 : 0.075; // 頭の前方変位
    set(LM.nose, 0.56 + fw, 0.125);
    set(LM.rEar, 0.52 + fw, 0.145); set(LM.lEar, 0.52 + fw, 0.148);
    set(LM.rSh, 0.52, 0.30); set(LM.lSh, 0.52, 0.303);
    set(LM.rHip, 0.50, 0.55); set(LM.lHip, 0.50, 0.553);
    set(LM.rKnee, 0.515, 0.72); set(LM.lKnee, 0.515, 0.723);
    set(LM.rAnkle, 0.505, 0.885); set(LM.lAnkle, 0.505, 0.888);
  }
  return l;
}

function drawDemoBody(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#1a2440'); g.addColorStop(1, '#131c31');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(91,107,148,.35)';
  ctx.beginPath(); ctx.arc(w * 0.52, h * 0.15, w * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w * 0.51, h * 0.45, w * 0.15, h * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w * 0.51, h * 0.78, w * 0.10, h * 0.16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(199,206,222,.5)'; ctx.font = `bold ${Math.round(w * 0.045)}px sans-serif`;
  ctx.textAlign = 'center'; ctx.fillText('デモ画像', w / 2, h * 0.97);
}

// 骨格オーバーレイ描画
function drawOverlay(ctx, w, h, lms, mode) {
  const P = i => ({ x: lms[i].x * w, y: lms[i].y * h, v: lms[i].visibility });
  const seg = (a, b) => {
    const pa = P(a), pb = P(b);
    if (pa.v < 0.4 || pb.v < 0.4) return;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  };
  // ガイド（正中線）
  ctx.save();
  ctx.strokeStyle = 'rgba(250,243,227,.4)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5;
  const gx = mode === 'side' ? (P(LM.rAnkle).v > 0.4 ? P(LM.rAnkle).x : w / 2) : w / 2;
  ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke();
  ctx.restore();
  // 骨格
  ctx.strokeStyle = 'rgba(250,243,227,.9)'; ctx.lineWidth = Math.max(2, w * 0.008); ctx.lineCap = 'round';
  seg(LM.lEar, LM.rEar); seg(LM.lSh, LM.rSh); seg(LM.lHip, LM.rHip);
  seg(LM.lSh, LM.lHip); seg(LM.rSh, LM.rHip);
  seg(LM.lHip, LM.lKnee); seg(LM.lKnee, LM.lAnkle);
  seg(LM.rHip, LM.rKnee); seg(LM.rKnee, LM.rAnkle);
  if (mode === 'side') { seg(LM.rEar, LM.rSh); seg(LM.lEar, LM.lSh); }
  // ポイント
  [LM.lEar, LM.rEar, LM.lSh, LM.rSh, LM.lHip, LM.rHip, LM.lKnee, LM.rKnee, LM.lAnkle, LM.rAnkle].forEach(i => {
    const p = P(i); if (p.v < 0.4) return;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(3.5, w * 0.012), 0, Math.PI * 2);
    ctx.fillStyle = '#f6d97e'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#131c31'; ctx.stroke();
  });
}

function PostureScreen({ route }) {
  const { state, update, back, nav } = useApp();
  const fromVisit = route.params?.from === 'visit';
  const [mode, setMode] = useState(route.params?.mode || 'side');
  const [phase, setPhase] = useState(route.params?.phase || 'normal'); // before | after | normal
  const [view, setView] = useState('menu'); // menu | camera | busy | result
  const [result, setResult] = useState(null); // {canvasUrl, metrics, score, mode}
  const [camErr, setCamErr] = useState(null);
  const [countdown, setCountdown] = useState(0);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const fileRef = useRef(null);

  const stopCam = () => { if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; } };
  useEffect(() => () => stopCam(), []);

  const startCamera = async () => {
    setCamErr(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } }, audio: false });
      streamRef.current = stream;
      setView('camera');
      setTimeout(() => { if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play().catch(() => {}); } }, 50);
    } catch (e) {
      console.warn(e);
      setCamErr('カメラを起動できませんでした。「写真をえらぶ」からもお試しいただけます。');
    }
  };

  const finishAnalyze = (canvas, lms) => {
    const w = canvas.width, h = canvas.height;
    const px = lms.map(p => ({ x: p.x * w, y: p.y * h, visibility: p.visibility }));
    let metrics, score;
    if (mode === 'front') { metrics = frontMetrics(px); score = frontScore(metrics); }
    else {
      const vis = i => lms[i].visibility || 0;
      const side = (vis(LM.lEar) + vis(LM.lSh) + vis(LM.lHip)) > (vis(LM.rEar) + vis(LM.rSh) + vis(LM.rHip)) ? 'l' : 'r';
      metrics = sideMetrics(px, side); score = sideScore(metrics);
    }
    const ctx = canvas.getContext('2d');
    drawOverlay(ctx, w, h, lms, mode);
    // 保存用サムネイル
    const tw = 300, th = Math.round(h / w * 300);
    const tc = document.createElement('canvas'); tc.width = tw; tc.height = th;
    tc.getContext('2d').drawImage(canvas, 0, 0, tw, th);
    setResult({ url: canvas.toDataURL('image/jpeg', 0.82), thumb: tc.toDataURL('image/jpeg', 0.55), metrics, score, mode });
    setView('result');
  };

  const analyzeCanvas = async (canvas, demo) => {
    setView('busy');
    try {
      if (demo) { finishAnalyze(canvas, demoLandmarks(mode, phase === 'after' ? 'after' : 'before')); return; }
      const res = await detectPose(canvas);
      if (!res || !res.poseLandmarks) { toast('からだを見つけられませんでした。全身が写るように撮ってみてね', 'err'); setView('menu'); return; }
      finishAnalyze(canvas, res.poseLandmarks);
    } catch (e) {
      console.warn(e);
      toast('分析エンジンの読み込みに失敗しました（ネット接続をご確認ください）。デモでお試しいただけます', 'err');
      setView('menu');
    }
  };

  const capture = () => {
    setCountdown(3);
    const iv = setInterval(() => {
      setCountdown(c => {
        if (c > 1) return c - 1;
        clearInterval(iv);
        const v = videoRef.current;
        if (v && v.videoWidth) {
          const scale = Math.min(1, 720 / v.videoHeight);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(v.videoWidth * scale); canvas.height = Math.round(v.videoHeight * scale);
          canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
          stopCam();
          analyzeCanvas(canvas, false);
        }
        return 0;
      });
    }, 1000);
  };

  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 900 / img.height);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      analyzeCanvas(canvas, false);
    };
    img.src = URL.createObjectURL(f);
    e.target.value = '';
  };

  const runDemo = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 360; canvas.height = 480;
    drawDemoBody(canvas.getContext('2d'), 360, 480);
    analyzeCanvas(canvas, true);

  const saveResult = () => {
    const rec = {
      id: uid(), date: todayStr(), mode: result.mode, phase,

      if (st.visitFlow) {

        if (phase === 'after') { st.visitFlow.afterId = rec.id; st.visitFlow.step = Math.max(st.visitFlow.step, 5); }
      }
    });
    toast('分析結果をほぞんしました 📊');
    if (fromVisit) back();
    else { setView('menu'); setResult(null); }
  };

  const history = [...(state.posture || [])].reverse();

  return (
    <div className="min-h-screen">
      <BackHeader title="📸 姿勢分析" onBack={() => { stopCam(); back(); }} />

      {view === 'menu' && (
        <div className="p-4 pb-8">

            <Soupy size={46} animate={false} showZzz={false} />
            <p className="text-[11.5px] text-night-100 leading-relaxed font-bold">姿勢は呼吸と自律神経の入り口。施術の前後でとると、変化がひと目でわかるよ！</p>
          </div>

          <p className="text-[12px] font-black text-night-100 mt-4 mb-1.5">① 分析する向き</p>
          <div className="grid grid-cols-2 gap-2">
            {[{ id: 'side', icon: '🚶', t: '側面（よこ向き)', d: 'スマホ首・猫背チェック' }, { id: 'front', icon: '🧍', t: '正面', d: '肩・骨盤の左右差チェック' }].map(o => (
              <button key={o.id} onClick={() => setMode(o.id)}
                className={`btn-press card p-3.5 text-left ${mode === o.id ? 'ring-2 ring-moon-400' : ''}`}>
                <span className="text-[22px]">{o.icon}</span>
                <span className="block text-[12.5px] font-black text-cream-50 mt-1">{o.t}</span>
                <span className="block text-[10px] text-night-200 mt-0.5">{o.d}</span>
              </button>
            ))}
          </div>

          <p className="text-[12px] font-black text-night-100 mt-4 mb-1.5">② タイミング</p>
          <div className="flex gap-1.5">
            {[{ id: 'before', t: '施術前' }, { id: 'after', t: '施術後' }, { id: 'normal', t: 'ふだん' }].map(o => (
              <Chip key={o.id} active={phase === o.id} onClick={() => setPhase(o.id)}>{o.t}</Chip>
            ))}
          </div>

          <p className="text-[12px] font-black text-night-100 mt-4 mb-1.5">③ さつえい方法</p>
          <div className="flex flex-col gap-2">
            <Btn kind="moon" full onClick={startCamera}>📷 カメラでさつえい</Btn>
            <Btn kind="ghost" full onClick={() => fileRef.current && fileRef.current.click()}>🖼️ 写真をえらぶ</Btn>
            <Btn kind="outline" full onClick={runDemo}>✨ デモでためす（カメラ不要）</Btn>
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onFile} />
          </div>
          {camErr && <p className="text-[11px] text-[#f0968c] font-bold mt-2">{camErr}</p>}
          <p className="text-[10px] text-night-300 mt-2 leading-relaxed">📌 撮影のコツ：全身が入るように2〜3m離れて。側面はからだの真横から。写真はこの端末にだけ保存されます。</p>

          {history.length >= 2 && (
            <div className="mt-5">

                    <div className="flex-1">

/* Before / After 比較 */
function PostureCompareScreen() {
  const { state, back, nav } = useApp();
  const all = [...(state.posture || [])];
  const [mode, setMode] = useState(all.filter(p => p.mode === 'side').length >= 2 ? 'side' : 'front');
  const list = all.filter(p => p.mode === mode);
  const defBefore = [...list].reverse().find(p => p.phase === 'before') || list[0];
  const defAfter = [...list].reverse().find(p => p.phase === 'after' && p.id !== defBefore?.id) || [...list].reverse().find(p => p.id !== defBefore?.id);
  const [aId, setAId] = useState(defBefore?.id);
  const [bId, setBId] = useState(defAfter?.id);
  useEffect(() => {
    const l = all.filter(p => p.mode === mode);
    const nb = [...l].reverse().find(p => p.phase === 'before') || l[0];
    const na = [...l].reverse().find(p => p.phase === 'after' && p.id !== nb?.id) || [...l].reverse().find(p => p.id !== nb?.id);
    setAId(nb?.id); setBId(na?.id);
  }, [mode]);

  const A = list.find(p => p.id === aId), B = list.find(p => p.id === bId);

  const deltaRows = (A && B) ? metricRows(mode, B.metrics).map((r, i) => {
    const rowsA = metricRows(mode, A.metrics);
    const numA = parseFloat(rowsA[i].value), numB = parseFloat(r.value);
    const diff = numB - numA;
    return { label: r.label, a: rowsA[i].value, b: r.value, better: diff < -0.05, worse: diff > 0.05 };
  }) : [];

  const improved = A && B ? B.score - A.score : 0;

  return (
    <div className="min-h-screen">
      <BackHeader title="🔄 Before / After" onBack={back} />
      <div className="p-4 pb-8">
        <div className="flex gap-1.5 mb-3">
          <Chip active={mode === 'side'} onClick={() => setMode('side')}>側面</Chip>
          <Chip active={mode === 'front'} onClick={() => setMode('front')}>正面</Chip>
        </div>

        {(!A || !B) ? (
          <div className="card">
            <EmptyState emoji="📸" text="くらべるには2件以上の分析が必要です" sub="施術前と施術後にそれぞれ撮ってみましょう" />
            <div className="p-4 pt-0"><Btn kind="moon" full onClick={() => nav('posture')}>姿勢分析をする</Btn></div>
          </div>
        ) : (
          <div>
            <div className="grid grid-cols-2 gap-2.5">
              {[{ r: A, tag: 'Before', setter: setAId }, { r: B, tag: 'After', setter: setBId }].map(({ r, tag, setter }, col) => (
                <div key={tag} className="card p-3">
                  <p className={`text-[10px] font-black ${col ? 'text-[#4cc2ae]' : 'text-[#f0968c]'}`}>{tag}</p>
                  {r.img
                    ? <img src={r.img} alt={tag} className="w-full rounded-xl border border-night-400/40 mt-1.5" />
                    : <div className="w-full aspect-[3/4] rounded-xl bg-night-500 flex items-center justify-center text-3xl mt-1.5">🧍</div>}
                  <p className="text-center mt-2 text-[22px] font-black" style={{ color: scoreLabel(r.score).color }}>{r.score}<span className="text-[10px]">点</span></p>
                  <select value={r.id} onChange={e => setter(e.target.value)}
                    className="mt-1.5 w-full bg-night-600 border border-night-400/40 rounded-lg text-[10px] font-bold text-night-100 p-1.5 outline-none">
                    {list.map(p => <option key={p.id} value={p.id}>{fmtMD(p.date)} {p.phase === 'before' ? '施術前' : p.phase === 'after' ? '施術後' : 'ふだん'} {p.score}点</option>)}
                  </select>
                </div>
              ))}
            </div>

            <div className="card p-4 mt-3 text-center">
              <p className="text-[11px] font-black text-night-200">姿勢スコアの変化</p>
              <p className="text-[30px] font-black mt-1" style={{ color: improved >= 0 ? '#4cc2ae' : '#f0968c' }}>
                {improved >= 0 ? '+' : ''}{improved}<span className="text-[12px]">点</span>
              </p>
              {improved > 0 && <p className="text-[11.5px] text-night-100 font-bold mt-1">すばらしい変化です！🎉</p>}
            </div>

            <div className="card p-4 mt-3">
              <p className="text-[11px] font-black text-night-200 mb-2">数値のくらべっこ</p>
              {deltaRows.map((r, i) => (
                <div key={i} className="flex items-center gap-2 py-2 border-b border-night-500/40 last:border-0">
                  <span className="flex-1 text-[11.5px] font-bold text-cream-50">{r.label}</span>
                  <span className="text-[11px] text-night-200">{r.a}</span>
                  <span className="text-night-300">→</span>
                  <span className="text-[12px] font-black" style={{ color: r.better ? '#4cc2ae' : r.worse ? '#f0968c' : C.night100 }}>{r.b}</span>
                  <span className="text-[13px]">{r.better ? '📉✨' : r.worse ? '📈' : '➖'}</span>
                </div>
              ))}
            </div>

            <div className="card-deep p-4 mt-3 flex gap-2.5 items-start">
              <Soupy size={50} mood={improved > 0 ? 'happy' : 'sleep'} animate showZzz={false} />
              <div>
                <p className="text-[10.5px] font-black text-moon-300 mb-1">スーピーくんの解説</p>
                <p className="text-[11.5px] text-night-100 leading-relaxed">
                  {improved > 0
                    ? (mode === 'side'
                      ? `首のラインが整って呼吸の通り道がひろがりました。深い呼吸ができると副交感神経が働きやすくなって、今夜のねむりが変わるよ。この状態をキープするには、おうちストレッチがだいじ！`
                      : `左右のバランスが整いました。からだの緊張がほどけると、寝返りがスムーズになって眠りが深くなるよ。おうちケアでこの状態を長もちさせよう！`)
                    : `からだは毎日すこしずつ変化するもの。施術とおうちケアをつづけて、いっしょに整えていこうね。`}
                </p>
              </div>
            </div>

            <div className="mt-4 flex flex-col gap-2">
              <Btn kind="moon" full onClick={() => nav('care')}>🤸 キープ用ストレッチをみる</Btn>
              <Btn kind="ghost" full onClick={() => nav('shop')}>🛍️ おすすめグッズをみる</Btn>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   SECTION 16: 来店ガイド（ご来店〜退店までの理想の導線）
   チェックイン → カウンセリング → 姿勢(前) → 施術 → 姿勢(後)
   → ストレッチ指導 → ご提案 → 次回案内・完了
   ============================================================ */
function VisitFlowScreen() {
  const { state, update, back, nav } = useApp();
  const [checkin, setCheckin] = useState(false);
  const [celebrate, setCelebrate] = useState(null);
  const vf = state.visitFlow;
  const step = vf ? vf.step : 0;
  const recs = useMemo(() => buildRecommendations(state), [state]);
  const recStretchIds = [...new Set(recs.flatMap(r => r.stretch))].slice(0, 3);
  const recProductIds = [...new Set(recs.flatMap(r => r.product))].slice(0, 3);
  const logs7 = recentLogs(state, 7);
  const before = vf && state.posture.find(p => p.id === vf.beforeId);
  const after = vf && state.posture.find(p => p.id === vf.afterId);
  const remaining = ticketRemaining(state);

  const setStep = (n) => update(st => { if (st.visitFlow) st.visitFlow.step = Math.max(st.visitFlow.step, n); });
  const togglePrescribe = (id) => update(st => {
    if (!st.visitFlow) return;
    const p = st.visitFlow.prescribed || [];
    st.visitFlow.prescribed = p.includes(id) ? p.filter(x => x !== id) : [...p, id];
  });

  const complete = () => {
    const summary = {
      before: before ? before.score : null, after: after ? after.score : null,
      prescribed: (vf.prescribed || []).slice(), remaining,
    };
    update(st => {
      const v = st.visits[st.visits.length - 1];
      if (v && v.date === todayStr()) v.karte = summary;
      st.visitFlow = null;
      gainXp(st, 30, '来店フロー完了');
    });
    setCelebrate(summary);
  };

  const STEPS = [
    { icon: '🚪', title: 'ご来店・チェックイン', desc: '会員証を見せて、回数券でチェックイン',
      content: (
        <div>
          <p className="text-[11.5px] text-night-100 leading-relaxed mb-3">ようこそ！受付でこの画面をお見せください。チェックインで <span className="text-moon-300 font-black">+50 XP</span>、スーピーくんがぐんと育ちます。</p>
          <Btn kind="moon" full onClick={() => setCheckin(true)}>🏥 チェックインする</Btn>
        </div>) },
    { icon: '🗣️', title: 'カウンセリング', desc: '最近のねむりをスタッフと確認',
      content: (
        <div>
          {logs7.length ? (
            <div className="card-deep p-3.5 mb-3">
              <p className="text-[10.5px] font-black text-moon-300 mb-2">この7日間のねむり（スタッフに見せてね）</p>
              <div className="grid grid-cols-3 gap-2 text-center">
                <div><p className="text-[20px] font-black text-cream-50">{Math.round(avg(logs7.map(l => l.score)))}</p><p className="text-[9px] text-night-200">平均スコア</p></div>
                <div><p className="text-[20px] font-black text-cream-50">{avg(logs7.map(l => sleepHours(l.bed, l.wake))).toFixed(1)}<span className="text-[10px]">h</span></p><p className="text-[9px] text-night-200">平均時間</p></div>
                <div><p className="text-[20px] font-black text-cream-50">{avg(logs7.map(l => l.awakenings || 0)).toFixed(1)}<span className="text-[10px]">回</span></p><p className="text-[9px] text-night-200">中途覚醒</p></div>
              </div>
              {recs[0] && <p className="text-[10.5px] text-night-100 mt-2.5 leading-relaxed">💡 気になるポイント：{recs[0].issue.label}（{recs[0].issue.evidence}）</p>}
            </div>
          ) : <p className="text-[11.5px] text-night-200 mb-3">睡眠記録はまだありません。今日の状態を直接スタッフにお伝えください。</p>}
          <Btn kind="primary" full onClick={() => setStep(2)}>確認できた ✓</Btn>
        </div>) },
    { icon: '📸', title: '姿勢チェック（施術前）', desc: 'いまのからだを数値で記録',
      content: (
        <div>
          {before
            ? <div className="flex items-center gap-3 mb-3 card-deep p-3">
                {before.img && <img src={before.img} alt="" className="w-10 h-13 rounded-lg border border-night-400/40" style={{ height: 52 }} />}
                <p className="text-[12px] font-bold text-night-100">施術前スコア <span className="text-[18px] font-black" style={{ color: scoreLabel(before.score).color }}>{before.score}点</span></p>
              </div>
            : <p className="text-[11.5px] text-night-100 leading-relaxed mb-3">施術の効果を実感するために、まず「いま」を記録しましょう。</p>}
          <div className="flex flex-col gap-2">
            <Btn kind="moon" full onClick={() => nav('posture', { phase: 'before', from: 'visit' })}>📸 姿勢分析をする</Btn>
            {before ? <Btn kind="primary" full onClick={() => setStep(3)}>つぎへ ✓</Btn>
              : <button onClick={() => setStep(3)} className="text-[11px] font-bold text-night-300">今回はスキップ →</button>}
          </div>
        </div>) },
    { icon: '💆', title: '施術タイム', desc: '呼吸に合わせて、ゆったりリラックス',
      content: (
        <div className="text-center">
          <p className="text-[11.5px] text-night-100 leading-relaxed mb-3">施術中は、ゆっくり長く息を吐くと副交感神経が働いて効果アップ。まるい光に合わせて呼吸してみてね。</p>
          <div className="relative mx-auto w-[130px] h-[130px] mb-3">
            <div className="absolute inset-0 rounded-full" style={{ background: 'radial-gradient(circle,#f6d97e55,#f6d97e11 60%,transparent 70%)', animation: 'breath-guide 8s ease-in-out infinite' }} />
            <div className="absolute inset-[30px] rounded-full border-2 border-moon-400/60" style={{ animation: 'breath-guide 8s ease-in-out infinite' }} />
            <div className="absolute inset-0 flex items-center justify-center text-[11px] font-black text-moon-300">すう…はく…</div>
          </div>
          <Btn kind="primary" full onClick={() => setStep(4)}>施術がおわった ✓</Btn>
        </div>) },
    { icon: '✨', title: '姿勢チェック（施術後）', desc: '変化をその場で体感！',
      content: (
        <div>
          {after
            ? <div className="mb-3">
                <div className="card-deep p-3 flex items-center justify-center gap-4">
                  {before && <span className="text-[16px] font-black text-night-200">{before.score}点</span>}
                  {before && <span className="text-moon-300 font-black">→</span>}
                  <span className="text-[22px] font-black" style={{ color: scoreLabel(after.score).color }}>{after.score}点</span>
                  {before && after.score > before.score && <span className="text-[11px] font-black text-[#4cc2ae]">+{after.score - before.score} 🎉</span>}
                </div>
              </div>
            : <p className="text-[11.5px] text-night-100 leading-relaxed mb-3">施術後のからだをもう一度分析して、Before/Afterをくらべてみましょう。</p>}
          <div className="flex flex-col gap-2">
            <Btn kind="moon" full onClick={() => nav('posture', { phase: 'after', from: 'visit' })}>📸 施術後の姿勢分析</Btn>
            {before && after && <Btn kind="ghost" full onClick={() => nav('postureCompare')}>🔄 Before/Afterをくらべる</Btn>}
            {after ? <Btn kind="primary" full onClick={() => setStep(5)}>つぎへ ✓</Btn>
              : <button onClick={() => setStep(5)} className="text-[11px] font-bold text-night-300">今回はスキップ →</button>}
          </div>
        </div>) },
    { icon: '🤸', title: 'ストレッチ指導', desc: 'おうち用メニューを処方してもらう',
      content: (
        <div>
          <p className="text-[11.5px] text-night-100 leading-relaxed mb-2.5">今日のあなたに合うおうちストレッチ。スタッフと一緒にやり方を確認して、チェックを入れてね。</p>
          <div className="flex flex-col gap-1.5 mb-3">
            {recStretchIds.map(id => {
              const s = STRETCH[id];
              const on = (vf?.prescribed || []).includes(id);
              return (
                <button key={id} onClick={() => togglePrescribe(id)}
                  className={`btn-press text-left p-3 rounded-xl border flex items-center gap-2.5 ${on ? 'border-moon-400 bg-moon-400/10' : 'border-night-400/40 bg-night-600'}`}>
                  <span className="text-[18px]">{s.emoji}</span>
                  <span className="flex-1">
                    <span className="block text-[12px] font-black text-cream-50">{s.name}</span>
                    <span className="block text-[9.5px] text-night-200">{s.area}・約{s.mins}分・{s.when}に</span>
                  </span>
                  <span className={`text-[16px] ${on ? '' : 'opacity-25'}`}>✅</span>
                </button>
              );
            })}
          </div>
          <Btn kind="primary" full onClick={() => setStep(6)}>処方をうけとった ✓</Btn>
        </div>) },
    { icon: '🛍️', title: '本日のご提案', desc: 'あなたの睡眠に合うグッズ',
      content: (
        <div>
          <p className="text-[11.5px] text-night-100 leading-relaxed mb-2.5">分析結果から、おうちの睡眠環境づくりに役立つものをご提案します。気になったらスタッフへ。</p>
          <div className="flex flex-col gap-1.5 mb-3">
            {recProductIds.map(id => {
              const p = PRODUCT[id];
              if (!p) return null;
              return (
                <button key={id} onClick={() => nav('product', { id })} className="btn-press card-deep p-3 flex items-center gap-2.5 text-left">
                  <span className="text-[20px]">{p.emoji}</span>
                  <span className="flex-1">
                    <span className="block text-[12px] font-black text-cream-50">{p.name}</span>
                    <span className="block text-[10px] text-moon-300 font-black">{yen(p.price)}</span>
                  </span>
                  <span className="text-night-300">→</span>
                </button>
              );
            })}
          </div>
          <Btn kind="primary" full onClick={() => setStep(7)}>確認した ✓</Btn>
        </div>) },
    { icon: '📅', title: '次回のご案内・おわり', desc: 'お会計と次回予約',
      content: (
        <div>
          <div className="card-deep p-3.5 mb-3">
            <p className="text-[12px] font-bold text-night-100">🎫 回数券ざんだか <span className="text-[18px] font-black text-moon-300">{remaining}回</span></p>
            <p className="text-[11px] text-night-200 mt-1.5 leading-relaxed">整えたからだは約2〜3週間かけて少しずつ戻ります。次回は <span className="text-cream-50 font-black">{fmtJP(addDays(todayStr(), 14))}</span> ごろがおすすめ。受付でご予約ください。</p>
          </div>
          <p className="text-[11.5px] text-night-100 leading-relaxed mb-3">おうちでは「睡眠記録」と「処方ストレッチ」を続けて、次回いっしょに変化を見ましょう。</p>
          <Btn kind="moon" full onClick={complete}>🌙 本日はおつかれさまでした（完了）</Btn>
        </div>) },
  ];

  return (
    <div className="min-h-screen">
      <BackHeader title="🏥 来店ガイド" onBack={back} />
      <div className="p-4 pb-8">
        {!vf && (
          <NightSky className="rounded-3xl border border-night-500/60 mb-4">
            <div className="p-4 flex items-center gap-3">
              <Soupy size={80} mood="happy" showZzz={false} />
              <div>
                <p className="text-[14px] font-black text-cream-50 leading-snug">ご来店から退店まで、ぼくがご案内するよ！</p>
                <p className="text-[10.5px] text-night-100 mt-1">チェックインするとガイドがはじまります</p>
              </div>
            </div>
          </NightSky>
        )}
        <div className="flex flex-col gap-2">
          {STEPS.map((s, i) => {
            const done = i < step;
            const current = i === step;
            return (
              <div key={i} className={`card overflow-hidden transition ${current ? 'ring-2 ring-moon-400/70' : ''} ${!done && !current ? 'opacity-55' : ''}`}>
                <div className="flex items-center gap-3 px-4 py-3">
                  <span className={`w-9 h-9 rounded-full flex items-center justify-center text-[16px] shrink-0 ${done ? 'bg-cpara/25' : current ? 'bg-moon-400/20' : 'bg-night-500'}`}>
                    {done ? '✓' : s.icon}
                  </span>
                  <div className="flex-1">
                    <p className={`text-[13px] font-black ${done ? 'text-night-200' : 'text-cream-50'}`}>{i + 1}. {s.title}</p>
                    <p className="text-[10px] text-night-300">{s.desc}</p>
                  </div>
                  {current && <span className="text-[9px] font-black text-moon-300 bg-moon-400/10 border border-moon-400/40 rounded-full px-2 py-0.5">いまここ</span>}
                </div>
                {current && <div className="px-4 pb-4 anim-slide-up">{s.content}</div>}
              </div>
            );
          })}
        </div>
      </div>

      <CheckinModal open={checkin} onClose={() => setCheckin(false)} />

      <Modal open={!!celebrate} onClose={() => { setCelebrate(null); back(); }}>
        {celebrate && (
          <div className="text-center py-2">
            <div className="relative inline-block">
              <Soupy size={150} mood="excited" showZzz={false} />
              {Array.from({ length: 10 }).map((_, i) => (
                <span key={i} className="absolute left-1/2 top-1/2 text-[16px]" style={{
                  '--tx': `${Math.cos(i / 10 * Math.PI * 2) * 85}px`, '--ty': `${Math.sin(i / 10 * Math.PI * 2) * 85}px`,
                  animation: `star-burst .9s ease-out ${i * 0.06}s both`,
                }}>⭐</span>
              ))}
            </div>
            <h3 className="text-[17px] font-black text-cream-50">本日もありがとうございました！</h3>
            <div className="card-deep p-3.5 mt-3 text-left text-[11.5px] text-night-100 space-y-1">
              {celebrate.before != null && celebrate.after != null &&
                <p>📸 姿勢スコア {celebrate.before}点 → <span className="font-black text-[#4cc2ae]">{celebrate.after}点</span></p>}
              <p>🤸 処方ストレッチ {celebrate.prescribed.length}こ（ケアタブから見られます）</p>
              <p>🎫 回数券のこり {celebrate.remaining}回</p>
              <p>🌟 +30 XP（来店フロー完了）</p>
            </div>
            <p className="text-[11px] text-night-200 mt-3">今夜の睡眠記録で、施術後のねむりの変化を見てみてね🌙</p>
            <div className="mt-4"><Btn kind="moon" full onClick={() => { setCelebrate(null); back(); }}>おわる</Btn></div>
          </div>
        )}
      </Modal>
    </div>
  );
}

              <p>📸 施術前後の姿勢の変化を体感</p>
              <p>🐑 スーピーくんといっしょに快眠習慣</p>
