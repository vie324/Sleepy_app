const fmtMDW = (dateStr) => { const d = new Date(dateStr+'T12:00:00'); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };

// 就寝・起床時刻から睡眠時間(h)を計算（日またぎ対応）
function sleepHours(bed, wake) {
  if (!bed || !wake) return 0;
  const [bh, bm] = bed.split(':').map(Number);
  const [wh, wm] = wake.split(':').map(Number);
  let mins = (wh*60+wm) - (bh*60+bm);
  if (mins <= 0) mins += 24*60;
  return Math.round(mins/6)/10;
}

function loadScriptOnce(src) {
  window.__loadedScripts = window.__loadedScripts || {};
  if (window.__loadedScripts[src]) return window.__loadedScripts[src];
  window.__loadedScripts[src] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.crossOrigin = 'anonymous';
    s.onload = resolve; s.onerror = () => reject(new Error('script load failed: ' + src));
    document.head.appendChild(s);
  });
  return window.__loadedScripts[src];
}

function toast(msg, type) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'xp' ? 'toast-xp' : type === 'err' ? 'toast-err' : 'toast-info');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2600);
}

function Icon({ name, size = 18, className = '', strokeWidth = 1.7, style }) {
  const body = ICONS[name];
  if (!body) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={`inline-block shrink-0 ${className}`} style={style} aria-hidden="true">{body}</svg>
  );
}
// アイコン付きの丸タイル（旧・絵文字タイルの置き換え）
function IconTile({ name, size = 40, iconSize, className = '', tone = 'default' }) {
  const tones = {
    default: 'bg-night-500/70 text-cream-100',
    gold: 'bg-moon-400/12 text-moon-300 border border-moon-400/30',
    dim: 'bg-night-500/50 text-night-100',
  };
  return (
    <span className={`inline-flex items-center justify-center rounded-[10px] ${tones[tone]} ${className}`}
      style={{ width: size, height: size }}>
      <Icon name={name} size={iconSize || Math.round(size * 0.52)} />
    </span>
  );
}

};
function quickResult(answers) {
  const pts = answers.reduce((a, v) => a + v, 0);
  const score = clamp(Math.round(100 - pts / (QUICK_QS.length * 2) * 100), 0, 100);
  const catPts = {};
  answers.forEach((v, i) => { const c = QUICK_QS[i].cat; catPts[c] = (catPts[c] || 0) + v; });
  const type = Object.keys(catPts).sort((a, b) => catPts[b] - catPts[a])[0] || 'quality';
  return { score, type, ...QUICK_TYPES[type] };
}

const ASSESS_CAT_ADVICE = {
  sleep:  { low:'眠りそのものにお疲れサインが出ています。「眠れるからだ」づくりを最優先に、施術＋深部体温リズムから整えましょう。', issues:['fallAsleep','wakeMid'] },
  rhythm: { low:'体内時計が乱れぎみ。まずは「起きる時刻をそろえる」「朝の光」の2つから始めるのが近道です。', issues:['rhythm'] },
  stress: { low:'こころの緊張（交感神経の高ぶり）が眠りをじゃましています。呼吸法とリラックス習慣で、ブレーキの練習を。', issues:['stress'] },
  body:   { low:'からだのこわばり・こりが強め。ここは施術がいちばん得意な領域です。ストレッチとの二刀流で緩めましょう。', issues:['bodyTension'] },
  env:    { low:'寝室環境と夜の習慣に改善ポイントあり。光・音・寝具・刺激物を1つずつ整えると効果的です。', issues:['env'] },
};
function assessResult(answers) {
  const catPts = {}, catMax = {};
  ASSESS_QS.forEach((qq, i) => {
    let v = answers[i] ?? 0;
    if (qq.rev) v = 3 - v;
    catPts[qq.cat] = (catPts[qq.cat] || 0) + v;
    catMax[qq.cat] = (catMax[qq.cat] || 0) + 3;
  });
  const cats = {};
  ASSESS_CATS.forEach(c => { cats[c.id] = clamp(Math.round(100 - (catPts[c.id] / catMax[c.id]) * 100), 0, 100); });
  const total = Math.round(avg(Object.values(cats)));
  const sorted = [...ASSESS_CATS].sort((a, b) => cats[a.id] - cats[b.id]);
  const worst = sorted.filter(c => cats[c.id] < 70).slice(0, 2).map(c => c.id);
  const best = sorted[sorted.length - 1];
  const level = total >= 80 ? { rank:'A', label:'とてもよく整っています' } : total >= 65 ? { rank:'B', label:'おおむね良好・のびしろあり' } : total >= 50 ? { rank:'C', label:'お疲れサインが出ています' } : { rank:'D', label:'しっかり整えたい状態です' };
  return { total, cats, worst, bestId: best.id, level };
}

function calcSleepScore(log) {
  const h = sleepHours(log.bed, log.wake);
  let dur;
  if (h >= 7 && h <= 8.5) dur = 40;
  else if ((h >= 6.5 && h < 7) || (h > 8.5 && h <= 9)) dur = 33;
  else if ((h >= 6 && h < 6.5) || (h > 9 && h <= 9.5)) dur = 25;
  else if (h >= 5 && h < 6) dur = 15;
  else dur = 6;
  const quality = Math.round((log.quality - 1) / 4 * 25);
  const awake = Math.max(0, 12 - 4 * (log.awakenings || 0));
  const feel = { 1: 2, 2: 7, 3: 13 }[log.feel] || 7;
  let habit = 0;
  (log.habits || []).forEach(id => { const hh = HABIT[id]; if (hh) habit += hh.score; });
  habit = clamp(habit, -10, 10);
  return clamp(dur + quality + awake + feel + habit, 0, 100);
}

// 自律神経バランス推定: -100(交感優位) 〜 +100(副交感優位・リラックス)
function calcAutonomic(log) {
  let symp = 0, para = 0;
  (log.habits || []).forEach(id => { const h = HABIT[id]; if (h) { symp += h.symp; para += h.para; } });
  const hours = sleepHours(log.bed, log.wake);
  if (hours < 6) symp += 15; else if (hours >= 7) para += 8;
  if (log.quality <= 2) symp += 12; else if (log.quality >= 4) para += 10;
  if ((log.awakenings || 0) >= 2) symp += 10;
  if (log.feel === 3) para += 8; else if (log.feel === 1) symp += 8;
  return clamp(Math.round(para - symp), -100, 100);
}

// レベル: 次のレベルに必要なXP = 60 + (lv-1)*30
function levelFromXp(xp) {
  let lv = 1, rest = xp;
  while (lv < 30) {
    const need = 60 + (lv - 1) * 30;
    if (rest < need) return { lv, cur: rest, need };
    rest -= need; lv++;
  }
  return { lv: 30, cur: 0, need: 1 };
}

function analyzeIssues(state) {
  const logs = recentLogs(state, 7);
  const issues = [];
  const push = (id, label, evidence, weight) => issues.push({ id, label, evidence, weight });

  if (logs.length) {
    const scores = logs.map(l => l.score);
    const quals = logs.map(l => l.quality);
    const hrs = logs.map(l => sleepHours(l.bed, l.wake));
    const awakes = logs.map(l => l.awakenings || 0);
    const habitCount = (id) => logs.filter(l => (l.habits || []).includes(id)).length;

    if (avg(scores) < 65) push('lowScore', '睡眠スコアが低め', `直近7日の平均 ${Math.round(avg(scores))}点`, 5);
    if (avg(quals) < 3) push('fallAsleep', 'ねむりの質が低め', `質の平均 ${avg(quals).toFixed(1)}/5`, 4);
    if (avg(hrs) < 6.5 && avg(hrs) > 0) push('shortSleep', '睡眠時間が不足ぎみ', `平均 ${avg(hrs).toFixed(1)}時間`, 4);
    if (avg(awakes) >= 1.3) push('wakeMid', '夜中に目が覚めやすい', `中途覚醒 平均${avg(awakes).toFixed(1)}回`, 4);
    if (habitCount('caffeine') >= 2) push('caffeine', '午後のカフェインが多め', `7日間で${habitCount('caffeine')}回`, 3);
    if (habitCount('phone') >= 3) push('phone', '寝る前スマホの習慣', `7日間で${habitCount('phone')}回`, 3);
    if (habitCount('alcohol') >= 2) push('alcohol', '寝る前の飲酒が多め', `7日間で${habitCount('alcohol')}回`, 3);
    if (logs.length >= 3 && habitCount('bath') <= Math.floor(logs.length / 3)) push('bath', '湯船の習慣が少なめ', `7日間で${habitCount('bath')}回`, 2);
    const lastBal = calcAutonomic(logs[logs.length - 1]);
    if (lastBal <= -25) push('stress', '交感神経が優位（緊張ぎみ）', autonomicLabel(lastBal).label, 4);
  } else {
    push('noLog', 'まだ睡眠記録がありません', '記録するとスーピーくんが分析します', 5);
  }

  const posture = (state.posture || []).slice(-6);
  const lastSide = [...posture].reverse().find(p => p.mode === 'side');
  const lastFront = [...posture].reverse().find(p => p.mode === 'front');
  if (lastSide && lastSide.metrics.fha > 12) push('neckForward', '頭が前に出ている（スマホ首傾向）', `頭部前方角 ${Math.round(lastSide.metrics.fha)}°`, 5);
  if (lastFront && Math.abs(lastFront.metrics.shoulderTilt) > 2.5) push('shoulderDiff', '肩の高さに左右差', `傾き ${Math.abs(lastFront.metrics.shoulderTilt).toFixed(1)}°`, 3);
  if (lastFront && Math.abs(lastFront.metrics.pelvisTilt) > 2.5) push('pelvis', '骨盤の高さに左右差', `傾き ${Math.abs(lastFront.metrics.pelvisTilt).toFixed(1)}°`, 3);
  if ((lastSide && lastSide.score < 70) || (lastFront && lastFront.score < 70)) push('posture', '姿勢スコアが低め', '姿勢の崩れは呼吸と自律神経に影響します', 4);

  const visits = state.visits || [];
  if (visits.length) {
    const last = visits[visits.length - 1].date;
    const days = Math.round((new Date(todayStr()) - new Date(last)) / 86400000);
    if (days >= 21) push('visitStale', `前回のご来店から${days}日`, 'からだのメンテナンス時期です', 3);
  }

  // 本診断の結果からも課題を追加
  const assess = (state.assessments || [])[Math.max(0, (state.assessments || []).length - 1)];
  if (assess) {
    (assess.worst || []).forEach(catId => {
      const adv = ASSESS_CAT_ADVICE[catId];
      const cat = ASSESS_CATS.find(c => c.id === catId);
      if (!adv || !cat) return;
      adv.issues.forEach(issueId => {
        if (!issues.some(i => i.id === issueId)) {
          push(issueId, `本診断：「${cat.name}」が弱点`, `カテゴリスコア ${assess.cats[catId]}点`, 3);
        }
      });
    });
  }
  return issues.sort((a, b) => b.weight - a.weight);
}

function buildRecommendations(state) {
  const issues = analyzeIssues(state);
  const recs = [];
  const usedS = new Set(), usedP = new Set(), usedA = new Set();
  issues.forEach(issue => {
    const r = RECIPES[issue.id];
    if (!r) return;
    const stretch = (r.stretch || []).filter(id => !usedS.has(id)).slice(0, 2);
    const product = (r.product || []).filter(id => !usedP.has(id)).slice(0, 2);
    const article = (r.article || []).filter(id => !usedA.has(id)).slice(0, 1);
    stretch.forEach(id => usedS.add(id)); product.forEach(id => usedP.add(id)); article.forEach(id => usedA.add(id));
    recs.push({ issue, msg: r.msg, stretch, product, article });
  });
  return recs;
}

  const rs = [];
  const h = sleepHours(log.bed, log.wake);
  if (h > 0 && h < 6.5) rs.push(`睡眠時間 ${h}h（理想は7〜8.5h）`);
  else if (h > 9) rs.push(`ねすぎ傾向（${h}h）`);

  if (!rs.length) rs.push('大きなマイナス要因はありません');
  return rs.slice(0, 3);
}

// 直近7日 vs その前7日の比較 → AIフィードバック文を生成
function bedMinutes(bed) {
  const [h, m] = bed.split(':').map(Number);
  let v = h * 60 + m;
  if (v < 12 * 60) v += 24 * 60; // 深夜0〜11時台は翌日扱いで連続化
  return v;
}
function weekCompare(state) {
  const t = todayStr();
  const pickRange = (from, to) => Object.keys(state.sleepLogs).filter(d => d >= from && d <= to).sort()
    .map(d => ({ date: d, ...state.sleepLogs[d] }));
  const cur = pickRange(addDays(t, -6), t);
  const prev = pickRange(addDays(t, -13), addDays(t, -7));
  const stat = (logs) => logs.length ? {
    n: logs.length,
    score: avg(logs.map(l => l.score)),
    hours: avg(logs.map(l => sleepHours(l.bed, l.wake))),
    awake: avg(logs.map(l => l.awakenings || 0)),
    bath: logs.filter(l => (l.habits || []).includes('bath')).length,
    spread: logs.length >= 2 ? Math.max(...logs.map(l => bedMinutes(l.bed))) - Math.min(...logs.map(l => bedMinutes(l.bed))) : 0,
  } : null;
  const a = stat(cur), b = stat(prev);

  const lines = [];
  if (!a) return { lines: ['まだ今週の記録がありません。今夜の記録から、スーピーくんの分析がはじまります。'], focus: null, enough: false };
  if (a && b && b.n >= 3 && a.n >= 3) {
    const ds = Math.round(a.score - b.score);
    if (ds >= 3) lines.push(`直近7日の平均スコアは${Math.round(a.score)}点。前の週より ${ds}点 アップしています。`);
    else if (ds <= -3) lines.push(`直近7日の平均スコアは${Math.round(a.score)}点。前の週より ${-ds}点 下がっています。生活の変化を振り返ってみましょう。`);
    else lines.push(`直近7日の平均スコアは${Math.round(a.score)}点。前の週とほぼ横ばいで安定しています。`);
    const dh = a.hours - b.hours;
    if (Math.abs(dh) >= 0.4) lines.push(dh > 0 ? `睡眠時間は平均${a.hours.toFixed(1)}hに増加（+${dh.toFixed(1)}h）。良い流れです。` : `睡眠時間が平均${a.hours.toFixed(1)}hに減少（${dh.toFixed(1)}h）。まずは就寝を15分前倒しから。`);
    const da = a.awake - b.awake;
    if (da <= -0.4) lines.push(`途中で目が覚める回数が減っています（平均${a.awake.toFixed(1)}回）。眠りの後半が深くなってきたサインです。`);
    else if (da >= 0.4) lines.push(`睡眠時間は確保できていても、途中覚醒が増えています（平均${a.awake.toFixed(1)}回）。飲酒・光・からだの緊張をチェックしましょう。`);
    if (a.spread && b.spread && a.spread <= b.spread - 30) lines.push(`就寝時刻のばらつきが約${Math.round(b.spread)}分→約${Math.round(a.spread)}分に整ってきました。体内時計が安定してきています。`);
    else if (a.spread >= 90) lines.push(`就寝時刻のばらつきが約${Math.round(a.spread)}分あります。「同じ時刻にねる」が今週のカギです。`);
  } else {
    lines.push(`直近${a.n}日の平均スコアは${Math.round(a.score)}点・平均${a.hours.toFixed(1)}時間。あと${Math.max(0, 3 - a.n)}日記録すると、週ごとの変化を比較できます。`.replace('あと0日記録すると、', '来週から'));
    if (a.awake >= 1.3) lines.push(`途中で目が覚める回数が平均${a.awake.toFixed(1)}回とやや多め。就寝前の飲酒・スマホの光を見直してみましょう。`);
  }
  if (a.bath <= Math.floor(a.n / 3) && a.n >= 3) lines.push(`今週の湯船は${a.bath}回。入浴習慣を整えることをおすすめします（就寝90分前・40℃・15分）。`);

  const issues = analyzeIssues(state).filter(i => i.id !== 'noLog');
  const top = issues[0] && RECIPES[issues[0].id] ? { issue: issues[0], recipe: RECIPES[issues[0].id] } : null;
  return { lines: lines.slice(0, 4), focus: top, enough: !!(a && a.n >= 3) };
}

const ASSESS_TREATMENTS = {
  sleep:  '自律神経をととのえる睡眠整体（全身調整）',
  rhythm: '全身調整＋生活リズムカウンセリング',
  stress: '後頭下筋群・呼吸（横隔膜）まわりの調整',
  body:   '首・肩甲骨・骨盤まわりの集中ほぐし',
  env:    '睡眠整体＋寝具・睡眠環境カウンセリング',
};
function assessProposal(rec) {
  const worst = rec.worst || [];
  const causes = worst.map(catId => ({
    cat: ASSESS_CATS.find(c => c.id === catId),
    score: rec.cats[catId],
    text: ASSESS_CAT_ADVICE[catId].low,
  }));
  const treatments = [...new Set(worst.map(id => ASSESS_TREATMENTS[id]))];
  const issueIds = worst.flatMap(id => ASSESS_CAT_ADVICE[id].issues);
  const products = [...new Set(issueIds.flatMap(id => (RECIPES[id]?.product || [])))].filter(id => !PRODUCT[id]?.ticket).slice(0, 3);
  const stretches = [...new Set(issueIds.flatMap(id => (RECIPES[id]?.stretch || [])))].slice(0, 3);
  const serious = rec.level.rank === 'C' || rec.level.rank === 'D';
  const soundId = worst.includes('stress') || worst.includes('sleep') ? 'theta' : worst.includes('env') ? 'rain' : '528';
  return { causes, treatments, products, stretches, serious, soundId };
}

// あなたへのおすすめプラン（サブスクを料金表ではなく提案として見せる）
function recommendPlan(state) {
  const assess = (state.assessments || [])[state.assessments.length - 1];
  const issues = analyzeIssues(state).filter(i => i.id !== 'noLog');
  const heavy = issues.filter(i => ['fallAsleep', 'wakeMid', 'bodyTension', 'lowScore', 'stress', 'neckForward'].includes(i.id));
  const hasData = !!(assess || Object.keys(state.sleepLogs || {}).length);
  let planId = 'sub_light';
  const why = [];
  if (assess && assess.total < 65) { planId = 'sub_std'; why.push(`本診断の整いスコアが${assess.total}点（ランク${assess.level.rank}）`); }
  if (heavy.length >= 2) { planId = 'sub_std'; why.push(`「${heavy[0].label}」など課題が${heavy.length}件見つかっている`); }
  if (planId === 'sub_light' && assess) why.push(`整いスコア${assess.total}点。よい状態のキープが目標`);
  if (planId === 'sub_light' && !why.length && hasData) why.push('大きな課題は少なめ。月1回のメンテナンスで十分');
  const addCare = issues.some(i => ['bath', 'env', 'coldFeet'].includes(i.id));
  return { planId, addCare, why: why.slice(0, 2), hasData };
}

function pendingFollowup(state) {
  const t = todayStr();
  return (state.orders || []).find(o => {
    if ((state.productFollowups || {})[o.id]) return false;
    const days = Math.round((new Date(t) - new Date(o.date)) / 86400000);
    if (days < 3) return false;
    return (o.items || []).some(x => PRODUCT[x.id] && !PRODUCT[x.id].ticket);
  });
}

/* ポインタに追従する擬似3Dチルト（ヒーロー表示用） */
function ParallaxTilt({ children, max = 7, className = '' }) {
  const [t, setT] = useState({ x: 0, y: 0 });
  return (
    <div className={className} style={{ perspective: 700, display: 'inline-block' }}
      onPointerMove={e => {
        const r = e.currentTarget.getBoundingClientRect();
        setT({ x: ((e.clientX - r.left) / r.width) * 2 - 1, y: ((e.clientY - r.top) / r.height) * 2 - 1 });
      }}
      onPointerLeave={() => setT({ x: 0, y: 0 })}>
      <div style={{ transform: `rotateY(${(t.x * max).toFixed(2)}deg) rotateX(${(-t.y * max).toFixed(2)}deg)`, transition: 'transform .18s ease-out', transformStyle: 'preserve-3d' }}>
        {children}
      </div>
    </div>
  );
}

/* キャラクター表示の自動アップグレードフック（http(s)配信時のみ）:
   ① assets/soupy.webm / soupy.mp4 …… リール級のアニメーション動画（最優先）
   ② assets/soupy.glb ……………………… リアルタイム3D（model-viewer）
   ③ SVGスーピーくん + 擬似3Dチルト … どの環境でも動くフォールバック */
function Soupy3DOrSvg(props) {
  const [mode, setMode] = useState('svg'); // svg | glb | video
  const [videoSrc, setVideoSrc] = useState(null);
  useEffect(() => {
    if (location.protocol === 'file:') return;
    let cancelled = false;
    const head = (u) => fetch(u, { method: 'HEAD' }).then(r => r.ok).catch(() => false);
    (async () => {
      for (const src of ['assets/soupy.webm', 'assets/soupy.mp4']) {
        if (await head(src)) { if (!cancelled) { setVideoSrc(src); setMode('video'); } return; }
      }
      if (await head('assets/soupy.glb')) {
        const s = document.createElement('script');
        s.type = 'module'; s.src = 'vendor/model-viewer.min.js';
        s.onload = () => { if (!cancelled) setMode('glb'); };
        document.head.appendChild(s);
      }
    })();
    return () => { cancelled = true; };
  }, []);
  if (mode === 'video') {
    return (
      <video src={videoSrc} autoPlay muted loop playsInline onError={() => setMode('svg')}
        onClick={props.onTap}
        style={{ width: props.size * 0.92, height: props.size * 1.3, objectFit: 'cover', borderRadius: 14,
          border: '1px solid rgba(217,180,92,.4)', boxShadow: '0 22px 48px rgba(0,0,0,.5)', display: 'inline-block' }} />
    );
  }
  if (mode === 'glb') {
    return (
      <model-viewer
        ref={el => { if (el && !el.__spErrHooked) { el.__spErrHooked = true; el.addEventListener('error', () => setMode('svg')); } }}
        src="assets/soupy.glb" autoplay camera-controls disable-zoom auto-rotate auto-rotate-delay="1500"
        interaction-prompt="none" shadow-intensity="1" exposure="1.05"
        camera-orbit="0deg 82deg 105%" style={{ width: props.size, height: props.size * (270 / 260), display: 'inline-block' }} />
    );
  }
  return <ParallaxTilt max={6}><Soupy {...props} /></ParallaxTilt>;
}

}

// 睡眠スコアの推移（単系列・エリア+ライン）
function TrendChart({ data, height = 170 }) {
  const { tip, show } = useTip();
  if (!data.length) return <EmptyState text="まだ記録がありません" sub="睡眠を記録するとグラフが育ちます" />;
  const W = 340, H = 170, padL = 30, padR = 16, padT = 18, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = data.length;
  const x = i => padL + (n === 1 ? iw / 2 : i * (iw / (n - 1)));
  const y = v => padT + ih - (v / 100) * ih;
  const line = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d.score).toFixed(1)}`).join(' ');
  const area = `${line} L${x(n - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block', height: 'auto' }} role="img" aria-label="睡眠スコアの推移">
        {[0, 50, 100].map(v => (
          <g key={v}>
            <line x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke={v === 0 ? C.axis : C.grid} strokeWidth={1} />
            <text x={padL - 6} y={y(v) + 3.5} fontSize={9} fill={C.muted} textAnchor="end">{v}</text>
          </g>
        ))}
        <path d={area} fill={C.gold} opacity={0.16} />
        <path d={line} fill="none" stroke={C.gold} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round" />
        {data.map((d, i) => (
          <g key={d.date}>
            <circle cx={x(i)} cy={y(d.score)} r={3.2} fill={C.gold} stroke="#222e4c" strokeWidth={1.5} />

// 睡眠時間（単系列バー + 理想ゾーン 7〜8.5h）
function HoursBars({ data }) {
  const { tip, show } = useTip();
  if (!data.length) return <EmptyState text="まだ記録がありません" />;
  const W = 340, H = 150, padL = 30, padR = 16, padT = 14, padB = 26;
  const iw = W - padL - padR, ih = H - padT - padB;
  const maxV = Math.max(9.5, ...data.map(d => d.hours));
  const n = data.length;
  const bw = Math.min(26, iw / n * 0.55);
  const x = i => padL + (i + 0.5) * (iw / n) - bw / 2;
  const y = v => padT + ih - (v / maxV) * ih;
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: 'block', height: 'auto' }} role="img" aria-label="睡眠時間の推移">
        <rect x={padL} y={y(8.5)} width={iw} height={y(7) - y(8.5)} fill={C.para} opacity={0.10} />
        {[7, 8.5].map(v => <line key={v} x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke={C.para} strokeWidth={1} strokeDasharray="3 4" opacity={0.5} />)}
        <text x={W - padR} y={y(8.5) - 4} fontSize={8.5} fill={C.para} textAnchor="end" opacity={0.9}>理想 7〜8.5h</text>
        {[0, 3, 6, 9].map(v => (
          <g key={v}>
            <line x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke={v === 0 ? C.axis : C.grid} strokeWidth={1} />
            <text x={padL - 6} y={y(v) + 3.5} fontSize={9} fill={C.muted} textAnchor="end">{v}</text>
          </g>
        ))}

          <g key={d.date} onClick={() => show((x(i) + bw / 2) / W * 100, y(d.hours) / H * 100, `${d.hours}時間`, fmtMDW(d.date))}>

const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

function xpDoneToday(state, reason) {
  const t = todayStr();
  return (state.xpLog || []).some(x => x.date === t && x.reason === reason);
}
function xpCountToday(state, reason) {
  const t = todayStr();
  return (state.xpLog || []).filter(x => x.date === t && x.reason === reason).length;
}
function ticketRemaining(state) {
  const t = todayStr();
  return (state.tickets || []).filter(tk => tk.expiresAt >= t).reduce((a, tk) => a + (tk.total - tk.used), 0);
}
function calcStreak(state) {
  let d = todayStr(), n = 0;
  if (!state.sleepLogs[d]) d = addDays(d, -1);
  while (state.sleepLogs[d]) { n++; d = addDays(d, -1); }
  return n;
}
function soupyMoodOf(state) {
  const logs = recentLogs(state, 3);
  if (!logs.length) return 'sleep';
  const a = avg(logs.map(l => l.score));
  if (a >= 78) return 'happy';
  if (a < 55) return 'tired';
  return 'sleep';
}
function friendshipOf(state) {
  const totalPets = (state.xpLog || []).filter(x => x.reason === 'なでなで').length;
  return Math.min(5, 1 + Math.floor(totalPets / 15));
}
// レベルlvに到達するのに必要な累計XP
function xpForLevel(lv) {
  let total = 0;
  for (let k = 1; k < lv; k++) total += 60 + (k - 1) * 30;
  return total;
}

function HomeScreen() {

  const recs = useMemo(() => buildRecommendations(state), [state]);

  const greet = hour < 4 ? 'こんばんは' : hour < 11 ? 'おはようございます' : hour < 18 ? 'こんにちは' : 'こんばんは';

  const isStore = state.mode === 'store';

  const friendship = friendshipOf(state);
  const bubbles = [];
  if (!todayLog && hour >= 5) bubbles.push('ゆうべはねむれた？きろくを見せてほしいな');
  if (recs[0]) bubbles.push(recs[0].msg);
  if (remaining > 0) bubbles.push(`回数券はあと${remaining}回分あるよ。つぎはいつ来てくれる？`);
  if (streak >= 3) bubbles.push(`${streak}日れんぞくで記録中！すごい！ぼくもうれしい〜`);

  if (friendship >= 4) bubbles.push('ねぇねぇ、こんど月のうえでピクニックしようね');
  if (friendship >= 5) bubbles.push('きみはぼくのいちばんのともだち！ずっといっしょに整えようね');
  if (!bubbles.length) bubbles.push('ぐっすりねむれるからだ、いっしょにつくろうね');
  const bubble = isStore ? 'ようこそSLEEPYへ！きょうもいっしょに整えよう' : bubbles[new Date().getDate() % bubbles.length];

  const pet = () => {
    if (xpCountToday(state, 'なでなで') >= 5) return;

        <div className="flex-1">
          <p className="text-[10.5px] text-night-200 font-bold">睡眠整体サロン SLEEPY</p>
          <p className="text-[16px] font-bold text-cream-50">{greet}、{state.profile.name || 'ゲスト'}さん{state.accountStatus === 'guest' && <span className="ml-1.5 text-[9px] font-bold text-night-200 border border-night-400/60 rounded-[5px] px-1.5 py-0.5 align-[2px]">ゲスト</span>}</p>
        </div>
        <button onClick={() => nav('member')} className="btn-press relative w-11 h-11 rounded-full bg-night-600 border border-night-400/50 flex items-center justify-center" aria-label="会員証">
          <Icon name="ticket" size={18} className="text-cream-100" />
          {remaining > 0 && <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-moon-400 text-night-900 text-[10px] font-bold flex items-center justify-center">{remaining}</span>}
        </button>
        <button onClick={() => nav('settings')} className="btn-press w-11 h-11 rounded-full bg-night-600 border border-night-400/50 flex items-center justify-center" aria-label="設定"><Icon name="gear" size={18} className="text-cream-100" /></button>
      </div>

      {/* モード切り替え */}
      <div className="px-4 mt-1"><ModeSwitch /></div>

      {/* スーピーくんヒーロー */}

            <SpeechBubble text={bubble} />

          <div className="flex items-center justify-center gap-2 pb-3">

            <span className="text-[10.5px] font-bold px-2.5 py-1 rounded-full bg-night-900/60 text-night-100 border border-night-400/40">タップしてなでなで</span>
          </div>

      </div>

      {isStore ? <StoreHome /> : (

            <TodayConditionCard />
          </div>

          {/* ② きょうやること */}

                  <span className="block text-[13px] font-bold text-cream-50">ご来店中：本日の流れをつづける</span>
                  <span className="block text-[10.5px] text-night-200">タップして来店ガイドにもどる</span>
                </span>
                <span className="text-moon-400 font-bold">→</span>
              </button>
            </div>
          )}

          {/* 購入後フォロー */}
          <div className="px-4 mt-3 empty:mt-0"><FollowupCard /></div>

          {/* カウンセリング表CTA（未記入の方向け） */}

                  <span className="block text-[10.5px] text-night-200">3分で入力 → ご来店がスムーズに（+20 XP）</span>
                </span>
                <Icon name="arrowR" size={16} className="text-moon-400" />
              </button>

                <IconTile name="clipboard" size={38} iconSize={18} tone="gold" />

                  <span className="block text-[13px] font-bold text-cream-50">3分でわかる、ねむりの現在地</span>
                  <span className="block text-[10.5px] text-night-200">かんたんAI睡眠診断（8問）＋15 XP</span>
                </span>
                <span className="text-moon-400 font-bold">→</span>
              </button>

          {/* お知らせ（1枠のみ） */}
          <div className="px-4 mt-3 empty:mt-0"><HomeBanner /></div>

          {/* クイックアクション（じたくで使うものだけに絞る） */}
          <div className="px-4 mt-4 grid grid-cols-4 gap-2">
            {[
              { icon: 'clipboard', label: 'かんたん診断', go: () => nav('quick') },
              { icon: 'camera', label: '姿勢分析', go: () => nav('posture') },
              { icon: 'headphones', label: 'サウンド', go: () => nav('sounds') },
              { icon: 'bulb', label: 'まなぶ', go: () => nav('care', { tab: 'learn' }) },
            ].map((a, i) => (
              <button key={i} onClick={a.go} className="btn-press card-deep p-3 flex flex-col items-center gap-1.5">

            {recs.length > 0 ? (
              <div className="flex flex-col gap-2.5">
                {recs.slice(0, 2).map((r, i) => <RecCard key={i} rec={r} />)}

    <div className="flex gap-1.5">
      {[1, 2, 3, 4, 5].map(v => (
        <button key={v} onClick={() => onChange && onChange(v)} className="btn-press" style={{ lineHeight: 1 }}>
          <Icon name="moon" size={size * 0.8} strokeWidth={1.6} className={v <= value ? 'text-moon-400' : 'text-night-400/50'} />

function SleepLogForm({ date, initial, onSave, onClose }) {
  const [bed, setBed] = useState(initial?.bed || '23:30');
  const [wake, setWake] = useState(initial?.wake || '06:30');
  const [quality, setQuality] = useState(initial?.quality || 3);
  const [awakenings, setAwakenings] = useState(initial?.awakenings ?? 0);
  const [feel, setFeel] = useState(initial?.feel || 2);
  const [habits, setHabits] = useState(initial?.habits || []);
  const [tipFor, setTipFor] = useState(null);
  const hours = sleepHours(bed, wake);

  const toggleHabit = id => setHabits(h => h.includes(id) ? h.filter(x => x !== id) : [...h, id]);
  const preview = calcSleepScore({ bed, wake, quality, awakenings, feel, habits });

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div>
          <h3 className="text-[16px] font-bold text-cream-50">{fmtMDW(date)} のねむり</h3>
          <p className="text-[11px] text-night-200 mt-0.5">きのうの夜〜けさの記録</p>
        </div>
        <div className="text-right">
          <span className="text-[22px] font-bold text-moon-400">{preview}</span>
          <span className="text-[10px] text-night-200 font-bold">点</span>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-4">
        <label className="card-deep p-3 block">
          <span className="text-[10.5px] font-bold text-night-200 inline-flex items-center gap-1"><Icon name="bed" size={12} className="text-moon-300" />ねた時間</span>
          <input type="time" value={bed} onChange={e => setBed(e.target.value)}
            className="mt-1 w-full bg-transparent text-[20px] font-bold text-cream-50 outline-none" />
        </label>
        <label className="card-deep p-3 block">
          <span className="text-[10.5px] font-bold text-night-200 inline-flex items-center gap-1"><Icon name="clock" size={12} className="text-moon-300" />おきた時間</span>
          <input type="time" value={wake} onChange={e => setWake(e.target.value)}
            className="mt-1 w-full bg-transparent text-[20px] font-bold text-cream-50 outline-none" />
        </label>
      </div>
      <p className="text-[11.5px] text-night-100 font-bold -mt-2 mb-4 text-center">睡眠時間 <span className="text-moon-300">{hours}時間</span>{hours >= 7 && hours <= 8.5 ? '（理想ゾーン）' : ''}</p>

      <div className="mb-4">
        <p className="text-[12px] font-bold text-night-100 mb-1.5">ねむりの質（ぐっすり度）</p>
        <MoonRating value={quality} onChange={setQuality} />
      </div>

      <div className="mb-4 flex items-center justify-between">
        <p className="text-[12px] font-bold text-night-100">夜中に目がさめた回数</p>
        <div className="flex items-center gap-3">
          <button onClick={() => setAwakenings(a => Math.max(0, a - 1))} className="btn-press w-8 h-8 rounded-full bg-night-500 font-bold">−</button>
          <span className="w-8 text-center text-[18px] font-bold text-cream-50">{awakenings}</span>
          <button onClick={() => setAwakenings(a => Math.min(9, a + 1))} className="btn-press w-8 h-8 rounded-full bg-night-500 font-bold">＋</button>
        </div>
      </div>

      <div className="mb-4">
        <p className="text-[12px] font-bold text-night-100 mb-1.5">朝おきたときの気分</p>
        <div className="grid grid-cols-3 gap-2">
          {FEELS.map(f => (
            <button key={f.v} onClick={() => setFeel(f.v)}
              className={`btn-press p-2.5 rounded-[9px] border text-center ${feel === f.v ? 'bg-cream-100 text-night-900 border-cream-100' : 'bg-night-600 text-night-100 border-night-400/40'}`}>
              <span className="block text-[18px]">{f.icon}</span>
              <span className="block text-[10.5px] font-bold mt-0.5">{f.label}</span>
            </button>
          ))}
        </div>
      </div>

      <div className="mb-5">
        <p className="text-[12px] font-bold text-night-100 mb-0.5">きのうの行動チェック</p>
        <p className="text-[10.5px] text-night-200 mb-2">行動はぜんぶ自律神経とつながっています。ⓘで理由がわかるよ</p>
        <div className="flex flex-col gap-1.5">
          {HABITS.map(h => (
            <div key={h.id} className={`rounded-[9px] border transition ${habits.includes(h.id) ? (h.good ? 'border-cpara/50 bg-cpara/10' : 'border-csymp/50 bg-csymp/10') : 'border-night-400/40 bg-night-600'}`}>
              <div className="flex items-center gap-2 px-3 py-2">
                <button onClick={() => toggleHabit(h.id)} className="btn-press flex items-center gap-2 flex-1 text-left">
                  <span className="text-[15px]">{h.icon}</span>
                  <span className="text-[12px] font-bold text-cream-50">{h.label}</span>
                </button>
                <span className={`text-[9.5px] font-bold px-1.5 py-0.5 rounded ${h.good ? 'text-[#4cc2ae] bg-cpara/15' : 'text-[#f0968c] bg-csymp/15'}`}>{h.good ? '副交感+' : '交感+'}</span>
                <button onClick={() => setTipFor(tipFor === h.id ? null : h.id)} className="btn-press text-night-200 text-[13px] w-6 h-6 rounded-full bg-night-500/60">ⓘ</button>
              </div>
              {tipFor === h.id && <p className="px-3 pb-2.5 text-[11px] text-night-100 leading-relaxed anim-slide-up">{h.tip}</p>}
            </div>
          ))}
        </div>
      </div>

      <div className="flex gap-2">
        <Btn kind="ghost" onClick={onClose}>とじる</Btn>
        <Btn kind="moon" full onClick={() => onSave({ bed, wake, quality, awakenings, feel, habits })}>きろくする</Btn>
      </div>
    </div>
  );
}

const STAMP_DEFS = [
  { id: 'log',     icon: 'moon',     label: 'すいみん記録', color: '#f6d97e' },
  { id: 'stretch', icon: 'stretch',  label: 'ストレッチ',   color: '#6d82ec' },
  { id: 'bath',    icon: 'bath',     label: 'おふろ',       color: '#25a08c' },
  { id: 'visit',   icon: 'building', label: 'ご来店',       color: '#f5b0a0' },
  { id: 'shop',    icon: 'bag',      label: 'おかいもの',   color: '#8b96b8' },
];
function dayStamps(state, d) {
  const s = [];
  if (state.sleepLogs[d]) s.push('log');
  if ((state.stretchLog || []).some(x => x.date === d)) s.push('stretch');
  if ((state.sleepLogs[d]?.habits || []).includes('bath')) s.push('bath');
  if ((state.visits || []).some(v => v.date === d)) s.push('visit');
  if ((state.orders || []).some(o => o.date === d)) s.push('shop');
  return s;
}
function CalendarScreen() {
  const { state, back } = useApp();
  const t = todayStr();
  const [ym, setYm] = useState(t.slice(0, 7)); // 'YYYY-MM'
  const [openDay, setOpenDay] = useState(null);
  const [y, m] = ym.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDow = new Date(y, m - 1, 1).getDay();
  const dates = Array.from({ length: daysInMonth }, (_, i) => `${y}-${pad2(m)}-${pad2(i + 1)}`);
  const moveMonth = (d) => {
    const nd = new Date(y, m - 1 + d, 1);
    setYm(`${nd.getFullYear()}-${pad2(nd.getMonth() + 1)}`);
  };
  const streak = calcStreak(state);
  const counts = Object.fromEntries(STAMP_DEFS.map(s => [s.id, 0]));
  dates.forEach(d => dayStamps(state, d).forEach(id => { counts[id]++; }));
  const elapsed = dates.filter(d => d <= t).length;
  const rate = elapsed ? Math.round(counts.log / elapsed * 100) : 0;
  const isThisMonth = ym === t.slice(0, 7);

  return (
    <div className="min-h-screen">
      <BackHeader title="つづけるカレンダー" onBack={back} />

            {streak >= 3 ? `${streak}日れんぞく記録中！このカレンダーが、がんばりの証だよ` : 'スタンプがたまると、がんばりがひと目でわかるよ。まずは3日つづけてみよう！'}

            <p className="text-[24px] leading-none font-bold text-moon-300 tabular">{streak}<span className="text-[11px] text-night-200">日</span></p>
            <p className="text-[10px] font-bold text-night-200 mt-1.5">れんぞく記録</p>
          </div>
          <div className="card p-3 text-center">
            <p className="text-[24px] leading-none font-bold text-cream-50 tabular">{counts.log}<span className="text-[11px] text-night-200">日</span></p>
            <p className="text-[10px] font-bold text-night-200 mt-1.5">今月の記録</p>
          </div>
          <div className="card p-3 text-center">
            <p className="text-[24px] leading-none font-bold text-cream-50 tabular">{isThisMonth ? rate : Math.round(counts.log / daysInMonth * 100)}<span className="text-[11px] text-night-200">%</span></p>
            <p className="text-[10px] font-bold text-night-200 mt-1.5">記録達成率</p>
          </div>
        </div>

          <div className="flex items-center justify-between mb-3">
            <button onClick={() => moveMonth(-1)} className="btn-press w-9 h-9 rounded-full bg-night-600 flex items-center justify-center" aria-label="前の月">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
            </button>
            <p className="text-[15px] font-bold text-cream-50">{y}年{m}月</p>
            <button onClick={() => moveMonth(1)} disabled={isThisMonth} className={`btn-press w-9 h-9 rounded-full bg-night-600 flex items-center justify-center ${isThisMonth ? 'opacity-30 pointer-events-none' : ''}`} aria-label="次の月">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>

          <div className="grid grid-cols-7 gap-1">
            {Array.from({ length: firstDow }).map((_, i) => <span key={'e' + i} />)}

              const stamps = dayStamps(state, d);

              return (
                <button key={d} onClick={() => !future && stamps.length && setOpenDay(d)}
                  className={`rounded-[9px] border p-1 pb-1.5 min-h-[46px] flex flex-col items-center gap-0.5 ${isToday ? 'border-moon-400/70 bg-moon-400/10' : 'border-night-500/40 bg-night-700/40'} ${future ? 'opacity-30' : ''}`}>

                  <span className="flex flex-wrap justify-center gap-[2px] leading-none">

                      return <span key={id} className="w-[7px] h-[7px] rounded-full" style={{ background: def.color }} />;
                    })}

      </div>

      <Modal open={!!openDay} onClose={() => setOpenDay(null)} title={openDay ? fmtJP(openDay) : ''}>
        {openDay && (
          <div>
            <div className="flex flex-col gap-1.5">
              {dayStamps(state, openDay).map(id => {
                const def = STAMP_DEFS.find(x => x.id === id);
                return (
                  <p key={id} className="card-deep px-3.5 py-2.5 text-[12.5px] font-bold text-cream-50 flex items-center gap-2.5">

            <div className="mt-4"><Btn kind="primary" full onClick={() => setOpenDay(null)}>とじる</Btn></div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ストレッチ実行（ガイド付きタイマー） */
function StretchPlayScreen({ route }) {
  const { state, update, back } = useApp();
  const s = STRETCH[route.params.id];
  const [phase, setPhase] = useState('intro'); // intro | run | done
  const [stepIdx, setStepIdx] = useState(0);
  const [left, setLeft] = useState(0);
  const [paused, setPaused] = useState(false);

  useEffect(() => {
    if (phase !== 'run' || paused) return;
    const iv = setInterval(() => {
      setLeft(l => {
        if (l > 1) return l - 1;
        setStepIdx(i => {
          if (i + 1 < s.steps.length) { setLeft(s.steps[i + 1].sec); return i + 1; }
          setPhase('done'); return i;
        });
        return 0;
      });
    }, 1000);
    return () => clearInterval(iv);
  }, [phase, paused, s]);

  useEffect(() => {
    if (phase === 'done') {
      update(st => { st.stretchLog.push({ date: todayStr(), stretchId: s.id }); gainXp(st, 15, 'ストレッチ'); });
      toast('+15 XP おつかれさま！', 'xp');
    }
  }, [phase]);

  if (!s) return <div className="p-6"><EmptyState text="ストレッチが見つかりません" /></div>;
  const step = s.steps[stepIdx];
  const totalSec = s.steps.reduce((a, x) => a + x.sec, 0);
  const doneSec = s.steps.slice(0, stepIdx).reduce((a, x) => a + x.sec, 0) + (phase === 'run' ? (step.sec - left) : 0);

  return (
    <div className="min-h-screen flex flex-col">
      <BackHeader title={s.name} onBack={back} />
      {phase === 'intro' && (
        <div className="p-4 flex-1">
          <NightSky className="rounded-[14px] border border-night-500/60">
            <div className="p-5 text-center">
              <IconTile name={s.icon} size={64} iconSize={30} tone="gold" className="mx-auto" />
              <h2 className="text-[17px] font-bold text-cream-50 mt-2">{s.name}</h2>
              <p className="text-[11px] text-night-200 mt-1">{s.area} ・ 約{s.mins}分 ・ {s.when}におすすめ</p>
            </div>
          </NightSky>
          <div className="card p-4 mt-3">
            <p className="text-[11px] font-bold text-moon-300 mb-1"><Icon name="sparkle" size={12} className="mr-1 align-[-2px]" />からだへの効果</p>
            <p className="text-[12px] text-night-100 leading-relaxed">{s.effect}</p>
            <p className="text-[11px] font-bold text-moon-300 mb-1 mt-3"><Icon name="scales" size={12} className="mr-1 align-[-2px]" />自律神経へのはたらき</p>
            <p className="text-[12px] text-night-100 leading-relaxed">{s.autonomic}</p>
          </div>
          <div className="card p-4 mt-3">
            <p className="text-[11px] font-bold text-night-200 mb-2">ながれ（全{s.steps.length}ステップ）</p>
            {s.steps.map((st2, i) => (
              <p key={i} className="text-[12px] text-night-100 py-1 border-b border-night-500/40 last:border-0">
                <span className="text-moon-300 font-bold mr-1.5">{i + 1}</span>{st2.text}
                <span className="text-night-300 text-[10px] ml-1">（{st2.sec}秒）</span>
              </p>
            ))}
          </div>
          <div className="mt-4 pb-6">
            <Btn kind="moon" full onClick={() => { setStepIdx(0); setLeft(s.steps[0].sec); setPhase('run'); }}>▶ スタート</Btn>
          </div>
        </div>
      )}

      {phase === 'run' && (
        <div className="p-4 flex-1 flex flex-col">
          <ProgressBar pct={doneSec / totalSec * 100} color={C.moon} />
          <p className="text-[10.5px] text-night-200 font-bold mt-1.5 text-center">ステップ {stepIdx + 1} / {s.steps.length}</p>
          <div className="flex-1 flex flex-col items-center justify-center text-center">
            <div className="relative">
              <svg width="200" height="200" className="-rotate-90">
                <circle cx="100" cy="100" r="88" fill="none" stroke={C.night500} strokeWidth="10" />
                <circle cx="100" cy="100" r="88" fill="none" stroke={C.moon} strokeWidth="10" strokeLinecap="round"
                  strokeDasharray={`${2 * Math.PI * 88 * (left / step.sec)} ${2 * Math.PI * 88}`} style={{ transition: 'stroke-dasharray 1s linear' }} />
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <span className="text-[54px] font-bold text-cream-50 leading-none">{left}</span>
                <span className="text-[11px] text-night-200 font-bold mt-1">びょう</span>
              </div>
            </div>
            <p className="text-[15px] font-bold text-cream-50 leading-relaxed mt-6 px-4">{step.text}</p>
            <div className="mt-5 flex items-center gap-2.5">
              <Soupy size={64} mood="happy" animate showZzz={false} />
              <div className="bg-cream-100 text-night-800 rounded-[10px] px-3 py-2 text-[11px] font-bold">
                {left <= 5 ? 'あとちょっと！' : paused ? 'ひとやすみ中…' : 'いいちょうし！ゆっくり呼吸してね'}
              </div>
            </div>
          </div>
          <div className="flex gap-2 pb-6">
            <Btn kind="ghost" onClick={() => setPaused(p => !p)}>{paused ? '▶ さいかい' : '⏸ いったんとめる'}</Btn>
            <Btn kind="outline" full onClick={() => {
              if (stepIdx + 1 < s.steps.length) { setStepIdx(stepIdx + 1); setLeft(s.steps[stepIdx + 1].sec); }
              else setPhase('done');
            }}>つぎへ ▷</Btn>
          </div>
        </div>
      )}

      {phase === 'done' && (
        <div className="p-4 flex-1 flex flex-col items-center justify-center text-center">
          <div className="relative">
            <Soupy size={180} mood="excited" showZzz={false} />
            {Array.from({ length: 10 }).map((_, i) => (
              <span key={i} className="absolute left-1/2 top-1/2 text-[18px]" style={{
                '--tx': `${Math.cos(i / 10 * Math.PI * 2) * 90}px`, '--ty': `${Math.sin(i / 10 * Math.PI * 2) * 90}px`,
                animation: `star-burst .9s ease-out ${i * 0.05}s both`,
              }}><Icon name={i % 2 ? 'star' : 'sparkle'} size={16} className="text-moon-400" /></span>
            ))}
          </div>
          <h2 className="text-[19px] font-bold text-cream-50 mt-3">おつかれさまでした！</h2>
          <p className="text-[12px] text-night-100 mt-2 leading-relaxed">{s.autonomic}</p>
          <p className="text-[13px] font-bold text-moon-300 mt-3">+15 XP ゲット</p>
          <div className="mt-6 w-full flex gap-2">
            <Btn kind="ghost" full onClick={() => { setPhase('intro'); }}>もう一回</Btn>
            <Btn kind="moon" full onClick={back}>おわる</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

/* 記事 + クイズ */
function ArticleScreen({ route }) {
  const { state, update, back, nav } = useApp();
  const a = ARTICLES.find(x => x.id === route.params.id);
  const [picked, setPicked] = useState(null);
  const answered = picked !== null;

  useEffect(() => {
    if (a && !state.learnRead.includes(a.id)) {
      update(st => { st.learnRead.push(a.id); gainXp(st, 10, 'まなぶ'); });
      toast('+10 XP あたらしい知識をゲット！', 'xp');
    }
  }, []);

  if (!a) return <div className="p-6"><EmptyState text="記事が見つかりません" /></div>;
  const quizDone = !!state.quizDone[a.id];

  const pick = (i) => {
    if (answered) return;
    setPicked(i);
    if (i === a.quiz.answer && !quizDone) {
      update(st => { st.quizDone[a.id] = true; gainXp(st, 10, 'クイズ正解'); });
      toast('+10 XP クイズ正解！', 'xp');
    }
  };

  return (
    <div className="min-h-screen">
      <BackHeader title="まなぶ" onBack={back} />
      <div className="p-4 pb-8">
        <span className="text-[10px] font-bold text-moon-300 bg-moon-400/10 border border-moon-400/30 rounded-full px-2.5 py-1">{a.cat}</span>
        <h1 className="text-[19px] font-bold text-cream-50 mt-2 leading-snug">{a.title}</h1>
        <p className="text-[12.5px] text-moon-200 text-night-100 font-bold mt-2">{a.lead}</p>
        <div className="mt-4 space-y-3">
          {a.body.map((p, i) => <p key={i} className="text-[13px] text-night-50 leading-[1.9]">{p}</p>)}
        </div>

        <div className="card-deep p-4 mt-5 flex gap-3 items-start">
          <Soupy size={52} animate showZzz={false} />
          <div>
            <p className="text-[10.5px] font-bold text-moon-300 mb-1">スーピーくんのひとこと</p>
            <p className="text-[12px] text-night-100 leading-relaxed font-bold">{a.point}</p>
          </div>
        </div>

        {/* クイズ */}
        <div className="card p-4 mt-4">
          <p className="text-[11px] font-bold text-moon-300 mb-1.5"><Icon name="bulb" size={12} className="mr-1 align-[-2px]" />おさらいクイズ {quizDone && '（クリアずみ）'}</p>
          <p className="text-[13.5px] font-bold text-cream-50 leading-snug mb-3">{a.quiz.q}</p>
          <div className="flex flex-col gap-2">
            {a.quiz.choices.map((c, i) => {
              let cls = 'bg-night-600 border-night-400/40 text-night-100';
              if (answered && i === a.quiz.answer) cls = 'border-cpara text-cream-50 bg-cpara/15';
              else if (answered && i === picked) cls = 'border-csymp text-cream-50 bg-csymp/15';
              return (
                <button key={i} onClick={() => pick(i)} className={`btn-press text-left px-3.5 py-3 rounded-[9px] border text-[12.5px] font-bold ${cls}`}>
                  {['Ａ', 'Ｂ', 'Ｃ'][i]}．{c}
                  {answered && i === a.quiz.answer && '　○'}
                  {answered && i === picked && i !== a.quiz.answer && '　×'}
                </button>
              );
            })}
          </div>
          {answered && (
            <div className="anim-slide-up mt-3 bg-night-700 rounded-[9px] p-3">
              <p className="text-[12px] font-bold text-cream-50">{picked === a.quiz.answer ? 'せいかい！' : 'ざんねん…'}</p>
              <p className="text-[11.5px] text-night-100 leading-relaxed mt-1">{a.quiz.explain}</p>
            </div>
          )}
        </div>

        <div className="mt-4"><Btn kind="primary" full onClick={back}>よみおわった</Btn></div>
      </div>
    </div>
  );
}

/* プラン加入・回数券ご購入時のアカウント登録（ゲスト→正式会員） */
function RegistrationModal({ open, onClose, onDone }) {
  const { state, update } = useApp();
  const [name, setName] = useState(state.profile.name || '');
  const [phone, setPhone] = useState(state.profile.phone || '');
  const submit = () => {
    if (!name.trim()) { toast('お名前を入力してください', 'err'); return; }
    update(st => {
      st.accountStatus = 'registered';
      st.profile.name = name.trim();
      st.profile.phone = phone.trim();
      gainXp(st, 30, 'アカウント登録');
    });
    toast('アカウントを登録しました');
    onClose();
    if (onDone) onDone();
  };
  return (
    <Modal open={open} onClose={onClose}>
      <p className="kicker">Member Registration</p>
      <h3 className="text-[16px] font-bold text-cream-50 mt-0.5">アカウント登録</h3>
      <p className="text-[11.5px] text-night-200 mt-1.5 leading-relaxed">プラン・回数券をご利用のお客さまにアカウントを発行しています。登録すると回数券残数・次回のご予約・改善レポートがいつでも確認できます。</p>
      <div className="mt-4 flex flex-col gap-2.5">
        <input value={name} onChange={e => setName(e.target.value)} placeholder="お名前"
          className="w-full bg-night-600 border border-night-400/50 rounded-[9px] px-3.5 py-3 text-[14px] font-bold text-cream-50 outline-none focus:border-moon-400" />
        <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="電話番号（ご予約連絡用）" inputMode="tel"
          className="w-full bg-night-600 border border-night-400/50 rounded-[9px] px-3.5 py-3 text-[14px] font-bold text-cream-50 outline-none focus:border-moon-400" />
      </div>
      <p className="text-[9.5px] text-night-300 mt-2">実運用ではLINEアカウント連携で入力なしに登録されます（docs/ARCHITECTURE.md）。</p>
      <div className="mt-4 flex gap-2">
        <Btn kind="ghost" full onClick={onClose}>あとで</Btn>
        <Btn kind="moon" full onClick={submit}>登録する（+30 XP）</Btn>
      </div>
    </Modal>
  );
}

function cartCount(state) { return (state.cart || []).reduce((a, c) => a + c.qty, 0); }

/* 定額プラン・サブスク（設計図⑪ + 役員FB⑱: 料金表ではなく「あなたへのおすすめ」） */
function SubsSection() {
  const { state, update, nav } = useApp();
  const [join, setJoin] = useState(null);
  const [reg, setReg] = useState(false);
  const [pendingJoin, setPendingJoin] = useState(null);
  const current = state.subscription;
  const plan = join && SUB_PLAN[join];
  const rec = useMemo(() => recommendPlan(state), [state]);
  const recPlan = SUB_PLAN[rec.planId];
  return (
    <div className="px-4 mt-4">
      <SectionTitle icon="calendar" en="Your Program" title="あなたの整えプログラム" sub="診断・睡眠データから、通いかたをご提案します" />

      {/* あなたへのおすすめ（データがある場合） */}
      {!current && rec.hasData && (
        <div className="card p-4 mb-3 hairline-gold relative">
          <span className="absolute -top-2 left-4 text-[9px] font-bold text-night-900 bg-moon-400 rounded-full px-2 py-0.5">いまのあなたへのおすすめ</span>
          <div className="flex items-center gap-3 mt-1">
            <span className="w-11 h-11 rounded-[10px] flex items-center justify-center shrink-0" style={{ background: recPlan.color + '22', color: recPlan.color }}><Icon name={recPlan.icon} size={20} /></span>
            <div className="flex-1">
              <p className="text-[14px] font-bold text-cream-50">{recPlan.cadence}の来店{rec.addCare ? '＋おうちでのホームケア' : ''}</p>
              <p className="text-[11.5px] text-night-200 mt-0.5">{recPlan.name}｜{yen(recPlan.price)}/月</p>
            </div>
          </div>
          {rec.why.length > 0 && (
            <div className="mt-2.5 pt-2.5 border-t border-night-500/40">
              {rec.why.map((w, i) => <p key={i} className="text-[11.5px] text-night-100 leading-relaxed flex items-start gap-1.5"><Icon name="info" size={12} className="text-moon-300 mt-0.5 shrink-0" />{w}ため</p>)}
              {rec.addCare && <p className="text-[11.5px] text-night-100 leading-relaxed flex items-start gap-1.5"><Icon name="info" size={12} className="text-moon-300 mt-0.5 shrink-0" />入浴・冷え対策には「おうちケア定期便」の併用が効果的です</p>}
            </div>
          )}
          <div className="mt-3 flex gap-2">
            <Btn small kind="moon" onClick={() => setJoin(rec.planId)}>このプランで整える</Btn>
            {rec.addCare && <Btn small kind="ghost" onClick={() => setJoin('sub_care')}>定期便も見る</Btn>}
          </div>
        </div>
      )}
      {!current && !rec.hasData && (
        <button onClick={() => nav('assess')} className="btn-press w-full card-deep p-3.5 mb-3 flex items-center gap-2.5 text-left">
          <Icon name="flask" size={17} className="text-moon-300 shrink-0" />
          <span className="flex-1 text-[11.5px] font-bold text-night-100 leading-relaxed">本診断や睡眠記録のデータがたまると、あなたに合った通いかたをここでご提案します。まずは本診断から。</span>
          <Icon name="arrowR" size={14} className="text-moon-400" />
        </button>
      )}

      <p className="text-[11px] font-bold text-night-200 mb-2">すべてのプラン</p>
      <div className="flex flex-col gap-2.5">
        {SUB_PLANS.map(p => {
          const joined = current && current.planId === p.id;
          const recommended = !current && rec.hasData && p.id === rec.planId;
          return (
            <div key={p.id} className={`card p-4 relative ${joined ? 'ring-2 ring-moon-400/70' : ''}`}>
              {recommended
                ? <span className="absolute -top-2 right-4 text-[9px] font-bold text-night-900 bg-moon-400 rounded-full px-2 py-0.5">おすすめ</span>
                : p.popular && <span className="absolute -top-2 right-4 text-[9px] font-bold text-night-900 bg-moon-400 rounded-full px-2 py-0.5">人気No.1</span>}
              <div className="flex items-center gap-3">
                <span className="w-11 h-11 rounded-[10px] flex items-center justify-center" style={{ background: p.color + '22', color: p.color }}><Icon name={p.icon} size={20} /></span>
                <div className="flex-1">
                  <p className="text-[13px] font-bold text-cream-50">{p.name}</p>
                  <p className="text-[11px] text-night-200">{p.cadence}・<span className="text-[14px] font-bold text-cream-50">{yen(p.price)}</span>/月</p>
                </div>
                {joined
                  ? <span className="text-[10px] font-bold text-moon-300 border border-moon-400/50 rounded-full px-2.5 py-1">加入中</span>
                  : <Btn small kind="moon" onClick={() => setJoin(p.id)}>加入する</Btn>}
              </div>
              <p className="text-[11px] text-night-100 leading-relaxed mt-2">{p.desc}</p>
              <div className="flex flex-wrap gap-1 mt-2">
                {p.perks.map((x, i) => <span key={i} className="text-[9.5px] font-bold text-night-100 bg-night-500/60 rounded-full px-2 py-0.5">✓ {x}</span>)}
              </div>
            </div>
          );
        })}
      </div>
      <Modal open={!!join} onClose={() => setJoin(null)}>
        {plan && (
          <div className="text-center py-2">
            <IconTile name={plan.icon} size={56} iconSize={26} tone="gold" className="mx-auto" />
            <h3 className="text-[16px] font-bold text-cream-50 mt-1.5">{plan.name}に加入しますか？</h3>
            <p className="text-[12px] text-night-100 mt-1">{plan.cadence}・{yen(plan.price)}/月（デモ・請求なし）</p>
            {current && current.planId !== plan.id && <p className="text-[10.5px] text-[#f0968c] font-bold mt-1.5">現在のプランから変更になります</p>}
            <div className="mt-4 flex gap-2">
              <Btn kind="ghost" full onClick={() => setJoin(null)}>やめる</Btn>
              <Btn kind="moon" full onClick={() => {
                if (state.accountStatus === 'guest') { setPendingJoin(plan.id); setJoin(null); setReg(true); return; }
                update(st => { st.subscription = { planId: plan.id, since: todayStr() }; gainXp(st, 30, 'サブスク加入'); });
                toast(`${plan.name}へようこそ！`);
                setJoin(null);
              }}>加入する</Btn>
            </div>
          </div>
        )}
      </Modal>
      <RegistrationModal open={reg} onClose={() => setReg(false)} onDone={() => {
        const pid = pendingJoin; setPendingJoin(null);
        if (pid) { update(st => { st.subscription = { planId: pid, since: todayStr() }; gainXp(st, 30, 'サブスク加入'); }); toast(`${SUB_PLAN[pid].name}へようこそ！`); }
      }} />
    </div>
  );
}

function ShopScreen({ route }) {
  const { state, update, nav } = useApp();
  const [cat, setCat] = useState('all');
  const [concern, setConcern] = useState(route?.params?.concern || null);
  const recs = useMemo(() => buildRecommendations(state), [state]);
  const recProducts = [...new Set(recs.flatMap(r => r.product.map(id => ({ id, msg: r.msg, label: r.issue.label })).map(JSON.stringify)))].map(JSON.parse).slice(0, 3);
  const cats = ['all', ...new Set(PRODUCTS.map(p => p.cat))];
  const activeConcern = SHOP_CONCERNS.find(c => c.id === concern);
  const shown = activeConcern
    ? PRODUCTS.filter(p => (p.tags || []).some(t => activeConcern.tags.includes(t)))
    : PRODUCTS.filter(p => cat === 'all' || p.cat === cat);
  const count = cartCount(state);

  const add = (id) => {
    update(st => {
      const item = st.cart.find(c => c.productId === id);
      if (item) item.qty++; else st.cart.push({ productId: id, qty: 1 });
    });
    toast('カートに入れました');
  };

  return (
    <div className="pb-4 relative">
      <div className="px-4 pt-5 pb-1 flex items-center justify-between">
        <div>
          <p className="kicker mb-0.5">Shop</p><h1 className="text-[19px] font-bold tracking-wide text-cream-50">ショップ</h1>
          <p className="text-[11px] text-night-200 mt-0.5">サロン厳選の快眠グッズと回数券</p>
        </div>
        <button onClick={() => nav('cart')} className="btn-press relative w-11 h-11 rounded-full bg-night-600 border border-night-400/50 flex items-center justify-center text-[18px]" aria-label="カート">
          <Icon name="cart" size={18} className="text-cream-100" />
          {count > 0 && <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-moon-400 text-night-900 text-[10px] font-bold flex items-center justify-center">{count}</span>}

        <div className="px-4 mt-3">
          <SectionTitle icon="sparkle" en="For You" title="あなたへのおすすめ" sub="睡眠記録・姿勢分析にもとづく提案です" />
          <div className="flex gap-2.5 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4">
            {recProducts.map(({ id, label }) => {
              const p = PRODUCT[id];
              if (!p) return null;
              return (
                <button key={id} onClick={() => nav('product', { id })} className="btn-press shrink-0 w-[210px] rounded-[14px] p-4 text-left border border-moon-400/30"
                  style={{ background: 'linear-gradient(135deg,#2b3a5e,#222e4c)' }}>
                  <span className="text-[9.5px] font-bold text-night-900 bg-moon-400 rounded-full px-2 py-0.5">「{label}」のあなたに</span>
                  <div className="flex items-center gap-2.5 mt-2.5">
                    <IconTile name={p.icon} size={44} tone="gold" />
                    <span>
                      <span className="block text-[12px] font-bold text-cream-50 leading-snug">{p.name}</span>
                      <span className="block text-[12px] font-bold text-moon-300 mt-0.5">{yen(p.price)}</span>
                    </span>
                  </div>
                </button>
              );
            })}

        </div>
      )}

      {/* お悩みからえらぶ（役員FB⑯: 商品起点ではなく悩み起点） */}

        <SectionTitle icon="search" en="By Concern" title="お悩みからえらぶ" sub="解決したいことから、ぴったりのアイテムへ" />

              className={`btn-press p-3 rounded-[10px] border text-left flex items-center gap-2.5 ${concern === c.id ? 'bg-moon-400/12 border-moon-400/60' : 'bg-night-600 border-night-400/40'}`}>
              <Icon name={c.icon} size={17} className={concern === c.id ? 'text-moon-300' : 'text-night-100'} />

        {shown.map(p => (
          <div key={p.id} className="card p-3 flex flex-col">
            <button onClick={() => nav('product', { id: p.id })} className="btn-press text-left flex-1">
              <div className="h-[74px] rounded-[10px] bg-night-500/50 flex items-center justify-center text-cream-100/90"><Icon name={p.icon} size={30} strokeWidth={1.5} /></div>
              <p className="text-[9.5px] font-bold text-moon-300 mt-2">{p.cat}{p.badge && <span className="ml-1.5 text-[8.5px] text-night-900 bg-moon-400 rounded-[5px] px-1.5 py-0.5 font-bold">{p.badge}</span>}</p>
              <p className="text-[12px] font-bold text-cream-50 leading-snug mt-0.5">{p.name}</p>

          </div>
        ))}
        {shown.length === 0 && <div className="col-span-2 card"><EmptyState icon="bag" text="該当する商品がありません" sub="ほかのお悩み・カテゴリもみてみてね" /></div>}
      </div>

      {/* 定額プラン（来店ガイドから来た場合は最上部に表示済み） */}
      {route?.params?.view !== 'subs' && <SubsSection />}
    </div>
  );
}

  const add = () => {
    update(st => {
      const item = st.cart.find(c => c.productId === p.id);

function CartScreen() {
  const { state, update, back, nav } = useApp();
  const [done, setDone] = useState(null);
  const [delivery, setDelivery] = useState('store');
  const [reg, setReg] = useState(false);
  const items = (state.cart || []).map(c => ({ ...c, p: PRODUCT[c.productId] })).filter(x => x.p);
  const total = items.reduce((a, x) => a + x.p.price * x.qty, 0);

  const setQty = (id, d) => update(st => {
    const item = st.cart.find(c => c.productId === id);
    if (!item) return;
    item.qty += d;
    if (item.qty <= 0) st.cart = st.cart.filter(c => c.productId !== id);
  });

  const checkout = () => {
    if (state.accountStatus === 'guest' && items.some(x => x.p.ticket)) { setReg(true); return; }
    const order = { id: uid(), date: todayStr(), items: items.map(x => ({ id: x.productId, qty: x.qty })), total, delivery };
    update(st => {
      st.orders.push(order);
      // 回数券商品は残高に追加
      items.forEach(x => {
        if (x.p.ticket) {
          for (let i = 0; i < x.qty; i++) {
            st.tickets.push({
              id: uid(), name: x.p.name, total: x.p.ticket.count, used: 0,
              purchasedAt: todayStr(), expiresAt: addDays(todayStr(), Math.round(x.p.ticket.months * 30.4)), history: [],
            });
          }
        }
      });
      st.cart = [];
      gainXp(st, 20, 'おかいもの');
    });
    setDone(order);
  };

  return (
    <div className="min-h-screen">
      <BackHeader title="カート" onBack={back} />
      <div className="p-4 pb-8">
        {items.length === 0 && !done && <EmptyState icon="cart" text="カートはからっぽです" sub="ショップでスーピーくんのおすすめを見てみよう" />}
        <div className="flex flex-col gap-2">
          {items.map(x => (
            <div key={x.productId} className="card p-3 flex items-center gap-3">
              <IconTile name={x.p.icon} size={44} />
              <div className="flex-1 min-w-0">
                <p className="text-[12px] font-bold text-cream-50 truncate">{x.p.name}</p>
                <p className="text-[12px] font-bold text-moon-300">{yen(x.p.price)}</p>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setQty(x.productId, -1)} className="btn-press w-7 h-7 rounded-full bg-night-500 font-bold">−</button>
                <span className="w-5 text-center font-bold text-[14px]">{x.qty}</span>
                <button onClick={() => setQty(x.productId, +1)} className="btn-press w-7 h-7 rounded-full bg-night-500 font-bold">＋</button>
              </div>
            </div>
          ))}
        </div>
        {items.length > 0 && (
          <div className="mt-4">
            <div className="card p-3.5 mb-2.5">
              <p className="text-[11px] font-bold text-night-100 mb-2">お受け取り方法（在庫なし・持ち帰り不要）</p>
              <div className="grid grid-cols-2 gap-2">
                {[{ id: 'store', icon: 'building', t: '次回ご来店時に受け取り' }, { id: 'ship', icon: 'box', t: '自宅へ配送（送料無料）' }].map(o => (
                  <button key={o.id} onClick={() => setDelivery(o.id)}
                    className={`btn-press p-2.5 rounded-[9px] border text-[11px] font-bold ${delivery === o.id ? 'bg-cream-100 text-night-900 border-cream-100' : 'bg-night-600 text-night-100 border-night-400/40'}`}>
                    <Icon name={o.icon} size={13} className="mr-1 align-[-2px]" />{o.t}
                  </button>
                ))}
              </div>
            </div>
            <div className="card p-4 flex items-center justify-between">
              <span className="text-[12.5px] font-bold text-night-100">ごうけい（税込）</span>
              <span className="text-[20px] font-bold text-cream-50">{yen(total)}</span>

function CheckinModal({ open, onClose }) {
  const { state, update, nav } = useApp();
  const [step, setStep] = useState('confirm'); // confirm | ticket | done
  const tickets = (state.tickets || []).filter(tk => tk.total - tk.used > 0 && tk.expiresAt >= todayStr());
  const [tkId, setTkId] = useState(null);

  useEffect(() => { if (open) { setStep('confirm'); setTkId(tickets[0]?.id || 'cash'); } }, [open]);

  const doCheckin = () => {
    update(st => {
      const useTk = st.tickets.find(x => x.id === tkId);
      if (useTk) { useTk.used++; useTk.history.push({ date: todayStr(), note: '睡眠整体' }); }
      st.visits.push({ id: uid(), date: todayStr(), menu: '睡眠整体', note: useTk ? `回数券使用（のこり${useTk.total - useTk.used}回）` : '都度払い' });
      gainXp(st, 50, 'ご来店');
      st.mode = 'store';
      if (!st.visitFlow) st.visitFlow = { step: 2, startedAt: todayStr(), beforeId: null, afterId: null, prescribed: [], goalNote: '', feelBefore: null, feelAfter: null };
      else st.visitFlow.step = Math.max(st.visitFlow.step, 2);
    });
    setStep('done');
  };

  return (
    <Modal open={open} onClose={onClose}>
      {step === 'confirm' && (
        <div>
          <h3 className="text-[16px] font-bold text-cream-50 mb-1">ご来店チェックイン</h3>
          <p className="text-[11.5px] text-night-200 mb-4">受付でスタッフと一緒にお進みください。</p>
          <div className="card-deep p-3.5 mb-3">
            <p className="text-[11px] font-bold text-night-100 mb-2">お支払い方法をえらぶ</p>
            <div className="flex flex-col gap-1.5">
              {tickets.map(tk => (
                <button key={tk.id} onClick={() => setTkId(tk.id)}
                  className={`btn-press text-left px-3 py-2.5 rounded-[9px] border text-[12px] font-bold ${tkId === tk.id ? 'border-moon-400 bg-moon-400/10 text-cream-50' : 'border-night-400/40 bg-night-600 text-night-100'}`}>
                  <Icon name="ticket" size={13} className="mr-1 text-moon-300 align-[-2px]" />{tk.name} <span className="text-moon-300">のこり{tk.total - tk.used}回</span>
                  <span className="block text-[9.5px] text-night-300 mt-0.5">有効期限 {fmtJP(tk.expiresAt)}</span>
                </button>
              ))}
              <button onClick={() => setTkId('cash')}
                className={`btn-press text-left px-3 py-2.5 rounded-[9px] border text-[12px] font-bold ${tkId === 'cash' ? 'border-moon-400 bg-moon-400/10 text-cream-50' : 'border-night-400/40 bg-night-600 text-night-100'}`}>
                <Icon name="yen" size={13} className="mr-1 align-[-2px]" />都度払い／その他
              </button>
            </div>
          </div>
          <div className="flex gap-2">
            <Btn kind="ghost" onClick={onClose}>やめる</Btn>
            <Btn kind="moon" full onClick={doCheckin}>チェックインする（+50 XP）</Btn>
          </div>
        </div>
      )}
      {step === 'done' && (
        <div className="text-center py-2">
          <Soupy size={140} mood="excited" showZzz={false} className="mx-auto" />
          <h3 className="text-[17px] font-bold text-cream-50 mt-1">ようこそ、SLEEPYへ！</h3>
          <p className="text-[11.5px] text-night-100 mt-1.5">+50 XP！本日の流れをガイドでご案内します。</p>
          <div className="mt-4 flex gap-2">
            <Btn kind="ghost" onClick={onClose}>とじる</Btn>
            <Btn kind="moon" full onClick={() => { onClose(); nav('visit'); }}>来店ガイドをひらく</Btn>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ============================================================
   SECTION 15: 姿勢分析（MediaPipe Pose）
   カメラ / 写真 / デモ の3入力 → 骨格検出 → スコア化 → 保存
   施術前(before)/施術後(after)を保存してBefore/After比較。
   ============================================================ */
// 姿勢の撮影・分析は管理コンソール(admin.html)側で実施し、ここでは結果のみ表示する


function metricRows(mode, m) {
  if (mode === 'front') return [
    { label: '頭のかたむき', value: `${Math.abs(m.headTilt).toFixed(1)}°`, ok: Math.abs(m.headTilt) < 2.5, warn: Math.abs(m.headTilt) < 5,
      note: '首の左右バランス。かたむきは首すじの緊張のサイン。' },
    { label: '肩の高さの差', value: `${Math.abs(m.shoulderTilt).toFixed(1)}°`, ok: Math.abs(m.shoulderTilt) < 2.5, warn: Math.abs(m.shoulderTilt) < 5,
      note: '肩の左右差は肩甲骨まわりのこわばりと関係します。' },
    { label: '骨盤のかたむき', value: `${Math.abs(m.pelvisTilt).toFixed(1)}°`, ok: Math.abs(m.pelvisTilt) < 2.5, warn: Math.abs(m.pelvisTilt) < 5,
      note: '骨盤の傾きは腰の負担・寝返りのしやすさに影響。' },
    { label: '重心の左右ズレ', value: `${Math.abs(m.centerShift).toFixed(0)}%`, ok: Math.abs(m.centerShift) < 8, warn: Math.abs(m.centerShift) < 16,
      note: '立ち姿勢の安定感。ズレが大きいと片側に負担が集中。' },
  ];
  return [
    { label: '頭部前方角（スマホ首）', value: `${m.fha.toFixed(1)}°`, ok: m.fha < 8, warn: m.fha < 15,
      note: '頭が前に出るほど首の負担が増え、呼吸が浅くなります。' },
    { label: '体幹の前後傾', value: `${m.trunkLean.toFixed(1)}°`, ok: m.trunkLean < 4, warn: m.trunkLean < 8,
      note: '猫背・反り腰の目安。胸がひらくと呼吸がラクに。' },
    { label: 'からだの軸ライン', value: `${m.kneeLean.toFixed(1)}°`, ok: m.kneeLean < 4, warn: m.kneeLean < 8,
      note: '耳〜肩〜骨盤〜くるぶしが一直線に近いほど理想的。' },
  ];
}

function sleepConnection(mode, m, score) {
  const msgs = [];
  if (mode === 'side') {
    if (m.fha >= 15) msgs.push('頭がかなり前に出ています。首の緊張が交感神経を刺激し、気道もせまくなりがち。寝つき・いびき・眠りの浅さにつながる姿勢です。');
    else if (m.fha >= 8) msgs.push('やや頭が前に出ています。首まわりの緊張は「切り替えベタな自律神経」の原因に。首ケアとまくらの見直しがおすすめ。');
    else msgs.push('首のラインがきれいです。気道と自律神経の通り道にやさしい姿勢で、深い呼吸→ぐっすりの好循環がつくれます。');
    if (m.trunkLean >= 8) msgs.push('体幹の傾きが大きめ。胸郭が圧迫され呼吸が浅くなりやすい状態です。');
  } else {
    if (Math.abs(m.shoulderTilt) >= 5) msgs.push('肩の高さに差があります。片側の筋緊張は睡眠中の寝返りをじゃまして、眠りを浅くすることがあります。');
    else if (Math.abs(m.shoulderTilt) >= 2.5) msgs.push('肩にわずかな左右差。肩甲骨ストレッチでゆるめておきましょう。');
    if (Math.abs(m.pelvisTilt) >= 2.5) msgs.push('骨盤にかたむきがあります。腰の緊張は中途覚醒の一因になります。');
    if (!msgs.length) msgs.push('左右バランスがとても良い状態。からだが休まりやすい姿勢です。');
  }
  if (score < 70) msgs.push('施術で整えると、呼吸と自律神経のスイッチが入りやすいからだになります。');
  return msgs;
}

/* ============================================================
   SECTION 15.5: おやすみサウンド（Web Audioで周波数を生成・完全オフライン）
   ============================================================ */
const Sound = {
  ctx: null, master: null, nodes: [], playing: null, timerId: null, _noise: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  noiseBuffer() {
    if (this._noise) return this._noise;
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    this._noise = buf;
    return buf;
  },
  start(id, volume) {
    this.stop();
    this.ensure();
    this.master.gain.value = volume;
    const ctx = this.ctx, add = n => { this.nodes.push(n); return n; };
    const mk = (type, freq, gainV, pan) => {
      const o = add(ctx.createOscillator()); o.type = type; o.frequency.value = freq;
      const g = add(ctx.createGain()); g.gain.value = gainV;
      o.connect(g);
      if (pan !== undefined && ctx.createStereoPanner) { const p = add(ctx.createStereoPanner()); p.pan.value = pan; g.connect(p); p.connect(this.master); }
      else g.connect(this.master);
      o.start();
      return { o, g };
    };
    const mkNoise = (cutoff, gainV) => {
      const src = add(ctx.createBufferSource()); src.buffer = this.noiseBuffer(); src.loop = true;
      const f = add(ctx.createBiquadFilter()); f.type = 'lowpass'; f.frequency.value = cutoff;
      const g = add(ctx.createGain()); g.gain.value = gainV;
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start();
      return { src, f, g };
    };
    if (id === '528') {
      const t = mk('sine', 528, 0.16);
      const lfo = add(ctx.createOscillator()); lfo.frequency.value = 0.15;
      const lg = add(ctx.createGain()); lg.gain.value = 0.05;
      lfo.connect(lg); lg.connect(t.g.gain); lfo.start();
      mkNoise(420, 0.05);
    } else if (id === 'theta') {
      mk('sine', 180, 0.15, -1);
      mk('sine', 184, 0.15, 1);
      mkNoise(300, 0.03);
    } else if (id === 'rain') {
      mkNoise(850, 0.5);
      const drips = mkNoise(2600, 0.08);
      const lfo = add(ctx.createOscillator()); lfo.frequency.value = 0.4;
      const lg = add(ctx.createGain()); lg.gain.value = 900;
      lfo.connect(lg); lg.connect(drips.f.frequency); lfo.start();
    }
    this.playing = id;
  },
  stop() {
    clearTimeout(this.timerId); this.timerId = null;
    this.nodes.forEach(n => { try { if (n.stop) n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} });
    this.nodes = [];
    this.playing = null;
  },
  setVolume(v) { if (this.master) this.master.gain.value = v; },
  setTimer(mins, onEnd) {
    clearTimeout(this.timerId);
    if (mins) this.timerId = setTimeout(() => { this.stop(); onEnd && onEnd(); }, mins * 60000);
  },
};

/* ============================================================
   SECTION 15.45: ヘルスケア連携（Apple export.xml / 汎用CSV 取り込み）
   HealthKit/Health Connectの直接APIはネイティブアプリ専用のため、
   Web版では「書き出しファイルの取り込み」で連携する（手入力も可）。
   ============================================================ */
function summarizeSleepSessions(sessions) {
  // sessions: [{start:Date, end:Date, kind:'asleep'|'inbed'|'awake'}] → 夜ごとのログ
  const nights = {};
  sessions.forEach(s => {
    const wakeRef = new Date(s.end.getTime() - 12 * 3600 * 1000); // 正午区切りで夜を判定
    const key = toDateStr(new Date(wakeRef.getTime() + 24 * 3600 * 1000));
    (nights[key] = nights[key] || []).push(s);
  });
  const logs = {};
  Object.entries(nights).forEach(([date, ss]) => {
    const asleep = ss.filter(x => x.kind === 'asleep');
    const all = asleep.length ? asleep : ss.filter(x => x.kind === 'inbed');
    if (!all.length) return;
    all.sort((a, b) => a.start - b.start);
    const bedD = all[0].start, wakeD = all[all.length - 1].end;
    let asleepMin = 0;
    asleep.forEach(x => { asleepMin += (x.end - x.start) / 60000; });
    const spanMin = (wakeD - bedD) / 60000;
    if (spanMin < 90 || spanMin > 16 * 60) return; // 昼寝や異常値は除外
    let awakenings = 0;
    for (let i = 1; i < all.length; i++) {
      if ((all[i].start - all[i - 1].end) / 60000 >= 5) awakenings++;
    }
    const eff = asleepMin > 0 ? asleepMin / spanMin : 0.85;
    let quality = eff >= 0.93 && awakenings <= 1 ? 5 : eff >= 0.87 ? 4 : eff >= 0.78 ? 3 : eff >= 0.68 ? 2 : 1;
    const log = {
      bed: `${pad2(bedD.getHours())}:${pad2(bedD.getMinutes())}`,
      wake: `${pad2(wakeD.getHours())}:${pad2(wakeD.getMinutes())}`,
      quality, awakenings: clamp(awakenings, 0, 9), feel: 2, habits: [], source: 'health',
    };
    log.score = calcSleepScore(log);
    log.balance = calcAutonomic(log);
    logs[date] = log;
  });
  return logs;
}

async function parseAppleHealthXml(file, onProgress) {
  const since = new Date(); since.setDate(since.getDate() - 92);
  const reader = file.stream().getReader();
  const decoder = new TextDecoder();
  let carry = '';
  const sessions = [];
  const re = /<Record[^>]*type="HKCategoryTypeIdentifierSleepAnalysis"[^>]*\/>/g;
  const attr = (s, name) => { const m = s.match(new RegExp(name + '="([^"]+)"')); return m ? m[1] : null; };
  let read = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    read += value.byteLength;
    if (onProgress) onProgress(read);
    const chunk = carry + decoder.decode(value, { stream: true });
    let m, lastEnd = 0;
    while ((m = re.exec(chunk))) {
      lastEnd = m.index + m[0].length;
      const v = attr(m[0], 'value') || '';
      const sd = attr(m[0], 'startDate'), ed = attr(m[0], 'endDate');
      if (!sd || !ed) continue;
      const start = new Date(sd.replace(' +', '+').replace(' -', '-'));
      const end = new Date(ed.replace(' +', '+').replace(' -', '-'));
      if (isNaN(start) || isNaN(end) || end <= start || end < since) continue;
      const kind = /Asleep/i.test(v) ? 'asleep' : /Awake/i.test(v) ? 'awake' : 'inbed';
      sessions.push({ start, end, kind });
    }
    carry = chunk.slice(Math.max(lastEnd, chunk.length - 4096));
    re.lastIndex = 0;
  }
  return summarizeSleepSessions(sessions);
}

function parseSleepCsv(text) {
  const logs = {};
  text.split(/\r?\n/).forEach((line, i) => {
    const cols = line.split(',').map(s => s.trim());
    if (i === 0 && /date|日付/i.test(cols[0] || '')) return;
    if (cols.length < 3 || !/^\d{4}-\d{2}-\d{2}$/.test(cols[0])) return;
    const [date, bed, wake, q, aw] = cols;
    if (!/^\d{1,2}:\d{2}$/.test(bed) || !/^\d{1,2}:\d{2}$/.test(wake)) return;
    const log = { bed, wake, quality: clamp(parseInt(q) || 3, 1, 5), awakenings: clamp(parseInt(aw) || 0, 0, 9), feel: 2, habits: [], source: 'csv' };
    log.score = calcSleepScore(log);
    log.balance = calcAutonomic(log);
    logs[date] = log;
  });
  return logs;
}

    if (!concerns.length && !worst.trim()) { toast('お悩みを1つ以上えらんでください', 'err'); return; }
    const answers = { name: name.trim() || 'ゲスト', age, job, concerns, worst: worst.trim(), bed, wake, sleepSat, habits, bodyNote: bodyNote.trim(), hope: hope.trim() };
    const analysis = counselingAnalyze(answers);
    const rec = { id: uid(), date: todayStr(), answers, customer: analysis.customer };
    update(st => {
      st.counselings.push(rec);
      if (!st.profile.name && answers.name !== 'ゲスト') st.profile.name = answers.name;
      if (st.visitFlow) st.visitFlow.step = Math.max(st.visitFlow.step, 1);
      if (!xpDoneToday(st, 'カウンセリング')) gainXp(st, 20, 'カウンセリング');
    });
    pushCounselingInbox({ id: rec.id, submittedAt: todayStr(), name: answers.name, memberNo: state.profile.memberNo, answers, staff: analysis.staff, customer: analysis.customer });
    setResult(analysis.customer);
  };

  if (result) return (
    <div className="min-h-screen">
      <BackHeader title="カウンセリング表" onBack={back} />
      <div className="p-4 pb-8 anim-slide-up">
        <div className="card p-5 text-center">
          <p className="kicker">Quick Analysis</p>
          <h2 className="text-[16px] font-bold text-cream-50 mt-1">送信ありがとうございました</h2>

          <p className="text-[14px] font-bold text-cream-50 mt-2"><Icon name={result.icon} size={14} className="mr-1 text-moon-300 align-[-2px]" />あなたは「{result.label}」タイプ</p>
          <p className="text-[11px] font-bold text-moon-300 mt-1">いまの状態：{result.autonomicShort}</p>
          <p className="text-[12px] text-night-100 leading-relaxed mt-2 text-left">{result.comment}</p>
        </div>
        <div className="card-deep p-4 mt-3 flex gap-2.5 items-start">
          <Icon name="users" size={18} className="text-moon-300 shrink-0 mt-0.5" />
          <p className="text-[11.5px] text-night-100 leading-relaxed">内容はサロンのスタッフが事前に確認し、ご来店時のカウンセリングであなたに合わせたご提案をします。くわしい分析はご来店時にお伝えしますね。</p>
        </div>
        <div className="mt-4"><Btn kind="moon" full onClick={back}>とじる</Btn></div>
      </div>
    </div>
  );

  const SEC_TOTAL = 6;
  const secDone = [
    !!(name.trim() || age || job),
    concerns.length > 0 || !!worst.trim(),
    true, // 睡眠は初期値のままでもOK
    habits.length > 0,
    !!bodyNote.trim(),
    !!hope.trim(),
  ];
  const doneCount = secDone.filter(Boolean).length;
  // ※Secをここで定義すると毎レンダーで再マウントされ入力フォーカスが失われるため、トップレベルのCounselSecを使う
  const Sec = CounselSec;
  const secProps = { total: SEC_TOTAL, doneList: secDone };

  return (
    <div className="min-h-screen">
      <BackHeader title="カウンセリング表" onBack={back} />
      <div className="p-4 pb-8">
        <div className="card-deep p-3.5 flex gap-2.5 items-center">
          <Soupy size={44} animate={false} showZzz={false} />
          <p className="font-maru text-[11.5px] text-night-100 leading-relaxed font-bold">はじめまして！ご来店前に、いまの状態をおしえてね。ぜんぶで{SEC_TOTAL}セクション・約3分だよ！</p>
        </div>

        {/* 入力の進捗（ゴールが見える化） */}
        <div className="card p-3.5 mt-3">
          <div className="flex items-center justify-between mb-1.5">
            <p className="text-[11.5px] font-bold text-cream-50">入力状況 <span className="text-moon-300">{doneCount} / {SEC_TOTAL}</span> セクション</p>
            <p className="text-[10px] font-bold text-night-300">必須は「2. いまのお悩み」のみ</p>
