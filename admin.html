function sleepHours(bed, wake) {
  if (!bed || !wake) return 0;
  const [bh, bm] = bed.split(':').map(Number);
  const [wh, wm] = wake.split(':').map(Number);
  let mins = (wh*60+wm) - (bh*60+bm);
  if (mins <= 0) mins += 24*60;
  return Math.round(mins/6)/10;
}

// 行動チェック（スコア計算・表示ラベル用の要約版）
const HABITS = [
  { id:'sun', label:'朝の光', icon:'☀️', good:true, score:+3, symp:0, para:12 },
  { id:'exercise', label:'日中の運動', icon:'🚶', good:true, score:+3, symp:0, para:10 },

  { id:'caffeine', label:'午後カフェイン', icon:'☕', good:false, score:-4, symp:14, para:0 },
  { id:'phone', label:'寝る前スマホ', icon:'📱', good:false, score:-4, symp:14, para:0 },
  { id:'alcohol', label:'寝酒', icon:'🍺', good:false, score:-4, symp:10, para:0 },
  { id:'lateMeal', label:'遅い食事', icon:'🍜', good:false, score:-3, symp:8, para:0 },
  { id:'longNap', label:'長い昼寝', icon:'💤', good:false, score:-2, symp:5, para:0 },
];
const HABIT = Object.fromEntries(HABITS.map(h => [h.id, h]));

function calcSleepScore(log) {
  const h = sleepHours(log.bed, log.wake);
  let dur;
  if (h >= 7 && h <= 8.5) dur = 40;
  else if ((h >= 6.5 && h < 7) || (h > 8.5 && h <= 9)) dur = 33;
  else if ((h >= 6 && h < 6.5) || (h > 9 && h <= 9.5)) dur = 25;
  else if (h >= 5 && h < 6) dur = 15;
  else dur = 6;
  const quality = Math.round((log.quality - 1) / 4 * 25);
  const awake = Math.max(0, 12 - 4 * (log.awakenings || 0));
  const feel = { 1:2, 2:7, 3:13 }[log.feel] || 7;
  let habit = 0;
  (log.habits || []).forEach(id => { const hh = HABIT[id]; if (hh) habit += hh.score; });
  return clamp(dur + quality + awake + feel + clamp(habit, -10, 10), 0, 100);
}
function calcAutonomic(log) {
  let symp = 0, para = 0;
  (log.habits || []).forEach(id => { const h = HABIT[id]; if (h) { symp += h.symp; para += h.para; } });
  const hours = sleepHours(log.bed, log.wake);
  if (hours < 6) symp += 15; else if (hours >= 7) para += 8;
  if (log.quality <= 2) symp += 12; else if (log.quality >= 4) para += 10;
  if ((log.awakenings || 0) >= 2) symp += 10;
  if (log.feel === 3) para += 8; else if (log.feel === 1) symp += 8;
  return clamp(Math.round(para - symp), -100, 100);
}
function autonomicLabel(v) {

}

function levelFromXp(xp) {
  let lv = 1, rest = xp;
  while (lv < 30) { const need = 60 + (lv - 1) * 30; if (rest < need) return { lv, cur: rest, need }; rest -= need; lv++; }
  return { lv: 30, cur: 0, need: 1 };
}

const ADMIN_KEY = 'sleepy_admin_v1';

function makeLogs(days, fn) {
  const logs = {};
  const today = todayStr();
  for (let i = days; i >= 1; i--) {
    const spec = fn(days - i, i); // (経過index, 何日前)
    if (!spec) continue;
    const log = { bed: spec[0], wake: spec[1], quality: spec[2], awakenings: spec[3], feel: spec[4], habits: spec[5] || [] };
    log.score = calcSleepScore(log);
    log.balance = calcAutonomic(log);
    logs[addDays(today, -i)] = log;
  }
  return logs;
}

function mkTicket(name, total, used, purchasedDaysAgo, months, usedDaysAgos = []) {
  const p = addDays(todayStr(), -purchasedDaysAgo);

}

      stretchLog: (o.stretch || []).map(s => ({ date: addDays(todayStr(), -s.d), stretchId: s.id })),
      learnRead: o.learnRead || [], quizDone: {},
      orders: (o.orders || []).map(x => ({ id: uid(), date: addDays(todayStr(), -x.d), items: x.items, delivery: 'store',
        total: x.items.reduce((a, it) => a + (PRODUCT[it.id]?.price || 0) * it.qty, 0) })),

      quickChecks: o.quick ? [{ id: uid(), date: addDays(todayStr(), -o.quick.d), score: o.quick.score, label: o.quick.label, emoji: o.quick.emoji || '💭', text: '' }] : [],

/* ---- 顧客派生データ ---- */
const cLogs = (c) => Object.keys(c.data.sleepLogs || {}).sort().map(d => ({ date: d, ...c.data.sleepLogs[d] }));
const lastVisitOf = (c) => { const v = c.data.visits || []; return v.length ? v[v.length - 1].date : null; };
const ticketRemainingOf = (c) => (c.data.tickets || []).filter(t => t.expiresAt >= todayStr()).reduce((a, t) => a + (t.total - t.used), 0);
const avgScoreOf = (c, n = 7) => { const l = cLogs(c).slice(-n); return l.length ? Math.round(avg(l.map(x => x.score))) : null; };

function followUpsOf(c) {
  const out = [];
  const lv = lastVisitOf(c);
  if (lv && daysBetween(lv, todayStr()) >= 21) out.push({ type:'visit', label:`来店${daysBetween(lv, todayStr())}日空き` });
  const logs = cLogs(c);
  if (logs.length && daysBetween(logs[logs.length - 1].date, todayStr()) >= 7) out.push({ type:'log', label:'記録が7日以上停止' });
  const remain = ticketRemainingOf(c);
  if (remain === 0 && !c.data.subscription) out.push({ type:'ticket', label:'回数券なし' });
  else if (remain === 1) out.push({ type:'ticket', label:'回数券のこり1回' });
  (c.data.tickets || []).forEach(t => {
    const left = t.total - t.used;
    if (left > 0 && t.expiresAt >= todayStr() && daysBetween(todayStr(), t.expiresAt) <= 30) out.push({ type:'expire', label:`回数券の期限まで${daysBetween(todayStr(), t.expiresAt)}日` });
  });
  const sc = avgScoreOf(c);
  if (sc != null && sc < 55) out.push({ type:'score', label:`平均スコア${sc}点と低め` });
  return out;
}

function useTip() {
  const [tip, setTip] = useState(null);
  const show = (xPct, yPct, main, sub) => setTip(t => (t && t.main === main && t.sub === sub) ? null : { xPct, yPct, main, sub });
  return { tip, show };
}
function TrendChart({ data, height = 150 }) {
  const { tip, show } = useTip();
  if (!data.length) return <EmptyState text="睡眠記録がありません" />;
  const W = 420, H = 150, padL = 30, padR = 14, padT = 16, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = data.length;
  const x = i => padL + (n === 1 ? iw / 2 : i * (iw / (n - 1)));
  const y = v => padT + ih - (v / 100) * ih;
  const line = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d.score).toFixed(1)}`).join(' ');
  const area = `${line} L${x(n - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const labelEvery = Math.ceil(n / 7);
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display:'block', height:'auto' }} role="img" aria-label="睡眠スコアの推移">
        {[0, 50, 100].map(v => (
          <g key={v}>
            <line x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke={v === 0 ? C.axis : C.grid} strokeWidth={1} />
            <text x={padL - 6} y={y(v) + 3.5} fontSize={9} fill={C.muted} textAnchor="end">{v}</text>
          </g>
        ))}
        <path d={area} fill={C.gold} opacity={0.15} />
        <path d={line} fill="none" stroke={C.gold} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round" />
        {data.map((d, i) => (
          <g key={d.date}>
            <circle cx={x(i)} cy={y(d.score)} r={3} fill={C.gold} stroke="#222e4c" strokeWidth={1.5} />
            <circle cx={x(i)} cy={y(d.score)} r={12} fill="transparent"
              onClick={() => show(x(i) / W * 100, y(d.score) / H * 100, `${d.score}点`, fmtMDW(d.date))} />
            {i % labelEvery === 0 && <text x={x(i)} y={H - 7} fontSize={8.5} fill={C.muted} textAnchor="middle">{fmtMD(d.date)}</text>}
          </g>
        ))}
        <text x={x(n - 1)} y={y(data[n - 1].score) - 8} fontSize={11.5} fontWeight="700" fill="#eef1f8" textAnchor="middle">{data[n - 1].score}</text>
      </svg>
      {tip && <div className="viz-tip" style={{ left: tip.xPct + '%', top: tip.yPct + '%' }}>{tip.main}<br /><span className="tip-sub">{tip.sub}</span></div>}
    </div>
  );
}
function Spark({ data, w = 76, h = 26 }) {
  if (!data.length) return <span className="text-[10px] text-night-300">記録なし</span>;
  const n = data.length;
  const x = i => 2 + i * ((w - 4) / Math.max(1, n - 1));
  const y = v => 2 + (h - 4) - (v / 100) * (h - 4);
  const line = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d).toFixed(1)}`).join(' ');
  return <svg width={w} height={h} aria-hidden="true"><path d={line} fill="none" stroke={C.gold} strokeWidth={1.8} strokeLinecap="round" /></svg>;
}

  const todayVisits = cs.flatMap(c => (c.data.visits || []).filter(v => v.date === t).map(v => ({ c, v })));
  const monthVisits = cs.reduce((a, c) => a + (c.data.visits || []).filter(v => v.date >= from30).length, 0);
  const monthSales = cs.reduce((a, c) => a + (c.data.orders || []).filter(o => o.date >= from30).reduce((x, o) => x + o.total, 0), 0);

function CustomerDetail({ id }) {
  const { admin, update, nav, importJsonToCustomer } = useApp();
  const c = admin.customers.find(x => x.id === id);
  const [tab, setTab] = useState('overview');
  const [memo, setMemo] = useState(c ? c.adminMemo : '');
  const [karte, setKarte] = useState(null);
  const [confirmDel, setConfirmDel] = useState(false);
  const fileRef = useRef(null);
  useEffect(() => { if (c) setMemo(c.adminMemo); }, [id]);
  if (!c) return <EmptyState text="お客さまが見つかりません" />;

  const logs = cLogs(c);
  const last = logs[logs.length - 1];
  const lvDate = lastVisitOf(c);
  const level = levelFromXp(c.data.soupy.xp);
  const sub = c.data.subscription && SUB_PLAN[c.data.subscription.planId];
  const follows = followUpsOf(c);
  const assess = (c.data.assessments || [])[c.data.assessments.length - 1];
  const quick = (c.data.quickChecks || [])[c.data.quickChecks.length - 1];
  const presc = c.data.prescription;

  // 姿勢: pairId ごとにまとめる
  const pairs = [];
  const singles = [];
  const byPair = {};
  (c.data.posture || []).forEach(p => {
    if (p.pairId) { (byPair[p.pairId] = byPair[p.pairId] || []).push(p); }
    else singles.push(p);
  });
  Object.values(byPair).forEach(g => {
    const before = g.find(p => p.phase === 'before'), after = g.find(p => p.phase === 'after');
    if (before && after) pairs.push({ before, after }); else singles.push(...g);
  });
  pairs.sort((a, b) => b.after.date.localeCompare(a.after.date));

  const habitCount7 = {};
  logs.slice(-7).forEach(l => (l.habits || []).forEach(h => { habitCount7[h] = (habitCount7[h] || 0) + 1; }));

  const saveMemo = () => { update(st => { const x = st.customers.find(y => y.id === id); if (x) x.adminMemo = memo; }); toast('メモを保存しました'); };
  const exportJson = () => {
    const blob = new Blob([JSON.stringify(c.data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `sleepy_${c.data.profile.memberNo}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const onImportFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { importJsonToCustomer(id, rd.result); };
    rd.readAsText(f);
    e.target.value = '';
  };
  const importFromDevice = () => {
    const raw = localStorage.getItem('sleepy_app_v1');
    if (!raw) { toast('この端末に顧客アプリのデータがありません', 'err'); return; }
    importJsonToCustomer(id, raw);
  };

  const TABS = [
    { id:'overview', label:'がいよう' }, { id:'sleep', label:'すいみん' }, { id:'posture', label:'しせい' },
    { id:'visits', label:'来店' }, { id:'purchase', label:'購入' }, { id:'io', label:'データ' },
  ];

  return (
    <div className="anim-slide-up">
      <button onClick={() => nav('customers')} className="btn-press text-[11.5px] font-bold text-night-200 mb-2">← 顧客一覧へ</button>

        <div className="flex flex-wrap items-center gap-3">
          <span className="w-12 h-12 rounded-full bg-night-500 flex items-center justify-center text-[17px] font-black text-cream-50">{c.data.profile.name.slice(0, 1)}</span>
          <div className="flex-1 min-w-[180px]">
            <p className="text-[16px] font-black text-cream-50">{c.data.profile.name} <span className="text-[10.5px] text-night-300 font-medium">{c.kana}</span></p>
            <p className="text-[10.5px] text-night-200 mt-0.5">{c.data.profile.memberNo} ・ {c.phone || '電話未登録'} ・ お悩み：{GOALS[c.data.profile.goal] || '−'}</p>
            <div className="flex flex-wrap gap-1 mt-1.5">
              <Badge tone="gold">🐑 Lv.{level.lv} {stageTitle(level.lv)}</Badge>
              {sub && <Badge tone="blue">{sub.emoji} {sub.name}</Badge>}
              {follows.map((f, i) => <Badge key={i} tone="red">{f.label}</Badge>)}
            </div>
          </div>
          <div className="text-right">
            <p className="text-[10px] text-night-300">最終来店</p>

                <div className="text-center"><p className="text-[9.5px] font-black text-[#f0968c]">BEFORE</p><p className="text-[22px] font-black text-night-100">{before.score}</p></div>
                <span className="text-moon-300 text-[18px] font-black">→</span>
                <div className="text-center"><p className="text-[9.5px] font-black text-[#4cc2ae]">AFTER</p><p className="text-[26px] font-black" style={{ color: scoreLabel(after.score).color }}>{after.score}</p></div>
                <Badge tone={after.score > before.score ? 'green' : 'gray'}>{after.score > before.score ? `+${after.score - before.score}点 改善` : '維持'}</Badge>
              </div>
              {after.mode === 'side' && (
                <p className="text-[10.5px] text-night-200 text-center mt-2">頭部前方角 {before.metrics.fha?.toFixed(1)}° → <span className="font-black text-[#4cc2ae]">{after.metrics.fha?.toFixed(1)}°</span></p>
              )}
              {after.mode === 'front' && (
                <p className="text-[10.5px] text-night-200 text-center mt-2">肩の傾き {Math.abs(before.metrics.shoulderTilt).toFixed(1)}° → <span className="font-black text-[#4cc2ae]">{Math.abs(after.metrics.shoulderTilt).toFixed(1)}°</span></p>
              )}
            </div>
          ))}
          {singles.map(p => (
            <div key={p.id} className="card px-4 py-3 mb-1.5 flex items-center gap-3">
              <span className="text-[15px]">🧍</span>
              <span className="flex-1 text-[11.5px] font-bold text-cream-50">{fmtJP(p.date)} ・ {p.mode === 'front' ? '正面' : '側面'}（{p.phase === 'normal' ? 'ふだん' : p.phase}）</span>
              <span className="text-[16px] font-black" style={{ color: scoreLabel(p.score).color }}>{p.score}<span className="text-[9px]">点</span></span>
            </div>
          ))}
        </div>
      )}

      {tab === 'visits' && (
        <div className="mt-3 flex flex-col gap-1.5">
          {(c.data.visits || []).length === 0 && <div className="card"><EmptyState emoji="🏥" text="来店記録がありません" /></div>}
          {[...(c.data.visits || [])].reverse().map(v => (
            <div key={v.id} className="card px-4 py-3">
              <div className="flex items-center gap-2.5">
                <span className="text-[14px]">🏥</span>
                <span className="text-[12px] font-black text-cream-50">{fmtJP(v.date)}</span>
                <span className="text-[10.5px] text-night-200 ml-auto">{v.menu}</span>
              </div>
              {v.note && <p className="text-[10.5px] text-night-200 mt-1 pl-6">{v.note}</p>}
              {v.karte && <button onClick={() => setKarte(v.karte)} className="btn-press text-[10.5px] font-black text-moon-300 mt-1.5 pl-6">📄 改善レポートを見る</button>}
            </div>
          ))}
        </div>
      )}

      {tab === 'purchase' && (
        <div className="mt-3">
          <SectionTitle icon="🎫" title="回数券" />
          <div className="flex flex-col gap-2 mb-4">
            {(c.data.tickets || []).length === 0 && <div className="card"><EmptyState text="回数券なし" /></div>}
            {(c.data.tickets || []).map(tk => {
              const left = tk.total - tk.used;
              const expired = tk.expiresAt < todayStr();
              return (
                <div key={tk.id} className={`card p-3.5 ${expired || left === 0 ? 'opacity-60' : ''}`}>
                  <div className="flex items-center gap-3">
                    <span className="text-[18px] font-black text-cream-50 w-14">{left}<span className="text-[10px] text-night-200">/{tk.total}</span></span>
                    <div className="flex-1">
                      <p className="text-[11.5px] font-black text-cream-50">{tk.name}</p>
                      <div className="mt-1"><ProgressBar pct={left / tk.total * 100} color={left && !expired ? C.moon : C.night300} h={6} /></div>
                      <p className="text-[9.5px] text-night-300 mt-0.5">期限 {fmtJP(tk.expiresAt)}{expired && '（期限切れ）'}</p>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          <SectionTitle icon="📅" title="サブスク" />
          <div className="card p-3.5 mb-4">
            {sub
              ? <p className="text-[12px] font-bold text-cream-50">{sub.emoji} {sub.name}（{sub.cadence}・{yen(sub.price)}/月）<span className="text-[10px] text-night-300 ml-1.5">{fmtJP(c.data.subscription.since)}〜</span></p>
              : <p className="text-[11.5px] text-night-200">未加入 {ticketRemainingOf(c) === 0 && <Badge tone="gold">プラン提案チャンス</Badge>}</p>}
          </div>
          <SectionTitle icon="🛍️" title="購入履歴" />
          <div className="flex flex-col gap-1.5">
            {(c.data.orders || []).length === 0 && <div className="card"><EmptyState text="購入履歴なし" /></div>}
            {[...(c.data.orders || [])].reverse().map(o => (
              <div key={o.id} className="card px-4 py-3 flex items-center gap-3">
                <span className="text-[14px]">🛍️</span>
                <span className="flex-1 min-w-0">
                  <span className="block text-[11.5px] font-bold text-cream-50 truncate">{o.items.map(it => `${PRODUCT[it.id]?.name || it.id}×${it.qty}`).join('、')}</span>
                  <span className="block text-[9.5px] text-night-300">{fmtJP(o.date)}</span>
                </span>
                <span className="text-[13px] font-black text-cream-50">{yen(o.total)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab === 'io' && (
        <div className="mt-3">
          <div className="card p-4">
            <p className="text-[12px] font-black text-cream-50 mb-1">📲 顧客アプリからデータを取り込む</p>
            <p className="text-[10.5px] text-night-200 leading-relaxed mb-3">お客さまのアプリ「せってい → データを書き出す」で保存したJSONを取り込むと、このカルテが最新になります。（実運用ではサーバー同期に置き換え）</p>
            <div className="flex flex-wrap gap-2">
              <Btn kind="moon" onClick={() => fileRef.current && fileRef.current.click()}>📁 JSONファイルを取り込む</Btn>
              <Btn kind="ghost" onClick={importFromDevice}>📱 この端末の顧客アプリから取り込む</Btn>
              <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={onImportFile} />
            </div>
          </div>
          <div className="card p-4 mt-3 flex flex-wrap gap-2 items-center">
            <Btn kind="ghost" onClick={exportJson}>💾 この顧客データを書き出す</Btn>
            <Btn kind="danger" onClick={() => setConfirmDel(true)}>🗑️ この顧客を削除</Btn>
          </div>
        </div>
      )}

      <Modal open={!!karte} onClose={() => setKarte(null)}>
        {karte && <div><KarteModalBody karte={karte} /><div className="mt-4"><Btn full onClick={() => setKarte(null)}>とじる</Btn></div></div>}
      </Modal>
      <Modal open={confirmDel} onClose={() => setConfirmDel(false)}>
        <div className="text-center py-2">
          <span className="text-[36px]">🗑️</span>
          <h3 className="text-[15px] font-black text-cream-50 mt-2">{c.data.profile.name}さまのデータを削除しますか？</h3>
          <p className="text-[11px] text-night-200 mt-1.5">この操作は元に戻せません。</p>
          <div className="mt-4 flex gap-2">
            <Btn kind="ghost" full onClick={() => setConfirmDel(false)}>やめる</Btn>
            <Btn kind="danger" full onClick={() => { update(st => { st.customers = st.customers.filter(x => x.id !== id); }); setConfirmDel(false); nav('customers'); toast('削除しました'); }}>削除する</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}

/* ---- 売上 ---- */
function Sales() {
  const { admin, nav } = useApp();
  const from30 = addDays(todayStr(), -30);
  const orders = admin.customers.flatMap(c => (c.data.orders || []).map(o => ({ ...o, cname: c.data.profile.name, cid: c.id }))).sort((a, b) => b.date.localeCompare(a.date));
  const monthOrders = orders.filter(o => o.date >= from30);
  const monthTotal = monthOrders.reduce((a, o) => a + o.total, 0);
  const mrr = admin.customers.reduce((a, c) => a + (c.data.subscription ? (SUB_PLAN[c.data.subscription.planId]?.price || 0) : 0), 0);
  const subCount = admin.customers.filter(c => c.data.subscription).length;
  const rank = {};
  orders.forEach(o => o.items.forEach(it => { rank[it.id] = (rank[it.id] || 0) + it.qty; }));
  const ranking = Object.entries(rank).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxQty = ranking.length ? ranking[0][1] : 1;

  return (
    <div className="anim-slide-up">
      <SectionTitle icon="💰" title="売上" sub="物販・回数券・サブスク（デモ集計）" />
      <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5">
        <StatTile label="直近30日の物販・回数券" value={monthTotal.toLocaleString()} unit="円" />
        <StatTile label="直近30日の注文数" value={monthOrders.length} unit="件" />
        <StatTile label="サブスク会員" value={subCount} unit="名" />
        <StatTile label="サブスク月額(MRR)" value={mrr.toLocaleString()} unit="円" accent="#f6d97e" />
      </div>

      <div className="grid md:grid-cols-2 gap-3 mt-4">
        <div>
          <SectionTitle icon="🏆" title="売れすじランキング" sub="累計販売数" />
          <div className="card p-4">
            {ranking.length === 0 && <EmptyState text="注文がありません" />}
            {ranking.map(([pid, qty], i) => (
              <div key={pid} className="flex items-center gap-2.5 py-1.5">
                <span className="w-5 text-[12px] font-black text-moon-300">{i + 1}</span>
                <span className="w-6 text-[14px]">{PRODUCT[pid]?.emoji}</span>
                <span className="flex-1 text-[11.5px] font-bold text-cream-50 truncate">{PRODUCT[pid]?.name || pid}</span>
                <div className="w-24"><ProgressBar pct={qty / maxQty * 100} color={C.peri} h={7} /></div>
                <span className="w-8 text-right text-[11.5px] font-black text-night-100">{qty}個</span>
              </div>
            ))}
          </div>
        </div>
        <div>
          <SectionTitle icon="🧾" title="最近の注文" />
          <div className="flex flex-col gap-1.5">
            {orders.slice(0, 8).map(o => (
              <button key={o.id} onClick={() => nav('customer', o.cid)} className="btn-press card px-3.5 py-2.5 flex items-center gap-3 text-left">
                <span className="text-[13px]">🛍️</span>
                <span className="flex-1 min-w-0">
                  <span className="block text-[11.5px] font-black text-cream-50">{o.cname}<span className="text-night-300 font-medium text-[9.5px] ml-1.5">{fmtMD(o.date)}</span></span>
                  <span className="block text-[10px] text-night-200 truncate">{o.items.map(it => `${PRODUCT[it.id]?.name || it.id}×${it.qty}`).join('、')}</span>
                </span>
                <span className="text-[12.5px] font-black text-cream-50">{yen(o.total)}</span>
              </button>
            ))}
            {orders.length === 0 && <div className="card"><EmptyState text="注文がありません" /></div>}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---- 設定 ---- */
function AdminSettings() {
  const { admin, update, replaceAll } = useApp();
  const [pin, setPin] = useState(admin.pin);
  const [confirm, setConfirm] = useState(false);
  return (
    <div className="anim-slide-up max-w-lg">
      <SectionTitle icon="⚙️" title="設定" />
      <div className="card p-4">
        <p className="text-[11.5px] font-black text-cream-50 mb-1.5">スタッフPIN（4桁）</p>
        <div className="flex gap-2">
          <input value={pin} onChange={e => setPin(e.target.value.replace(/\D/g, '').slice(0, 4))}
            className="w-28 text-center bg-night-600 border border-night-400/50 rounded-xl px-3 py-2 text-[15px] font-black text-cream-50 outline-none focus:border-moon-400" />
          <Btn small onClick={() => { if (pin.length !== 4) { toast('4桁で入力してください', 'err'); return; } update(st => { st.pin = pin; }); toast('PINを変更しました'); }}>変更する</Btn>
        </div>
      </div>
      <div className="card p-4 mt-3 flex flex-col gap-2">
        <Btn kind="ghost" full onClick={() => setConfirm(true)}>🧪 デモ顧客データをリセット</Btn>
        <a href="index.html" className="btn-press inline-flex items-center justify-center gap-1.5 font-bold rounded-xl px-4 py-2.5 text-[13px] w-full bg-night-600 text-cream-50 border border-night-400/40">📱 顧客向けアプリをひらく</a>
      </div>
      <div className="card p-4 mt-3 text-[10.5px] text-night-200 leading-relaxed">
        <p className="text-[11.5px] font-black text-cream-50 mb-1">このコンソールについて</p>
        <p>顧客データはこの端末のブラウザ（localStorage）にのみ保存されるデモ版です。実運用では認証付きのバックエンド（DB/API）に接続し、顧客アプリと自動同期する構成に置き換えてください。</p>
        <p className="mt-2 text-moon-300 font-bold">─ 睡眠から、人生を変える。─ 株式会社SLEEPY</p>
      </div>
      <Modal open={confirm} onClose={() => setConfirm(false)}>
        <div className="text-center py-2">
          <span className="text-[36px]">🧪</span>
          <h3 className="text-[15px] font-black text-cream-50 mt-2">デモ顧客データで初期化しますか？</h3>
          <p className="text-[11px] text-night-200 mt-1.5">現在の顧客データ・メモはすべて置き換わります。</p>
          <div className="mt-4 flex gap-2">
            <Btn kind="ghost" full onClick={() => setConfirm(false)}>やめる</Btn>
            <Btn kind="danger" full onClick={() => { replaceAll(seedAdmin()); setConfirm(false); toast('初期化しました'); }}>初期化する</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}

/* ---- シェル ---- */
const NAV = [
  { id:'dash', icon:'📊', label:'ダッシュボード' },
  { id:'customers', icon:'👥', label:'顧客' },
  { id:'sales', icon:'💰', label:'売上' },
  { id:'settings', icon:'⚙️', label:'設定' },
];

function App() {
  const [admin, setAdmin] = useState(loadAdmin);
  const [locked, setLocked] = useState(true);
  const [route, setRoute] = useState({ name:'dash', id:null });

  const update = useCallback((fn) => setAdmin(prev => { const n = structuredClone(prev); fn(n); saveAdmin(n); return n; }), []);
  const replaceAll = useCallback((st) => { saveAdmin(st); setAdmin(st); setRoute({ name:'dash', id:null }); }, []);
  const nav = useCallback((name, id) => { setRoute({ name: name === 'customer' ? 'customer' : name, id: id || null }); window.scrollTo(0, 0); }, []);

  const importJsonToCustomer = useCallback((customerId, jsonText) => {
    try {
      const data = JSON.parse(jsonText);
      if (!data || data.version !== 1 || !data.profile) { toast('データ形式が正しくありません', 'err'); return; }
      update(st => {
        const target = customerId ? st.customers.find(x => x.id === customerId)
          : st.customers.find(x => x.data.profile.memberNo === data.profile.memberNo);
        if (target) { target.data = data; target.importedAt = todayStr(); }
        else st.customers.unshift({ id: uid(), kana:'', phone:'', adminMemo:'', importedAt: todayStr(), data });
      });
      toast(`「${data.profile.name || 'ゲスト'}」さまのデータを取り込みました 📲`);
    } catch (e) { console.warn(e); toast('読み込みに失敗しました', 'err'); }
  }, [update]);

  if (locked) return <PinGate pin={admin.pin} onOk={() => setLocked(false)} />;

  let screen = null;
  if (route.name === 'dash') screen = <Dashboard />;
  else if (route.name === 'customers') screen = <Customers />;
  else if (route.name === 'customer') screen = <CustomerDetail id={route.id} />;
  else if (route.name === 'sales') screen = <Sales />;
  else if (route.name === 'settings') screen = <AdminSettings />;

  const activeNav = route.name === 'customer' ? 'customers' : route.name;

  return (
    <Ctx.Provider value={{ admin, update, replaceAll, nav, importJsonToCustomer }}>
      <div className="min-h-screen flex">
        {/* サイドバー（PC） */}
        <aside className="hidden md:flex flex-col w-56 shrink-0 border-r border-night-600/70 bg-night-800/60 p-4 sticky top-0 h-screen">
          <div className="flex items-center gap-2.5 px-1">
            <img src="assets/logo.jpg" alt="" className="w-9 h-9 rounded-xl object-cover border border-night-400/40" onError={e => { e.currentTarget.style.display='none'; }} />
            <div>
              <p className="text-[12.5px] font-black text-cream-50 leading-tight">SLEEPY</p>
              <p className="text-[9px] text-night-200 font-bold">管理コンソール</p>
            </div>
          </div>
          <nav className="mt-6 flex flex-col gap-1">
            {NAV.map(n => (
              <button key={n.id} onClick={() => nav(n.id)}
                className={`btn-press flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-[12.5px] font-black text-left ${activeNav === n.id ? 'bg-moon-400/15 text-moon-300 border border-moon-400/30' : 'text-night-100 hover:bg-night-600/60'}`}>
                <span>{n.icon}</span>{n.label}
              </button>
            ))}
          </nav>
          <div className="mt-auto flex flex-col gap-2">
            <div className="flex justify-center"><Soupy size={80} animate /></div>
            <Btn kind="outline" small onClick={() => setLocked(true)}>🔒 ロックする</Btn>
          </div>
        </aside>

        {/* メイン */}
        <main className="flex-1 min-w-0">
          {/* モバイルヘッダー */}
          <div className="md:hidden sticky top-0 z-40 flex items-center gap-2.5 px-4 py-3 bg-night-900/90 border-b border-night-600/60" style={{ backdropFilter:'blur(10px)' }}>
            <img src="assets/logo.jpg" alt="" className="w-8 h-8 rounded-lg object-cover border border-night-400/40" onError={e => { e.currentTarget.style.display='none'; }} />
            <p className="flex-1 text-[13px] font-black text-cream-50">SLEEPY 管理コンソール</p>
            <button onClick={() => setLocked(true)} className="btn-press text-[15px]" aria-label="ロック">🔒</button>
          </div>
          <div className="p-4 md:p-6 max-w-5xl pb-24 md:pb-8">{screen}</div>
        </main>
      </div>

      {/* モバイル下部ナビ */}
      <div className="md:hidden fixed bottom-0 left-0 right-0 z-50 px-3 pb-3">
        <div className="bg-night-800/95 border border-night-500/60 rounded-2xl flex justify-around px-1 py-2" style={{ backdropFilter:'blur(12px)' }}>
          {NAV.map(n => (
            <button key={n.id} onClick={() => nav(n.id)} className="btn-press flex flex-col items-center gap-0.5 px-3 py-1">
              <span className={`text-[17px] ${activeNav === n.id ? '' : 'grayscale opacity-60'}`}>{n.icon}</span>
              <span className={`text-[9px] font-black ${activeNav === n.id ? 'text-moon-300' : 'text-night-300'}`}>{n.label}</span>
            </button>
          ))}
        </div>
      </div>
    </Ctx.Provider>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (this.state.err) return (
      <div className="min-h-screen flex flex-col items-center justify-center p-8 text-center">
        <span className="text-[40px]">😴💦</span>
        <p className="text-[14px] font-black text-cream-50 mt-3">エラーがおきました</p>
        <p className="text-[10px] text-night-300 mt-2 break-all">{String(this.state.err)}</p>
        <button className="mt-4 px-5 py-2.5 rounded-xl bg-cream-100 text-night-900 font-black text-[13px]" onClick={() => location.reload()}>再読み込み</button>
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
